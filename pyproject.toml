[project]
name = "engineering-agent-lab"
version = "0.1.0"
description = "Agent harness that turns engineering requirements into reproducible model runs and reviewable evidence."
requires-python = ">=3.14"
dependencies = ["numpy>=2.5", "scipy>=1.18", "matplotlib>=3.11"]

[project.optional-dependencies]
dev = ["pytest>=9"]
cad = ["cadquery>=2.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
