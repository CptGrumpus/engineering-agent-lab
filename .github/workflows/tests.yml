name: tests

# Runs the test suite on every push and pull request. Tests that need an
# installed engineering tool (FreeCAD/CalculiX/Gmsh, OpenModelica, OpenFOAM in
# WSL) skip themselves when the tool is absent, so this job covers the harness,
# the independent references, parsers, and the CadQuery geometry checks.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider -rs
