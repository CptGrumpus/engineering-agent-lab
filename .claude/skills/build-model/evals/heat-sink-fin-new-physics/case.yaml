schema_version: "1.1"
name: heat-sink-fin-new-physics
expected_outcome: |
  A new study in a physics area the repo has not covered (steady conduction with
  surface convection). A case file states the requirement (tip temperature at
  least 60 C) and verification tolerances before the evidence run. The model is
  checked against the analytical fin solution (expected tip temperature about
  73 C), with a discretization convergence check and at least one validity check
  on a modelling assumption (for example a small Biot number for 1D conduction).
  An evidence run with verification and a report exists, tests pass, and the
  answer to the user states the result, its uncertainty, and the assumptions.
