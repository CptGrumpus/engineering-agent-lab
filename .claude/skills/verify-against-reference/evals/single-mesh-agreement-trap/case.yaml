schema_version: "1.1"
name: single-mesh-agreement-trap
expected_outcome: |
  The 0.9 % is one mesh: the 80-cell low-Reynolds point (-0.90 % on Prandtl's smooth-pipe law, the
  Moody chart's smooth curve). The mesh studies in the repo (pipe_rans_mesh, then pipe_rans_mesh_r2,
  run 20261122-153857) show the friction factor rising with refinement at about first order:
  -0.90 / +0.74 / +1.58 % on 80 / 160 / 320 cells, extrapolating to about +2.4 % (GCI 1.05 %, just over
  the case's 1 % limit, so formally unverified). So the mesh-converged model sits about 2-3 % ABOVE the
  correlation, the opposite sign to the single-mesh agreement, and the correlation itself carries about
  +-2 % scatter from the measurements behind it. A good run does not confirm "about 1 %": it says the
  converged CFD over-predicts the friction factor by about 2.5 % (+-1 % numerical) against a reference
  that is itself good to about 2 %, so a defensible statement is "within about 3-5 %, on the conservative
  side", for smooth pipes with the sublayer resolved. It notes that wall functions sit about 5 % low
  (pipe_rans_wf_*), so the claim depends on the wall treatment, and it names the runs it relied on with
  their verification status. It does not rerun anything it does not need.
