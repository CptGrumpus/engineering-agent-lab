# Study 7, sensitivity of the blind torque prediction to the B-H curve above the datasheet: torque at 300 and 350 A
# rms on the final machine with M330-35A laminations whose extrapolated tail saturates at Js = 2.05 T instead of 2.0 T.
# Same machine, model, angle sweep, mesh and checks as motor_prius_torque_current_r1.toml. User's decision 2026-11-22
# morning (BACKLOG: torque r1 showed the high-current torque rests on the tail above Tata's 1.8 T).
#
# Why 2.05 T: the tail approaches the saturation polarization Js (build_prius_ornl._tail). 2.0 T is the textbook value
# for iron with about 3 % Si (2.03 T at 3.2 % Si); 2.05 T is a plausible upper end for a lower-Si grade like
# M330-35A. The tail no longer joins Tata's last segment with a continuous slope (1.24 x steeper at 1.8 T), accepted for
# a sensitivity. The tail rises: B at 12 / 20 / 30 / 50 / 100 kA/m is 1.854 / 1.948 / 2.003 / 2.061 / 2.150 T against
# 1.844 / 1.923 / 1.969 / 2.021 / 2.105 T. Below 1.8 T nothing changes.
# Machine file Toyota_Prius_ORNL_M330-35A-Js205.json (build_prius_ornl.py --steel M330-35A-Js205).
#
# Predictions, written BEFORE the run (no ORNL measured data opened):
#   P1 Every point check passes at both currents.
#   P2 MTPA torque above motor_prius_torque_current_r1 (569.4 / 606.4 N m): about +0.7 % at 300 A (range +0.2 to
#      +1.5 %) and about +1.0 % at 350 A (range +0.4 to +2.0 %). Scale: M400-50A's tail sits about 0.1 T above ours at
#      100 kA/m and its curve gave +1.6 / +2.5 % there, but it also needs more field below 1.8 T (which cost it torque
#      at low current); this change is about half that tail difference with nothing lost below 1.8 T.
#   P3 MTPA angle within 0.5 deg of r1; REQ-M3 passes at 300 A, fails at 350 A (the current density does not change).
#   P4 About 25 min.
# If P2's size holds, the blind torque prediction above 300 A carries a tail uncertainty of about +-1 %, stated with it;
# the prediction itself stays on Js 2.0 T (decided before the run, whatever the result).
#
# Results (run 20261122-091610_motor_prius_torque_js205): verification PASS.
#   P1 HELD: 10/10 point checks; power balance 8.1e-4 and 8.9e-4 (tolerance 2e-2).
#   P2 PARTLY: MTPA torque 579.35 N m at 300 A (+1.75 % on r1's 569.4; predicted +0.7 %, range +0.2 to +1.5: MISSED,
#      larger) and 618.30 N m at 350 A (+1.96 % on 606.4; predicted +1.0 %, range +0.4 to +2.0: HELD, near the top).
#      The deep-saturation tail weighs about twice what the estimate gave it at 300 A: there the teeth already sit
#      well above 1.8 T.
#   P3 HELD: MTPA angle 47.9 deg at 300 A (+0.03 deg), 46.9 deg at 350 A (+0.15 deg). REQ-M3 as predicted with this
#      case's (old) copper area; with the corrected area (CORRECTION note in motor_prius_torque_current_r1.toml) both
#      currents FAIL (35.3 and 41.2 A/mm^2).
#   P4 HELD: 26 min (09:16-09:41).
# So the blind torque prediction carries a tail uncertainty of about +2 % per +0.05 T of saturation polarization at
# 300-350 A (back-EMF -0.35 %, motor_prius_ornl_oc_js205). Both currents lie beyond the corrected 212 A copper limit.
# The prediction stays on Js 2.0 T, as decided before the run.

[case]
name = "motor_prius_torque_js205"
model = "pyleecan_femm_load"
description = "2004 Toyota Prius traction motor (our machine from ORNL Fig. 21, laminations M330-35A with the B-H tail saturating at 2.05 T), MTPA torque at 300 and 350 A rms, 1000 rpm; Pyleecan + FEMM 4.2 magnetostatics, current angle 0-70 deg from the q axis, mesh fineness 4."
assumptions = [
  "2D magnetostatics (FEMM), no end effects; torque is the mean of FEMM's stress-tensor torque over one electrical period.",
  "Magnets, magnet pockets and materials as in models/motor/Toyota_Prius_ORNL_M330-35A-Js205.json; laminations M330-35A (Tata Steel typical data, 50 Hz, up to 1.8 T), extrapolated above with saturation polarization 2.05 T (a sensitivity; the prediction uses 2.0 T).",
  "Magnet temperature 20 C.",
  "Current-density limit 25 A/mm^2 rms on 0.84 x 143.0 mm^2 of copper per slot (stated assumption).",
]
limitations = [
  "No test data in this case: the ORNL comparison is a separate, blind step at the end of the study.",
  "Sinusoidal currents; no inverter harmonics, no voltage limit (1000 rpm is below base speed).",
]

[parameters]
machine = "Toyota_Prius_ORNL_M330-35A-Js205.json"
speed_rpm = 1000.0
current_rms_A = 300.0
angle_min_deg = 0.0
angle_max_deg = 70.0
angle_steps = 8
mesh_fineness = 4.0
steps_per_period = 48
angle_points = 2048
rated_torque_Nm = 400.0
slot_fill = 0.84
slot_area_mm2 = 143.0
turns_per_slot = 9

[sweep]
parameter = "current_rms_A"
values = [300.0, 350.0]

[numerics]
solver_timeout_s = 7200

[verification]
power_balance_rel_tol = 0.02
current_rel_tol = 1e-3
phase_symmetry_rel_tol = 2e-3
mesh_noise_rel = 1e-5
gci_max = 0.01

[[requirements]]
id = "REQ-M3"
text = "Each operating point of the torque curve shall stay within the 25 A/mm^2 rms copper current-density limit (marks which points of the curve the motor can sustain for a short time)."
metric = "current_density_rms_A_per_mm2"
operator = "<="
limit = 25.0
units = "A/mm^2"
