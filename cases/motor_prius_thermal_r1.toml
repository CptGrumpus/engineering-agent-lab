# Study 7, thermal network, revision 1 of motor_prius_thermal (read it for the decision, sources, hand estimate and
# the first run's Results). Same parameters, scenarios, requirement and tolerances. What changes, and why:
#
# 1. Slot hotspot (models/motor/thermal_network.py slot_hotspot). The first run (20261122-174048) failed
#    section_wind_peak in every scenario: the network's slot peak rise was 7-14 % under CalculiX's. The FE peak sits at
#    the top of the slot, by the tooth tips, where the teeth are hottest (FE teeth max 134.3 C against a mean of
#    127.2 C nominal): the teeth carry the winding's heat from their flanks out to the yoke, so their bore face is the
#    hottest iron, and the narrow top of the winding (2.65 mm inside the liner) sits on it. The slab factor puts the
#    peak at the mean wall temperature instead. New: slot hotspot = max(slab value, T_B + q (w / 2) t_liner / k_liner
#    + q w^2 / (8 k_winding)), T_B the network's tooth bore-face temperature, w the winding's top width, q its loss
#    per volume. Derived from where the FE put the peak (seen in the first run), not fitted to its value: no factor
#    is tuned. The same estimate goes into the envelope (the winding hotspot limit) and into the section check.
# 2. fe_mesh noise floor 1e-4 (was the routine's 1e-5): the .frd holds 6 significant digits (0.001 K, about 1.5e-5 of
#    the 70 K rise) and the peak is a nodal maximum; teeth_0p75 read 139.363 C on all three meshes and was classed
#    divergent. The tolerance (1 %) is unchanged.
# 3. The CalculiX logs are copied into each point (the harness writes the home folder as ~ in the outputs, so the
#    first run never found its work folder, and left it behind).
# The winding-mean shortfall (-3 to -6.4 %; fails at interface 0.01 mm) is not changed: no physical cause identified
# beyond the lumped flank model; it stays as a model-form result.
#
# Predictions, written BEFORE this run (no run of the revised model yet; hand reasoning from the first run's numbers):
#   P1 section_wind_peak within 3 % in every scenario (nominal: network B about 133-135 C, plus about 3.1 K liner and
#      1.6 K winding, against FE 139.4 C). Mean, teeth and yoke errors unchanged to 1e-6 (the network's temperatures
#      do not change, only the hotspot read from them). GCI passes in every scenario.
#   P2 Verification PASS in nine scenarios; interface_0p01 still FAILs on section_wind_mean (-6.4 %).
#   P3 The envelope and every metric unchanged to 0.1 N m and 0.1 K in every scenario: the top-of-slot estimate is
#      larger than the slab one (by 1-6 K) but stays under the end-turn hotspot at low speed and far under 180 C at
#      high speed, and the magnets bind. REQ-TH1 30.2 kW nominal, now verified PASS; 26.2-34.3 kW over the scenarios.
#   P4 The FE logs (geo, gmsh and ccx logs, sta) appear under each point's solver/ folder; no temp folder left behind.
#
# Results (run 20261122-174925_motor_prius_thermal_r1, 5 min): verification PASS in four scenarios (jacket_h1000,
# interface_0p08, end_space_half, air_gap_x3), FAIL in six on section_wind_peak, by 0.1-2.2 points (nominal -5.25 %),
# plus section_wind_mean in interface_0p01 (-6.4 %). REQ-TH1 30.2 kW nominal, PASS but unverified; verified PASS in the
# four passing scenarios (28.0 / 26.2 / 27.6 / 29.6 kW).
#   P1 MISSED: the top-of-slot estimate halved the peak shortfall (-10.4 to -5.25 % nominal; -3.8 to -7.2 % over the
#      scenarios) but did not bring it within 3 %. Mean, teeth and yoke errors unchanged (held); every GCI passes
#      (converged regime, held). What is left: the wall at the slot top is hotter than the tooth's bore face alone, and
#      the narrow top is not a long slab; the remaining 3-4 K is the 2D field the lumped model leaves out.
#   P2 MISSED: four scenarios pass, not nine (the peak still fails in six).
#   P3 HELD for the envelope and every metric (unchanged to 1e-3 in all ten scenarios); the winding hotspot moved by up
#      to 6.7 K (8.2 K at teeth 0.75), at high speed where the slot sets it, against the 1-6 K predicted.
#   P4 HELD: FE logs under points/*/solver/fe_0..2; no temp folders left.
# Does the remaining shortfall matter? Bound: scale every envelope point's slot hotspot rise by its scenario's FE
# shortfall (1 / (1 + err), conservative: it applies the cross-section's error to the whole rise). The slot hotspot then
# stays under the end-turn hotspot and under 180 C at every speed in every scenario but one: winding k 0.5x at 750 rpm
# (181.6 C), below REQ-TH1's range. So the envelope from 1250 rpm, REQ-TH1 and the hot-corner result do not depend on
# it; the network's slot hotspot is reported as about 5 % low on its rise. Not revised further: the decision does not
# move, and a better slot hotspot needs a 2D model of the slot, which is what the check is.
#
# Requirements and tolerances were fixed BEFORE the first run (motor_prius_thermal) and are unchanged.

[case]
name = "motor_prius_thermal_r1"
model = "lumped_thermal"
description = "2004 Toyota Prius traction motor (our machine): steady lumped thermal network from the geometry, coupled to the verified dq tables (losses at the network's temperatures); continuous torque-speed envelope 500-6000 rpm within a 180 C winding hotspot and 150 C magnets under a synthetic 65 C water jacket, and the magnet temperature where the winding mean reaches the efficiency map's 100 C; nominal and nine sensitivity scenarios; CalculiX slot-pitch conduction check."
assumptions = [
  "Steady state; continuous duty. Losses: copper (DC resistance at each winding part's temperature) and iron (the tables' stator and rotor coefficients); no AC copper, magnet eddy-current or mechanical loss (as in the efficiency study). Magnets carry no loss, so they sit at the rotor's mean temperature.",
  "Tables blended linearly in magnet temperature between the cold (20 C) and hot (80 C) runs; above 80 C this is an extrapolation (linear reversible Br loss), reported as magnet_extrapolation_above_hot_table_K.",
  "Cooling synthetic (user, 2026-11-22): water-glycol jacket 65 C, h 3000 W/m^2 K on the housing over the stack and end-winding extensions; the result scales with it through the jacket scenarios.",
  "Limits synthetic (user, 2026-11-22): winding hotspot 180 C (class H), magnets 150 C.",
  "Stator-housing interface: an equivalent air gap of 0.037 mm (Staton et al. 2005 Table III average of measured machines); swept 0.01 / 0.08 mm.",
  "End-space convection from correlations measured on TEFC induction motors (Boglietti and Cavagnino 2007 form; Micallef constants), v = rotor peripheral speed; scenario 0.5x.",
  "Air gap: conduction only (Nu = 2), the lower bound; scenario 3x. Shaft adiabatic: no heat path through the shaft and bearings (conservative for the rotor).",
  "Slot hotspot: the larger of the slab value (winding surface + 1.5 (mean - surface)) and the top-of-slot value (tooth-tip temperature + liner drop + local slab rise across the top width; revision 1); checked against the CalculiX section's peak. End-turn hotspot: slot exit + 1.5 (mean - slot exit), not checked by FE.",
  "Stator iron loss split 0.57 teeth / 0.43 yoke (area x B^2 estimate); scenarios 0.4 and 0.75.",
]
limitations = [
  "No test data: thermal is not in the agreed ORNL validation set.",
  "The CalculiX check covers the stator cross-section only; the axial copper paths, end windings, end space and rotor are network-only (their T-equivalents are exact for 1D conduction, tests/test_motor_thermal.py).",
  "Steady state only: no transient (peak) ratings.",
  "Material conductivities and the slot liner are typical values, not measured on this machine.",
]

[parameters]
# geometry (mm), models/motor/Toyota_Prius_ORNL.json and the efficiency case
n_slots = 48
stack_length_mm = 83.82
stator_outer_radius_mm = 134.62
stator_bore_radius_mm = 80.9625
slot_shoulder_x_mm = 81.9727
slot_width_shoulder_mm = 3.1496
slot_width_round_mm = 5.6388
slot_round_centre_x_mm = 111.6653
slot_opening_mm = 1.9304
liner_thickness_mm = 0.25            # synthetic
copper_area_per_slot_mm2 = 76.4
rotor_outer_radius_mm = 80.1878
rotor_inner_radius_mm = 55.3212
end_connection_length_mm = 120.6
end_extension_mm = 38.4
# materials and cooling
impregnant_conductivity_W_mK = 0.25  # synthetic
copper_conductivity_W_mK = 390.0
liner_conductivity_W_mK = 0.2        # synthetic
lamination_conductivity_W_mK = 28.0  # synthetic, in plane
housing_conductivity_W_mK = 160.0    # synthetic, aluminium
housing_wall_mm = 6.0                # synthetic
interface_gap_mm = 0.037             # Staton et al. 2005 Table III average
jacket_htc_W_m2K = 3000.0            # synthetic (user)
coolant_temperature_C = 65.0         # synthetic (user)
air_gap_h_factor = 1.0
end_space_h_scale = 1.0
winding_k_scale = 1.0
teeth_iron_fraction = 0.57
h_winding_end_space_k1 = 15.0
h_winding_end_space_k2 = 6.0
h_winding_end_space_k3 = 0.9
h_housing_end_space_k1 = 20.0
h_housing_end_space_k2 = 8.7
h_housing_end_space_k3 = 0.7
h_rotor_end_space_k1 = 41.4
h_rotor_end_space_k2 = 6.22
h_rotor_end_space_k3 = 1.0
# electrical (as the efficiency case) and the searches
lut_run_cold = "20261122-102002_motor_prius_lut_cold,20261122-133946_motor_prius_lut_cold_lowiq"
lut_run_hot = "20261122-115824_motor_prius_lut_hot,20261122-143828_motor_prius_lut_hot_lowiq"
efficiency_run = "20261122-153450_motor_prius_efficiency_r1"
series_turns_per_phase = 72
turn_copper_area_mm2 = 8.492
stack_length_m = 0.08382
end_connection_length_m = 0.1206
copper_resistivity_20C_ohm_m = 1.72e-8
copper_alpha_per_K = 0.00393
bus_voltage_V = 500.0
current_limit_design_A = 212.0
winding_hotspot_limit_C = 180.0      # class H (user)
magnet_limit_C = 150.0               # (user)
speed_min_rpm = 500.0
speed_max_rpm = 6000.0
speed_step_rpm = 250.0
hot_corner_winding_C = 100.0
fe_reference_speed_rpm = 3000.0

[[sweep.scenarios]]
name = "nominal"

[[sweep.scenarios]]
name = "jacket_h1000"
jacket_htc_W_m2K = 1000.0

[[sweep.scenarios]]
name = "jacket_h6000"
jacket_htc_W_m2K = 6000.0

[[sweep.scenarios]]
name = "interface_0p01"
interface_gap_mm = 0.01

[[sweep.scenarios]]
name = "interface_0p08"
interface_gap_mm = 0.08

[[sweep.scenarios]]
name = "end_space_half"
end_space_h_scale = 0.5

[[sweep.scenarios]]
name = "air_gap_x3"
air_gap_h_factor = 3.0

[[sweep.scenarios]]
name = "winding_k_half"
winding_k_scale = 0.5

[[sweep.scenarios]]
name = "teeth_0p40"
teeth_iron_fraction = 0.40

[[sweep.scenarios]]
name = "teeth_0p75"
teeth_iron_fraction = 0.75

[numerics]
solver = "numpy linear network; fixed-point loss-temperature iteration; bisection to 0.05 N m; CalculiX 2.22 steady heat transfer on Gmsh 6-node triangles"
fe_element_size_mm = 0.4             # winding element size on the coarsest of three meshes (0.4 / 0.283 / 0.2 mm)

[verification]
balance_rel_tol = 1e-9               # exact linear solve: anything larger is a wiring error
coupling_tol_K = 0.1                 # the operating point moves on a 1 A grid; 0.1 K is far below the limits' meaning
consistency_rel_tol = 1e-6           # same tables, same resistance, same search: must reproduce the efficiency run
fe_balance_rel_tol = 1e-3            # film heat integrated by Simpson on curved quadratic edges
fe_gci_tol = 0.01                    # the reference must be converged well inside the 5 % comparison
section_rise_rel_tol = 0.05          # model form (lumped vs 2D): 5 % of the rise is about 2.5 % of continuous torque (rise ~ I^2)

[[requirements]]
id = "REQ-TH1"
text = "The motor shall deliver at least 25 kW continuously (steady state, winding hotspot <= 180 C, magnets <= 150 C) at every speed from 1250 rpm (just above the 1194 rpm rated base speed) to 6000 rpm, under the stated jacket."
metric = "min_continuous_power_kW"
operator = ">="
limit = 25.0
units = "kW"
