# Turek-Hron CFD1: steady laminar flow (Re 20) round the cylinder and its rigid flag, the fluid stage
# of study 6 (FSI). Each participant is verified on its own before coupling: the solid stage is
# flag_csm1_mesh / flag_csm2_mesh / flag_csm3_dt; this is the fluid one, on OpenFOAM 14 (openfoam.org),
# with the coupled stage to follow on OpenFOAM v2512 + preCICE.
#
# Reference (featflow.de FSI benchmark, CFD tests, finest level 6+0): CFD1 drag 14.2929, lift 1.11905
# N/m (forces on cylinder + flag per metre depth; rho 1000 kg/m3, nu 1e-3 m2/s, U_mean 0.2 m/s,
# parabolic inflow 1.5 U_mean at mid-channel).
#
# Prototype (hand runs, scratch, h at the body 5 / 2.5 / 1.25 mm, far field 6 h):
#   3326 / 13047 / 52321 cells; drag 14.193 / 14.270 / 14.292, lift 1.1002 / 1.1121 / 1.1120 N/m; SIMPLE
#   converged (p 1e-10, U 1e-11) in 240 / 411 / 1266 iterations, 3 / 13 / 160 s. A first attempt to vary
#   the size with gmsh -setnumber silently kept the coarse mesh (DefineNumber not overridden): the writer
#   now puts the sizes in the .geo directly.
#
# Smoke test (scratch, 5 mm, before the evidence run): parabolic_inflow FAILED, peak inlet velocity
#   0.2948 against 1.5 U = 0.3 (1.7 %). flowRateInletVelocity's laminarBL profile uses the distance to
#   the nearest wall-type patch, and with the body typed `wall` the cylinder (0.15 m from mid-inlet) was
#   nearer than the channel walls (0.2 m), flattening the profile. Fix: the body stays a plain patch
#   (no-slip all the same; nothing else uses its type in laminar flow). The prototype forces above came
#   from the flattened inflow; predictions unchanged in form, values to be confirmed.
#
# Smoke test (scratch, 5 mm, before the evidence run): parabolic_inflow FAILED, peak inlet velocity
#   0.2948 against 1.5 U = 0.3 (1.7 %). A first guess (the cylinder counted as the nearest wall) was
#   tested and wrong: retyping the body changed nothing, to the last digit. Face by face, the profile was
#   +1.5 % near the walls and -1.6 % mid-channel: flowRateInletVelocity's laminarBL normalises the wall
#   distance by the largest distance among the inlet faces (0.198 m here), not by H/2 (0.205 m), then
#   rescales to the flow rate. Fix: fixedProfile with the benchmark's parabola as a 4001-point table,
#   sampled at the face centres. Checks revised before the evidence run: inflow_profile (face values vs
#   the parabola, 1e-6) replaces the peak check; flow_rate now carries the midpoint-sampling error of the
#   parabola, 0.5 (face width / H)^2, about 1e-3 on the coarsest inlet, so its tolerance is 5e-3 (it
#   converges with the mesh, and the forces' GCI includes it). The prototype forces above came from the
#   flattened inflow; P2 and P3 stand in form, the values may shift.
#
# Predictions, written BEFORE the evidence run:
#   P1 Every point check passes on every mesh.
#   P2 Drag converges monotonically to about 14.30 (observed order near 2, GCI under 0.2 %): REQ-F1
#      passes, within 0.05 % at the finest mesh.
#   P3 Lift is flat between the two finer meshes at 1.112, 0.6 % under the benchmark: the three values
#      read as oscillatory with an uncertainty near 0.7 %. REQ-F2 (2 %) passes; the 0.6 % gap stays
#      open (a finer level or the benchmark's own mesh level would tell whether it is ours).
#
# Results (run 20261121-140245_turek_hron_cfd1_mesh): every point check passes on every mesh (inflow
#   profile 6e-8, flow-rate sampling 1.1e-3 / 3.0e-4 / 7.3e-5, mass 1e-13). Drag 14.2595 / 14.2940 /
#   14.2980 N/m (0.23 / 0.007 / 0.036 % from the benchmark); lift 1.10893 / 1.11534 / 1.11275 N/m.
#   Lift: oscillatory, uncertainty 0.36 %: REQ-F2 verified PASS (0.56 % from the benchmark; P3 held in
#   size). Drag: observed order 3.15, more than 1.5 x the design order 2, so the GCI gives no estimate
#   ("anomalous order") and REQ-F1 is withheld, although every mesh is within 0.24 % of the benchmark.
#   P2 missed (predicted order near 2). As in strap_proof_r1, the coarsest mesh (3326 cells) is likely
#   outside the asymptotic range: superseded by turek_hron_cfd1_mesh_r1 (2.5 / 1.25 / 0.625 mm).

[case]
name = "turek_hron_cfd1_mesh"
model = "openfoam_turek_hron"
description = "Turek-Hron CFD1: steady laminar flow (Re 20) in a 2.5 x 0.41 m channel round a cylinder (r 0.05 m) with a rigid 0.35 x 0.02 m flag; OpenFOAM 14 on a Gmsh quad-dominant mesh, body cell size 5 / 2.5 / 1.25 mm; drag and lift against the published benchmark."
assumptions = [
  "2D (one cell deep, empty front and back), as the benchmark defines it.",
  "Steady flow: at Re 20 the wake is steady; the SIMPLE residual targets and the settled force history check it.",
  "The flag is rigid and fixed (the CFD tests make it so by a huge stiffness and density).",
  "Inflow: the benchmark's parabolic profile at the full mean velocity (the steady tests have no time ramp).",
]
limitations = [
  "A solver-qualification case: it shows that the fluid participant reproduces the published fluid-only forces, not that the coupled result is right.",
  "Pressure outlet at 2.5 m as in the benchmark; no separate domain-length study.",
]

[parameters]
mean_velocity_m_per_s = 0.2
kinematic_viscosity_m2_per_s = 0.001
density_kg_per_m3 = 1000.0
flag_length_m = 0.35
cell_size_m = 0.0025
benchmark_drag_N_per_m = 14.2929
benchmark_lift_N_per_m = 1.11905

[sweep]
parameter = "cell_size_m"
values = [0.005, 0.0025, 0.00125]

[numerics]
max_iterations = 8000
residual_p = 1e-10
residual_U = 1e-11

[verification]
forces_settled_max = 1e-6
flow_rel_tol = 5e-3
mass_rel_tol = 1e-6
profile_rel_tol = 1e-6
gci_max = 0.01

[[requirements]]
id = "REQ-F1"
text = "Before it is coupled to the solid, the fluid model shall reproduce the Turek-Hron CFD1 drag within 1 %."
metric = "drag_deviation_pct"
operator = "<="
limit = 1.0
units = "%"

[[requirements]]
id = "REQ-F2"
text = "It shall reproduce the CFD1 lift within 2 % (lift is a small difference of large pressure forces, about 8 % of the drag)."
metric = "lift_deviation_pct"
operator = "<="
limit = 2.0
units = "%"
