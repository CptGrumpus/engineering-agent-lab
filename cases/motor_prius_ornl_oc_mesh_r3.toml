# Study 7, open circuit, revision 3 of our machine: the laminations are now M330-35A, the study's single stand-in
# steel (user's decision 2026-11-22 ~00:40, BACKLOG). Same geometry, magnets, model, sweep, requirement and tolerances
# as motor_prius_ornl_oc_mesh_r2.toml; read it (and r1, and motor_prius_ornl_oc_mesh.toml) for the background.
#
# Why: until now the electromagnetics used the M400-50A B-H curve (0.5 mm) that came with Pyleecan's file and was never
# chosen, while the overspeed check and the loss data use M330-35A (0.35 mm, closer to ORNL's 0.36 mm). ORNL gives the
# thickness but not the grade. models/motor/build_prius_ornl.py (--steel, default M330-35A) now writes Tata Steel's
# M330-35A typical B-H curve (50 Hz, 0.1-1.8 T) into both laminations, extended above 1.8 T by our extrapolation
# (saturation polarization 2.0 T, slope-continuous; build_prius_ornl._tail), with M330-35A's density, resistivity and
# modulus. A design-input correction made before the ORNL data is opened, with this written reason. r2 (M400-50A) stays
# as the "inherited steel" side of the sensitivity.
#
# The two curves: M330-35A needs much less field below 1.7 T (1.0 T: 114 against 250 A/m; 1.3 T: 242 against 950;
# 1.5 T: 1027 against 2450; 1.7 T: 5409 against 6700). Above about 28 kA/m our M330-35A tail gives the lower flux
# density (100 kA/m: 2.105 against 2.20 T).
#
# Predictions, written BEFORE the run (no ORNL measured data opened; r2's results not yet read):
#   P1 Every point check passes on every mesh.
#   P2 Back-EMF about +2.0 % on r2's finest-mesh value (range +1.0 to +3.5 %). Magnetic circuit: B ~ Br / (1 + x), x the
#      external MMF drop over the magnet MMF, about 0.14 (r1). Iron is roughly 30 % of that drop with M400-50A (teeth
#      near 1.5-1.6 T over 33.5 mm, yoke near 1.3-1.4 T); M330-35A about halves it, so x falls to about 0.12:
#      1.14 / 1.12 = +1.8 %. The bridges, saturated, carry slightly less leakage flux on the lower tail: +0.1 to +0.5 %.
#   P3 GCI under 1 %; REQ-M1 a verified fail, about 2 % above r2's value (near 1030 V).
#   P4 Solve times as r2 (about 20 s / 80 s / 9 min).
# Its finest-mesh back-EMF becomes the blind prediction (with M330-35A as the stand-in steel).
#
# Results (run 20261122-014658_motor_prius_ornl_oc_mesh_r3): verification FAIL on the REQ-M1 metric's GCI only.
#   P1 HELD: 15/15 point checks; winding theory 0.20-0.21 %.
#   P2 HELD (inside the range, near its low end): back-EMF 111.006 / 110.936 / 110.884 V per 1000 rpm at fineness
#      2 / 4 / 8, +1.08 % on r2's finest (109.699 V) against +2.0 % (+1.0 to +3.5 %). The iron's share of the external
#      MMF drop was smaller than the estimate's 30 %, or the bridges gained less.
#   P3 PARTLY: flux-linkage GCI 0.16 % (monotone, order 0.44, extrapolated 0.215856 Wb, i.e. 110.74 V). The 6000 rpm
#      peak is 1038.68 / 1040.31 / 1040.43 V: monotone but at an anomalous observed order (3.8 against 2), so the
#      harness gives no uncertainty and REQ-M1 is formally withheld (the fine-mesh GCI would be 1e-5). Verdict not in
#      doubt: 1040 V against the 500 V bus, +1.2 % on r2 (predicted about +2 %).
#   P4 HELD: 21 s / 79 s / 438 s.
# BLIND BACK-EMF PREDICTION (stand-in steel M330-35A, 20 C): 110.9 V rms line-to-line per 1000 rpm, mesh uncertainty
# 0.16 %; with Pyleecan's inherited M400-50A it would be 109.7 V (r2). The M250-35A bracket is still to run.

[case]
name = "motor_prius_ornl_oc_mesh_r3"
model = "pyleecan_femm"
description = "2004 Toyota Prius traction motor rebuilt from ORNL/TM-2005/33 Fig. 21 (radii, air gap 0.775 mm, slot, pocket thickness and position), ORNL/TM-2004/120 (bridge) and ORNL/TM-2004/137 Fig. 14 (magnet B-H line), laminations M330-35A (stand-in grade), at open circuit, 1000 rpm; Pyleecan + FEMM 4.2 magnetostatics over one electrical period (48 steps), mesh fineness 2 / 4 / 8; back-EMF and the uncontrolled-generator voltage at top speed."
assumptions = [
  "2D magnetostatics (FEMM), no end effects: the stack (83.8 mm) is long against the air gap (0.775 mm), but end-winding leakage and axial fringing are not modelled.",
  "Stator, rotor, slot and pocket thickness from ORNL/TM-2005/33 Fig. 21; bridge 1.45 mm from ORNL/TM-2004/120; magnet Br 1.243 T and recoil permeability 1.129 from ORNL/TM-2004/137 Fig. 14 (temperature not stated, taken as 20 C); magnet width and winding still Pyleecan's.",
  "Laminations M330-35A, a stand-in: ORNL gives the thickness (0.36 mm) but not the grade. B-H curve from Tata Steel's typical data (50 Hz) up to 1.8 T, extrapolated above (saturation polarization 2.0 T).",
  "Magnet temperature 20 C; Br falls about 0.1 %/K, so a hot motor has a lower back-EMF (stated, not modelled here).",
  "Maximum speed 6000 rpm, the commonly published rating for this motor; ORNL's design report tabulates ratings only up to base speed.",
]
limitations = [
  "No test data in this case: the ORNL comparison is a separate, blind step.",
  "The magnet fills the pocket thickness (HoleM50); TM-2004/120 gives a thinner magnet (5.31 mm), not modelled.",
  "Line-to-line peak from the phase flux linkages with their harmonics; the inverter's own clamping is not modelled.",
  "The real lamination grade is unknown; the bracketing grades (M250-35A, a high-strength rotor grade) are separate cases.",
]

[parameters]
machine = "Toyota_Prius_ORNL.json"
speed_rpm = 1000.0
id_A = 0.0
iq_A = 0.0
mesh_fineness = 1.0
steps_per_period = 48
angle_points = 2048
max_speed_rpm = 6000.0
bus_voltage_V = 500.0
rated_torque_Nm = 400.0

[sweep]
parameter = "mesh_fineness"
values = [2.0, 4.0, 8.0]

[numerics]
solver_timeout_s = 3600

[verification]
phase_symmetry_rel_tol = 1e-3
phase_shift_deg_tol = 0.5
winding_theory_rel_tol = 0.02
open_circuit_torque_rel_tol = 1e-3
mesh_noise_rel = 1e-5
gci_max = 0.01

[[requirements]]
id = "REQ-M1"
text = "With the inverter not switching (a fault at top speed), the line-to-line back-EMF peak at 6000 rpm shall not exceed the 500 V maximum bus voltage."
metric = "back_emf_LL_peak_at_max_speed_V"
operator = "<="
limit = 500.0
units = "V"
