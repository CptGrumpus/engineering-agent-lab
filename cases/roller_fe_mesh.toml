# Study 10 part 2, the 3D FE check of the crowned design: three contact meshes (overnight).
#
# Why: the half-space model (roller_hs_*) passes the crowned roller (log crown, A = 1.3 x Lundberg = 1.793 um, z_m 30
# um) at 616.8 MPa against 650, a 5.1 % margin, and meets every one of its exact checks. The one coarse 3D FE solve
# (scratch r3_log3, 2026-11-27: Lundberg's A, 0.08 mm contact elements) read 5 % higher at mid-length than the
# half-space at the same load. Re-read at 18:05: its nodal contact pressures integrate to 12 % MORE than the
# reaction (the coarse mesh smears the contact edge); corrected for that, its mid-length line load is about 514 N/mm
# against the half-space's 458 at the same mean load, and its mid-length pressure (610 MPa) matches Hertz for 514
# within 1 %. So the FE carries more of the load at mid-length: consistent with the half-space's known limit (it
# continues past the roller's end face, so it makes the ends too stiff). For the crowned design, whose peak is at
# mid-length, that pushes the FE above the half-space. This case measures by how much: the chosen crown on three
# in-plane contact meshes (refined zone 1.6 mm, layers along the roller fixed: end 0.2 mm, at most 1.0 mm), four
# approach steps bracketing 500 N/mm, the results interpolated to it. The steps run one after another (about 1.5, 3
# and 7 hours).
#
# Predictions, written BEFORE the evidence run (uncertain: the trial was at a different crown):
#   P1 Equilibrium, the load bracket and the elastic check pass at every mesh; contact_integral FAILS at every mesh
#      (12 % on the trial mesh, falling roughly with the element size: about 12 / 9 / 7 %); hertz_mid_pressure (with
#      the corrected line load) passes at the two finer meshes (within 3 %).
#   P2 Peak contact pressure at mid-length, about 650 / 643 / 638 MPa at 0.08 / 0.06 / 0.045 mm (+-15 MPa), falling as
#      the mesh refines, towards about 630 (2-3 % over the half-space's 617: the end-compliance effect); the GCI may or
#      may not pass (three levels at refinement ratio 1.33).
#   P3 REQ-C1-3D passes at the two finer meshes and is borderline at the coarsest; if the extrapolated peak is over
#      650 MPa the crown recommendation changes (a stronger crown: the half-space window runs to 2.5 x).
#   P4 About 12 hours in all.

# Results (run 20261127-180915_roller_fe_mesh, 18:09-08:45, 14 h 36 min; 1 h 32 / 4 h 32 / 8 h 32 min per point):
# VERIFICATION FAIL: contact_integral fails at every mesh, hertz_mid_pressure at 0.08 mm, and the peak's
# discretization check (6.7 %, oscillatory) at run level. REQ-C1-3D (peak <= 650 MPa) PASSES at 0.08 mm (647.1, at
# mid-length) and FAILS at 0.06 and 0.045 mm (724.1, 715.7 MPa, at 0.46 mm from the end face), all unverified.
#   P1 HELD: equilibrium, the load bracket and the elastic check pass at every mesh; contact_integral fails at every
#      mesh (10.8 / 11.2 / 5.9 %; predicted about 12 / 9 / 7: it fell only at the finest); hertz_mid_pressure passes
#      at the two finer meshes (0.03 %, 2.0 %) and fails at 0.08 mm (3.2 %).
#   P2 FAILED: the peak left mid-length at the two finer meshes (to 0.46 mm from the end face). At mid-length the
#      pressure is 647.1 / 634.5 / 640.5 MPa: each inside its predicted band (650 / 643 / 638 +-15), but not
#      falling as the mesh refines (oscillatory, 1.25 x half-range 7.9 MPa, 1.2 %); 3-5 % over the half-space's 616.8
#      at the same load (the end-compliance effect). The largest subsurface shear moves 0.2 % (193.9 / 193.6 / 193.5).
#   P3 FAILED as read: REQ-C1-3D fails at the two finer meshes on the end peak. At mid-length it passes at all three,
#      the finest at 640.5 +- 7.9 MPa, under 650 by 1.5 % (by 0.3 % at the top of the band). The end peak was traced
#      before this run finished (2026-11-28 01:49, scripts/roller_crown_layers.py, e9c0544) to the mesh's drawing
#      of the crown. The crown is applied as shifts at layer planes 0.2 mm apart at the end, so the log crown is
#      piecewise linear where it climbs steeply. The half-space model fed that profile peaks at the end too: 667.5
#      MPa with 0.2 mm end layers, 617.5 with 0.05 mm, against 616.6 at mid-length for the exact crown.
#      cases/roller_fe_end.toml (running since 01:48) refines the end layers at a fixed in-plane mesh to test that in
#      the FE. The crown verdict waits for it.
#   P4 FAILED: 14 h 36 min against about 12 (1.5 / 3 / 7 h predicted per point).
# What it shows: at mid-length the FE agrees with Hertz for its own line load within 2 % and reads 635-647 MPa, 3-5 %
# above the half-space, inside the 650 limit with a thin margin. The end peak at the two finer meshes comes from the
# end layers the case fixed (its stated limitation). The traced cause is the drawn crown, not the contact physics,
# but that is confirmed only when roller_fe_end lands.
# Follow-up (2026-11-28, after roller_fe_end landed at 11:24): the drawn-crown diagnosis did not hold for the FE.
# Across the four steps here the end layer's pressure does not follow the load (0.06 mm: 751 / 771 / 697 / 816 MPa
# for evenly rising loads). Its end/mid ratio moves 0.149 / 0.106 between the bracketing steps at 0.06 / 0.045 mm,
# against 0.004 at 0.08 mm (scripts/roller_step_consistency.py). The end peaks at the two finer meshes are unsettled
# values, not results. The study now checks this (end_consistency); see cases/roller_fe_end.toml's Results.

[case]
name = "roller_fe_mesh"
model = "ccx_roller_3d"
description = "Study 10's track roller (100 mm diameter, 30 mm long [synthetic], 500 N/mm) with the chosen logarithmic crown (A = 1.793 um, z_m 30 um) on a 60 mm plate, 3D CalculiX penalty contact; contact elements 0.08 / 0.06 / 0.045 mm; four approach steps bracketing the load."
assumptions = [
  "Linear elastic steel (E 210 GPa, nu 0.3), frictionless penalty contact as study 10 (50 E / h).",
  "Quarter model: symmetric about the plane through the roller's axis and about its mid-length; the plate 60 mm wide, 50 mm deep, 120 mm long (study 10's section).",
  "The crown applied as a micron drop of the roller's nodes (each slice shifted), capped at 60 um.",
  "The results interpolated linearly in load between the two steps that bracket 500 N/mm.",
]
limitations = [
  "Layers along the roller are not refined with the contact mesh (end 0.2 mm, at most 1.0 mm): the mid-length value is what this case measures; the end region is resolved by the end layers only.",
  "No misalignment; contact pressure and the shear below it only.",
]

[parameters]
roller_radius_mm = 50.0
roller_length_mm = 30.0
plate_width_mm = 60.0
block_half_width_mm = 60.0
block_depth_mm = 50.0
youngs_modulus_MPa = 210000.0
poisson_ratio = 0.3
yield_strength_MPa = 1200.0
contact_element_size_mm = 0.08
far_element_size_mm = 4.0
refined_zone_mm = 1.6
end_layer_mm = 0.2
layer_growth = 1.3
max_layer_mm = 1.0
penalty_stiffness_factor = 50.0
line_load_N_per_mm = 500.0
profile = "log"
crown_A_um = 1.793145692168688       # 1.3 x Lundberg's 1.379 um (roller_hs_mesh)
crown_zm_um = 30.0
cap_um = 60.0
approach_mm = 0.0155
approach_factors = [0.92, 0.97, 1.02, 1.07]

[sweep]
parameter = "contact_element_size_mm"
values = [0.08, 0.06, 0.045]

[numerics]
solver_timeout_s = 64800
threads = 16

[verification]
equilibrium_rel_tol = 1e-5
hertz_rel_tol = 0.03
integral_rel_tol = 0.03
mesh_noise_rel = 1e-3
gci_max = 0.03

[[requirements]]
id = "REQ-C1-3D"
text = "The peak contact pressure anywhere along the crowned roller shall not exceed 650 MPa (study 10's REQ on the peak pressure), on the 3D finite-element model."
metric = "peak_contact_pressure_MPa"
operator = "<="
limit = 650.0
units = "MPa"
