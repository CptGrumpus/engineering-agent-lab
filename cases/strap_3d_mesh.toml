# Study 2 part 2, case 1: the 16 mm cable hole in 3D, through the 4 mm thickness, at three meshes.
#
# Why (standing rule, 2026-11-27: simple first, a fuller check where the margin is thin): study 2 passed the 16 mm hole
# at 116.988 MPa against a 120 MPa allowable, a 2.6 % margin, on a plane-stress model, and its page says "in the real
# 4 mm plate the peak at mid-thickness runs a few percent higher". If "a few percent" is 3 %, the verdict flips. This
# case measures it: the same CadQuery face, extruded through the half thickness (20-node bricks, layers graded to the
# free face, refined with the hole-edge size).
# Scratch trials (2026-11-27, 16 mm hole): mid-thickness 119.32 / 118.96 / 118.84 MPa at hole-edge elements 0.8 / 0.4
# / 0.2 mm; face 114.7-114.4; mean through the thickness 117.9 / 117.6 / 117.5 (0.4 % over plane stress, the order
# (t / r)^2 difference, not an error); reaction F / 4 exact; thin plate (t 0.04 mm) within 0.15 % of plane stress.
#
# Predictions, written BEFORE the evidence run:
#   P1 Every point check passes at every mesh.
#   P2 Mid-thickness stress 118.96 / 118.87 / 118.82 MPa at hole-edge elements 0.4 / 0.267 / 0.178 mm, converging from
#      above; GCI under 0.5 %.
#   P3 REQ-H1 still passes at 16 mm, by about 1 % (118.8 against 120): plane stress was 1.5 % optimistic, inside its
#      2.6 % margin. The face sees about 114.4 MPa, 2.2 % under plane stress.
#   P4 A few minutes in all.
#
# Results (run 20261127-151911_strap_3d_mesh): verification PASS (24/24 point checks, 2/2 run checks).
#   P1 HELD.
#   P2 HELD: mid-thickness 118.962 / 118.881 / 118.827 MPa at 0.4 / 0.267 / 0.178 mm (predicted 118.96 / 118.87 /
#      118.82), monotone from above, observed order 1.0, extrapolated 118.72; GCI 0.11 % (predicted under 0.5 %).
#   P3 HELD: REQ-H1 PASSES at 16 mm, 118.83 MPa against 120 (margin 1.0 %; extrapolated 118.72, 1.1 %). Plane stress
#      was optimistic by 1.5-1.6 % (mid / plane stress 1.0157 on the finest mesh, 1.0148 extrapolated), inside its
#      2.6 % margin. The face sees 114.43 MPa, 2.2 % under plane stress (predicted 114.4). The mean through the
#      thickness is 117.46 MPa (extrapolated 117.36), 0.3-0.4 % over plane stress: the order (t / r)^2 difference of
#      generalised plane stress at t / r = 0.5.
#   P4 HELD: about 3 minutes.
# Answer: the 16 mm hole still passes with the thickness modelled, by 1 % instead of 2.6 %; study 2's "a few percent
# higher at mid-thickness" is 1.5 %.

[case]
name = "strap_3d_mesh"
model = "cadquery_ccx_strap_3d"
description = "Study 2's 6061-T6 strap (160 x 40 x 4 mm, 5 kN) with a 16 mm cable hole, as a 3D solid through its thickness (eighth model, C3D20); hole-edge element size 0.4 / 0.267 / 0.178 mm with the layers through the half thickness refined alongside (5 / 7 / 11, graded 1.3 to the face)."
assumptions = [
  "Linear elastic, isotropic 6061-T6 (E = 68.9 GPa, nu = 0.33), as study 2; checked: peak below yield.",
  "Uniform end traction 72 mm from the hole, as study 2; checked: the stress there is uniform.",
  "Hole smooth, central and straight through (symmetric about the mid-plane and both centre lines).",
  "The 120 MPa allowable is synthetic, as study 2; it is compared with the largest stress on the hole edge, at mid-thickness.",
]
limitations = [
  "No surface finish, burrs, chamfer or residual stress at the hole, as study 2.",
  "The mean through the thickness differs from plane stress at finite thickness (order (t / r)^2): reported, not a check.",
]

[parameters]
length_mm = 160.0
width_mm = 40.0
thickness_mm = 4.0
hole_diameter_mm = 16.0
axial_load_N = 5000.0
youngs_modulus_MPa = 68900.0
poisson_ratio = 0.33
yield_strength_MPa = 276.0
hole_element_size_mm = 0.267
far_element_size_mm = 4.0
z_layers = 0                   # auto: as many as the half thickness holds hole-edge elements (5 / 7 / 11)
z_ratio = 1.3
plane_stress_peak_MPa = 116.988   # study 2, run 20261119-235211_strap_hole_size, p05 (mesh uncertainty 0.08 %)

[sweep]
parameter = "hole_element_size_mm"
values = [0.4, 0.267, 0.178]

[numerics]
solver_timeout_s = 3600
threads = 4

[verification]
equilibrium_rel_tol = 1e-6
ligament_force_rel_tol = 0.01
far_field_rel_tol = 1e-3
kt_rel_tol = 0.02              # model form, as study 2 (Peterson against the through-thickness mean)
mesh_noise_rel = 5e-4          # declared before the run: the 2D quad mesh is regenerated at each size
gci_max = 0.01

[[requirements]]
id = "REQ-H1"
text = "Peak stress at the hole edge under the 5 kN service load shall not exceed 120 MPa (synthetic fatigue allowable), anywhere through the thickness."
metric = "peak_hole_stress_MPa"
operator = "<="
limit = 120.0
units = "MPa"
