# Clevis bracket optimisation, revision 2: confirmation of design D.
#
# clevis_opt_r2 (run 20261121-091836, every candidate at 1.0 mm fillet elements, constraint 97.5 MPa)
# stopped in mesh noise: its late candidates scatter 1.5 % for changes under 0.15 mm and all sit just
# over the constraint, so its reported optimum was the start. Design D is chosen from those
# candidates instead (harness/response_surface.py, design_inside_limit): a linear fit of the peak
# stress over c012 to c026 (15 points, residual sd 0.50 MPa; slopes -3.77 / -3.52 / -1.53 MPa per mm
# of lug thickness / gusset thickness / gusset height), starting at their centroid and moving the
# most mass-efficient dimensions (gusset thickness, then height) until the fit reads 97.5 - 2 sd =
# 96.50 MPa, without leaving the sampled range:
#   lug 10.170 mm, gussets 9.069 x 36.360 mm; fitted 96.50 +- 0.54 MPa (SE), fitted mass 371.94 g.
# The converged region weighs 370 +- 1 g throughout: D gives up about 1.5 g (0.4 %) for a design the
# fit supports, against 388 g at the start (-4.1 %).
#
# Mesh study: fillet element size 1.0 / 0.85 / 0.75 mm, as clevis_confirm_r1_fillet, judging the
# peak stress only (verification.mesh_study_metrics): a fillet sweep leaves the 4 mm global mesh,
# which sets the deflection, unchanged. The deflection's mesh evidence is the global study at c011
# (clevis_confirm_r1: GCI 0.05 %); D's deflection is about 0.08 mm against 0.10.
#
# Predictions, written BEFORE running:
#   P1 Peak at 1.0 mm within 96.5 +- 1.1 MPa (2 SE); mass 371.9 g.
#   P2 The three levels scatter within about 1.5 % (oscillatory or monotone); stress uncertainty
#      at most 1 %.
#   P3 REQ-C1 with the uncertainty added at most 99 MPa: PASS. REQ-C2 passes (about 0.08 mm).
#   P4 Verification PASS.
#
# Results (run 20261121-111455_clevis_confirm_r2), verification FAIL on the peak stress's mesh check:
#   peak 97.36 / 97.54 / 98.33 MPa, pin deflection 0.07940 / 0.07941 / 0.07942 mm, mass 371.94 g at
#   fillet sizes 1.0 / 0.85 / 0.75 mm; every point check passed; all three under both limits.
#   P1 held: 97.36 MPa at 1.0 mm, inside 96.5 +- 1.1.
#   P2 half held: the spread is 0.99 % (under the 1.5 % scatter measured in clevis_opt_r2), but the
#      differences grow (0.18 then 0.79 MPa), so the ratio test classes it divergent (R = 4.4) and
#      gives no estimate.
#   P3, P4 failed for that reason only.
# Reading: at this resolution the peak is a nodal maximum that jitters about +-0.5 to 0.8 % from
# mesh to mesh, as large as the level-to-level change, so a three-level order is a coin toss
# (c011: oscillatory, pass; D: divergent, fail). The noise was measured before this run (clevis_opt_r2:
# 1.5 % peak to peak between candidates within 0.15 mm, same mesh settings). Follow-up:
# cases/clevis_confirm_r2b.toml, which declares that noise (verification.mesh_noise_rel): PASS.
# SUPERSEDED by it; this run stays as evidence.
#
# Requirements and tolerances are those of clevis_opt, fixed before its first run.

[case]
name = "clevis_confirm_r2"
model = "cadquery_ccx_clevis"
description = "Confirmation of design D, chosen by a local linear response surface over the converged candidates of run 20261121-091836_clevis_opt_r2: 4 mm quadratic tetrahedra globally, fillet element size 1.0 / 0.85 / 0.75 mm. Original problem: lightest 6061-T6 machined clevis bracket (base 100 x 100 x 10 mm, lug 40 mm wide with a 16 mm pin at 70 mm, two gussets, 3 mm fillets) under a (1.5, 1.0, 4.5) kN pin load, with peak von Mises at most 100 MPa and pin deflection at most 0.10 mm."
assumptions = [
  "Base bottom face fixed (bolted and dowelled to a rigid machine frame); the bottom half of the base is not assessed (the edge of a fixed face is singular, and the real joint is not modelled).",
  "Pin load through a rigid pin tied to the hole surface; a ring of one pin diameter around the hole is not assessed (pin bearing and lug net section are sized by the standard lug method).",
  "Linear elastic 6061-T6 (E 68.9 GPa, nu 0.33); checked: peak stress below yield.",
  "Small deflection; checked: pin deflection / pin height below 1 %.",
  "Stress allowable 100 MPa (fatigue-rated) and pin deflection limit 0.10 mm: synthetic.",
]
limitations = [
  "Static load only; the fatigue rating is folded into the allowable.",
  "No closed-form reference for the whole part: the evidence is exact equilibrium, geometry fidelity, a model-form check of the lug section and this mesh study.",
  "Fixed outline and fillet radius; only three dimensions vary.",
  "No physical test data.",
]

[parameters]
base_length_mm = 100.0
base_width_mm = 100.0
base_thickness_mm = 10.0
lug_radius_mm = 20.0
pin_height_mm = 70.0
pin_diameter_mm = 16.0
lug_thickness_mm = 10.169620442413608     # design D (see the header)
gusset_thickness_mm = 9.06916365232668
gusset_height_mm = 36.36016009772356
gusset_aspect = 0.7
fillet_radius_mm = 3.0
youngs_modulus_MPa = 68900.0
poisson_ratio = 0.33
density_t_per_mm3 = 2.7e-9
yield_strength_MPa = 276.0
load_x_N = 1500.0
load_y_N = 1000.0
load_z_N = 4500.0
element_size_mm = 4.0
fillet_element_size_mm = 1.0

[sweep]
parameter = "fillet_element_size_mm"
values = [1.0, 0.85, 0.75]

[numerics]
solver = "CalculiX 2.22 static, C3D10, rigid pin (*RIGID BODY)"

[verification]
mesh_volume_rel_tol = 2e-3
equilibrium_rel_tol = 1e-6
section_rel_tol = 0.10
small_deflection_max = 0.01
gci_max = 0.01
mesh_study_metrics = ["peak_von_mises_MPa"]   # the fillet sweep refines the peak; deflection: global study at c011

[[requirements]]
id = "REQ-C1"
text = "Peak von Mises stress (outside the fixed base layer and the pin ring) shall not exceed 100 MPa (fatigue-rated allowable)."
metric = "peak_von_mises_MPa"
operator = "<="
limit = 100.0
units = "MPa"

[[requirements]]
id = "REQ-C2"
text = "Pin deflection under the load shall not exceed 0.10 mm."
metric = "pin_deflection_mm"
operator = "<="
limit = 0.10
units = "mm"
