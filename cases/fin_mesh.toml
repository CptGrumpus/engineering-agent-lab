# Straight rectangular heat-sink fin (6061 aluminium, 40 x 20 x 2 mm), 3D
# steady conduction with convection on every exposed face, solved with
# CalculiX; mesh refinement study at the nominal point. Independent checks:
# 1D fin theory with a convective tip (Incropera, case A), energy balance, and
# GCI on the requirement metric.
#
# Decision: does the coldest point of the fin tip stay at or above 60 C with
# the base at 80 C and air at 25 C? This case only establishes how fine the
# mesh must be; the decision is taken in fin_tolerance (input ranges) and
# fin_h_sweep (how far h can rise before the answer changes).
#
# Predictions (written BEFORE the first run, from the 1D closed form with
# k = 167 W/mK, h = 25 W/m^2K, P = 2(w + t), A = w t):
#   m L = 0.513, tip excess ratio = 0.877, tip temperature 73.2 C (margin
#   about 13 K), fin heat flow 2.27 W. Biot number h (t/2) / k = 1.5e-4, so the
#   3D cross-section mean should match 1D theory to well under 0.1 %, and the
#   tip corner should be colder than the tip-face mean by much less than 0.1 K.
#   Linear hex elements: observed order of convergence about 2.
#
# Requirements and tolerances were fixed BEFORE the first run.
#
# Smoke test (scratchpad, 2 / 1 / 0.5 mm, before the evidence run): every check
# passed; tip minimum 73.1833 / 73.1818 / 73.1814 C. The .frd prints
# temperatures to 1e-4 K, the same size as the change expected between the two
# finest meshes, so the GCI could have been decided by print rounding. The
# requirement metric is now read from a *NODE PRINT of the tip-face nodes in
# the .dat (7 significant digits, 1e-5 K); the metric definition, the limit
# and every tolerance are unchanged. Earlier, the first hand run of ccx (1 mm,
# outside the harness) showed that CalculiX's base RFL total leaves out the film load lumped on the base nodes
# (1.3 % at 1 mm elements); the base heat flow is RFL plus that share, as the
# energy-balance check requires, and the raw RFL is kept in point.json.

[case]
name = "fin_mesh"
model = "ccx_fin"
description = "Straight rectangular 6061-T6 aluminium fin, 40 mm tall, 20 mm wide, 2 mm thick; base held at 80 C, air at 25 C, h = 25 W/m^2K on both faces, both edges and the tip. Steady 3D conduction in CalculiX on a structured hex (C3D8) mesh refined from 2 mm to 0.25 mm elements (ratio 2). Checks the minimum tip temperature against 1D fin theory, an energy balance, and mesh convergence."
assumptions = [
  "Steady state, linear conduction with constant conductivity k = 167 W/mK (6061-T6, ASM Handbook / MatWeb; temper not stated by the user, see fin_tolerance for 150-180 W/mK).",
  "Base face held at exactly 80 C (user value): no base spreading or contact resistance is modelled; the user's 80 C is taken as the temperature at the fin root.",
  "Uniform effective heat-transfer coefficient h = 25 W/m^2K on every exposed face, including the tip and the two 2 mm edges, with air at 25 C everywhere (user values). h is treated as the total effective coefficient (convection plus linearised radiation).",
  "Requirement metric is the MINIMUM temperature on the tip face (its coldest corner), not the tip-face average: 'stays above 60 C' is read as everywhere on the tip; checked: the tip-face minimum is the global minimum of the fin.",
  "1D fin theory is a valid independent reference; checked: Biot number h (t/2) / k below 0.1.",
]
limitations = [
  "Single isolated fin: neighbouring fins, air preheating along the channel, and the variation of h along the fin (natural-convection boundary layer) are not modelled.",
  "1D fin theory is a model-form reference (it assumes a uniform cross-section temperature), not an exact solution of the 3D problem.",
  "No physical test data.",
]

[parameters]
thickness_mm = 2.0                     # user
width_mm = 20.0                        # user
length_mm = 40.0                       # user (fin height above the base)
conductivity_W_per_mK = 167.0          # 6061-T6, ASM Handbook / MatWeb
htc_W_per_m2K = 25.0                   # user ("about 25")
base_temperature_C = 80.0              # user
air_temperature_C = 25.0               # user
element_size_mm = 0.5                  # target edge length of the hex elements

[sweep]
parameter = "element_size_mm"
values = [2.0, 1.0, 0.5, 0.25]

[numerics]
solver = "CalculiX 2.22, *HEAT TRANSFER, STEADY STATE, C3D8 structured hex mesh, SPOOLES direct solver"

[verification]
# Exact for this discretisation: the base heat flow (CalculiX nodal reaction
# flux) must equal the convective loss integrated over every exposed face from
# the nodal temperatures (bilinear faces, integrated exactly). Limited by the
# 6-significant-digit printed output; a face missing its film load would be an
# error of at least 2 % (the tip face is 2.3 % of the area).
energy_balance_rel_tol = 1e-4
# Model form (1D fin theory, Bi = 1.5e-4): mean tip excess temperature vs 1D.
# 1 % of the 48 K excess is 0.5 K, well under the 13 K expected margin, so a
# pass is good enough for the decision while a wrong boundary condition fails.
tip_reference_rel_tol = 0.01
# Model form: base heat flow vs 1D fin heat rate; same reasoning, 1 %.
heat_flow_reference_rel_tol = 0.01
# Field check: max over the length of |cross-section mean T - T_1D(z)| divided
# by (T_base - T_air); 1 % of 55 K.
profile_reference_rel_tol = 0.01
# Validity of the 1D reference: Biot number across the half-thickness.
biot_max = 0.1
# Metric definition check: tip-face minimum minus global minimum (K); the
# coldest point must lie on the tip face, otherwise the metric misses it.
tip_is_coldest_abs_tol_K = 0.0
# GCI on the tip excess temperature (T_tip,min - T_air): 0.2 % of 41-48 K is
# under 0.1 K, two orders below the expected margin.
gci_tip_excess_max = 0.002
# GCI on the base heat flow (reported, not a requirement): 1 %.
gci_heat_flow_max = 0.01

[[requirements]]
id = "REQ-T1"
text = "The minimum temperature on the fin tip face shall be at least 60 C (user requirement; the coldest corner of the tip, not the face average)."
metric = "tip_temperature_min_C"
operator = ">="
limit = 60.0
units = "C"
