# Study 24 part 2, revision 1: surface_crack_mesh (read it) with one addition per shape, four more solves: the depth
# a alone and the half length c alone scaled by (1 -+ eps). On an ellipse a dU_q/da = 1/2 a c int G sin^2 phi dphi
# (weighted to the deepest point) and c dU_q/dc = 1/2 a c int G cos^2 phi dphi (weighted to the surface); the two add
# up to the self-similar derivative. Why: in surface_crack_mesh the crack-opening profile fell towards the deepest
# point on the deep shapes (a = 7.5 mm: 0.928 of Newman-Raju at 90 deg against 0.988 at 20 deg), but only the front
# average was checked by an energy route. This tests the profile with energy alone. The noise floor comes from
# surface_crack_noise, measured before this run. Nothing else changes (code: weighted_energy = true).
#
# What the two readings predict (from surface_crack_mesh's finest opening profiles, scaled by its energy / opening
# average): if the profile is real, the depth-weighted energy ratio is 0.977 / 0.981 / 0.977 / 0.963 for a = 2 / 4 /
# 6 / 7.5 mm and the surface-weighted one 0.981 / 0.994 / 1.003 / 1.003; if it is an artefact of the fit, both sit
# at the front average (0.979 / 0.987 / 0.990 / 0.984).
#
# Predictions, written BEFORE the run (2026-11-26 20:22):
#   P1 The profile is real: at the finest level the depth-weighted energy ratio for a = 7.5 mm is 0.955-0.970 (under
#      its 0.984 average) and the surface-weighted one 0.995-1.010; for a = 2 mm both within 0.5 % of the average.
#   P2 Hence the deep_routes check (depth-weighted opening against energy, 3 %) passes at the two finer levels; energy
#      additivity under 1 % everywhere.
#   P3 Everything surface_crack_mesh measured repeats to within its noise: the same per-point checks pass and fail
#      (profile_shape fails, as Newman-Raju's shape differs at the deep shapes), the same requirement values (K at
#      the detectable flaw 11.27, life 133,423).
#   P4 With the measured floor the smallest energy ratio and the FE-scaled life read as converged within the floor or
#      with GCI under 1 % (reported as found).
#   P5 About 15 min (26 solves per level).

[case]
name = "surface_crack_mesh_r1"
model = "gmsh_ccx_surface_crack"
description = "Semi-elliptical surface crack in the S355 plate of part 1 (100 mm wide, 10 mm thick, 150 MPa maximum, R = 0.1): K along the crack front by 3D FE (CalculiX, Gmsh quarter model, quadratic tetrahedra refined at the front; energy release and crack opening) on four shapes of the growth path against Newman-Raju (BS 7910); growth life from the detectable flaw (2 mm deep, 10 mm long) to 0.8 t by the BS 7910 two-point procedure; front element size 0.05 / 0.025 / 0.0125 of the crack depth; revision 1: energy derivatives for a alone and c alone."
assumptions = [
  "Linear elastic fracture mechanics; plane strain along the front for K from the crack opening and for G = K^2 (1 - nu^2) / E (not at the free surface, where the surface point is reported, not checked). [model form]",
  "Uniform remote tension on the plate's ends, free to rotate, as in Newman and Raju's solution; quarter model by symmetry (crack plane and the crack's mid-plane), half height 100 mm (2 x the half width).",
  "Detectable flaw: 2 mm deep, 10 mm surface length (a/2c = 0.2) [synthetic: a client's inspection procedure would give the detectable length and the depth to assume].",
  "Crack growth by the BS 7910 / IIW simplified law for steels in air, as part 1, at the deepest and the surface point (BS 7910's two-point procedure); the crack stays semi-elliptical.",
  "Newman and Raju (1981), Engineering Fracture Mechanics 15, 185-192: K = sigma sqrt(pi a / Q) F, stated accuracy +-5 % for a/c <= 1, a/t < 0.8. [published]",
]
limitations = [
  "The life stops at a = 0.8 t (end of Newman-Raju's range): breakthrough and the through crack's growth are left out, so it is a lower bound.",
  "No crack closure, sequence effects or environment; no residual stress (a weld toe would need it).",
  "The FE checks Newman-Raju at four shapes on the path; between them the ratio is interpolated linearly in a.",
]

[parameters]
half_width_mm = 50.0
half_height_mm = 100.0
thickness_mm = 10.0
sigma_max_MPa = 150.0
stress_ratio = 0.1
youngs_modulus_MPa = 210000.0
poisson_ratio = 0.3
k_mat_MPa_sqrt_m = 100.0
paris_C = 5.21e-13
paris_m = 3.0
dK_threshold = 63.0
initial_depth_mm = 2.0
initial_half_length_mm = 5.0
end_depth_ratio = 0.8
front_element_rel = 0.025
far_element_size_mm = 5.0
edge_crack_life_cycles = 91963.0   # part 1, run 20261123-164649_edge_crack_mesh_r2, finest tip mesh

[sweep]
parameter = "front_element_rel"
values = [0.05, 0.025, 0.0125]

[numerics]
crack_shapes_mm = [[2.0, 5.0], [4.0, 6.17], [6.0, 8.15], [7.5, 10.08]]
energy_eps = 0.02
weighted_energy = true   # r1: a alone and c alone, the energy route weighted to the deepest point and the surface
parallel_solves = 6
solve_timeout_s = 7200
solver_timeout_s = 21600

[verification]
newman_raju_rel_tol = 0.05    # Newman and Raju's stated accuracy
profile_from_deg = 15.0       # the shape of K along the front is checked from 15 deg to the deepest point
profile_rel_tol = 0.03
routes_rel_tol = 0.03         # crack opening against energy (front averages, and weighted to the deepest point)
additivity_rel_tol = 0.01     # dU/deps, a alone + c alone against both together
equilibrium_rel_tol = 1e-6
energy_step_rel_tol = 0.005   # K by the energy route with eps halved
integral_rel_tol = 1e-4
gci_max = 0.01
# measured: surface_crack_noise (run 20261126-202527), peak to peak / mean over five meshes at h = 0.025 a
mesh_noise_rel = { K_a0_MPa_sqrt_m = 2.6e-3, energy_ratio_min = 2.4e-3, growth_life_fe_cycles = 2.6e-3, deep_energy_ratio_min = 8.5e-3 }

[[requirements]]
id = "REQ-F1s"
text = "At the detectable surface flaw the maximum stress intensity (deepest point) shall not exceed half the fracture toughness (Kmat / 2 = 50 MPa sqrt m)."
metric = "K_a0_MPa_sqrt_m"
operator = "<="
limit = 50.0
units = "MPa sqrt m"

[[requirements]]
id = "REQ-F2s"
text = "The crack growth life from the detectable surface flaw shall be at least twice the planned inspection interval of 40,000 cycles (lower bound: to a = 0.8 t)."
metric = "growth_life_cycles"
operator = ">="
limit = 80000.0
units = "cycles"
