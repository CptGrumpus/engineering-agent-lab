# Study 7, efficiency map: a supplementary dq table at LOW q-axis current, HOT corner (magnets 80 C), to be merged
# with motor_prius_lut_hot (run 20261122-115824_motor_prius_lut_hot). Same model, machine, mesh fineness 2, rotor positions and checks as
# that case; only the q-axis currents differ: iq 6.25 to 43.75 A rms in 6.25 A steps (7 per column, 91 FEMM solves).
#
# Why: the efficiency case (motor_prius_efficiency, run 20261122-133642) failed its half-grid interpolation checks,
# all on the iq 25 A row, where torque and iron loss bend sharply between iq = 0 and 50 A; below 30 N m at
# 4000-6000 rpm the optimum lies at iq 2-5 A, inside the table's first 25 A cell, and the map moved by up to 10
# efficiency points between the half and full tables there. Steps of 6.25 A put four nodes inside each of the first
# two 25 A cells. iq 25 A is computed again on purpose: it must reproduce the main table.
#
# Predictions, written BEFORE the run (no ORNL measured data opened):
#   P1 Every point check passes in every column; the dq torque equation within 0.5 % of FEMM's torque (|T| >= 5 N m).
#   P2 The iq 25 A row reproduces the main table's (same model, mesh and rotor positions): torque, dq flux and
#      iron-loss coefficients the same to 1e-6 relative.
#   P3 The cubic interpolant of the main (25 A) table, evaluated at the new nodes, misses FEMM's torque by at most
#      0.5-2 % (|T| >= 5 N m), worst at iq 6.25-12.5 A and id -25 to -100 A: the interpolation error the efficiency
#      map carried in its low-torque corner. (Scored by the efficiency revision that merges the tables.)
#   P4 About 31 s per solve: 13 columns of about 3.6 min, about 47 min.
# REQ-M3 is reported per column as before; with iq at most 43.75 A it passes for |id| up to about 210 A and fails
# beyond, by construction (the 212 A copper limit), not as a design verdict.
#
# Results (run 20261122-143828_motor_prius_lut_hot_lowiq): verification FAIL, the dq torque check in four columns.
#   P1 MISSED, as in the cold table: the dq torque equation is off by 1.10 / 0.93 / 0.52 / 0.73 % at id -300 / -275 /
#      -200 / -175 A against 0.5 %, always at iq 6.25 A (mean torque 33-36 N m, large ripple). Every other check
#      passes everywhere. One more column than cold (-200 A, 0.52 %): the hotter magnets lower the torque a little,
#      so the same ripple weighs more. Same reading as the cold case: the map interpolates FEMM's torque; the dq
#      fluxes enter only the voltage limit.
#   P2 HELD exactly: the iq 25 A row is bit-identical to the main hot table's in every column.
#   P3 is scored by motor_prius_efficiency_r1.
#   P4 MISSED a little: 56 min (predicted about 47; the CPU was shared).

[case]
name = "motor_prius_lut_hot_lowiq"
model = "pyleecan_femm_lut"
description = "2004 Toyota Prius traction motor (our machine from ORNL Fig. 21, laminations M330-35A, magnets at 80 C), dq look-up table, id 0 to -300 A rms and iq 6.25 to 43.75 A rms in 6.25 A steps (supplementary low-current rows), 1000 rpm; Pyleecan + FEMM 4.2 magnetostatics over one electrical period (48 steps) with element fields; mesh fineness 2; torque, dq flux linkages and iron-loss coefficients."
assumptions = [
  "2D magnetostatics (FEMM), no end effects; torque is the mean of FEMM's stress-tensor torque over one electrical period.",
  "Iron loss from the element fields with the M330-35A three-term fit applied per harmonic; rotational fields counted as two orthogonal alternating ones; minor loops and DC bias not modelled.",
  "Core mass without the stacking factor (FEMM models the stack as solid steel, lam_fill 1).",
  "Magnet temperature 80 C (MagFEMM T_mag; Br falls 0.1 %/K, Pyleecan's alpha_Br for this magnet: a generic NdFeB value, not ORNL's).",
  "Copper 76.4 mm^2 per slot (Pyleecan's 13 x 0.912 mm strands per turn, 9 turns), consistent with ORNL's 0.84 fill on the squares of insulated wires.",
]
limitations = [
  "No test data in this case: the ORNL comparison is a separate, blind step at the end of the study.",
  "The loss fit covers 0.1-1.8 T at 50-2500 Hz; deep-saturation regions (tooth tips at load) extrapolate it.",
  "No magnet eddy-current loss, no AC copper loss (proximity, skin), no mechanical loss.",
]

[parameters]
machine = "Toyota_Prius_ORNL.json"
speed_rpm = 1000.0
id_A = 0.0
iq_min_A = 6.25
iq_max_A = 43.75
iq_steps = 7
mesh_fineness = 2.0
steps_per_period = 48
angle_points = 2048
magnet_temperature_C = 80.0
iron_kh = 0.0202
iron_alpha = 1.791
iron_kc = 7.91e-5
iron_ke = 3.70e-4
slot_fill = 0.5345
slot_area_mm2 = 143.0
turns_per_slot = 9

[sweep]
parameter = "id_A"
values = [-300.0, -275.0, -250.0, -225.0, -200.0, -175.0, -150.0, -125.0, -100.0, -75.0, -50.0, -25.0, 0.0]

[numerics]
solver_timeout_s = 7200

[verification]
power_balance_rel_tol = 0.02
dq_torque_rel_tol = 0.005
current_rel_tol = 1e-3
mesh_noise_rel = 1e-5
gci_max = 0.02

[[requirements]]
id = "REQ-M3"
text = "The column's operating points shall stay within the 25 A/mm^2 rms copper current-density limit (marks the grid points the motor can sustain for a short time)."
metric = "current_density_max_A_per_mm2"
operator = "<="
limit = 25.0
units = "A/mm^2"
