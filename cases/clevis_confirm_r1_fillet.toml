# Clevis bracket optimisation, revision 1: confirmation at c011 by local (fillet) refinement.
#
# Why this case. clevis_confirm_r1 (global refinement 6 / 4 / 2.67 mm) failed c011: the observed
# order was 1.16, GCI 7.4 %, REQ-C1 101.1 MPa with the uncertainty added. Two mesher limits held the
# fillet back: a fixed curvature count (now scaled) and a minimum size of h / 4 (1 mm at 4 mm), so
# global refinement barely refined the 3 mm fillets where the peak sits. The model now takes an
# optional fillet_element_size_mm (elements per circle so a 3 mm fillet gets elements no larger than
# it, minimum size half of it); without it the mesh is unchanged.
#
# Hand runs at c011 before this case (4 mm global, fillet element size in mm -> peak MPa, nodes):
#   1.5 -> 89.78 (74 k), 1.25 -> 93.64 (102 k), 1.0 -> 96.61 (140 k), 0.85 -> 97.62 (196 k),
#   0.75 -> 96.83 (249 k), 0.667 -> 96.66 (316 k, 20 min); 0.444 timed out (2 h). Pin deflection
#   0.06357 to 0.06361 mm throughout. Under 1.25 mm the fillet is under-resolved; from 1.0 mm down the
#   peak sits in a band of 96.6 to 97.6 MPa, scattering by about +-0.5 % (a nodal maximum on a tet
#   mesh). Five designs within 0.02 mm of c011 at 1.0 mm: 96.39 to 96.61 MPa (0.23 %).
#   The high-order mesh fallback, forced on at 1.0 mm, changed nothing (no element to fix).
#   CalculiX solver: SPOOLES runs on one core in this build (threads do not help); its iterative
#   Cholesky solver was 11 times faster but 0.6 % off in peak stress, and PARDISO is not linked.
#
# Predictions, written BEFORE running (deterministic: the hand runs fix the values):
#   P1 The three levels reproduce 96.61 / 97.62 / 96.83 MPa.
#   P2 The stress is classed oscillatory: uncertainty 1.25 x half range / finest = 0.65 %, under the
#      1 % gci_max; REQ-C1 with the uncertainty added is about 97.5 MPa: PASS.
#   P3 Deflection converged (GCI under 0.1 %): PASS.
#
# Results (run 20261121-091836_clevis_confirm_r1_fillet), verification FAIL on the deflection only:
#   peak 96.61 / 97.62 / 96.83 MPa and pin deflection 0.063587 / 0.063598 / 0.063603 mm at fillet
#   sizes 1.0 / 0.85 / 0.75 mm (140 k / 196 k / 249 k nodes); every point check passed.
#   P1 held: the hand-run values reproduced.
#   P2 held: oscillatory, uncertainty 0.65 %; REQ-C1 with it added 97.46 MPa, 2.5 % under: PASS.
#   P3 failed, and the fault is the case, not the part: a fillet sweep leaves the 4 mm global mesh
#      (which sets the deflection) unchanged, so the three deflections differ by about 2e-4 and give
#      an observed order of 4.72, classed anomalous (no estimate). The deflection's mesh evidence is
#      the global study at c011 (clevis_confirm_r1: GCI 0.05 %, 36 % under the limit).
#   Fix (studies/clevis_bracket.py): verification.mesh_study_metrics names the metrics a sweep
#   refines; fillet sweeps from now on set it to the peak stress. Not re-run: c011 is superseded by
#   clevis_opt_r2, and this run did its job (the r2 design margin).
#
# Requirements and tolerances are those of clevis_opt, fixed before its first run.

[case]
name = "clevis_confirm_r1_fillet"
model = "cadquery_ccx_clevis"
description = "Confirmation of the optimisation run 20261121-004740_clevis_opt_r1 at its optimum c011 by local refinement: 4 mm quadratic tetrahedra globally, fillet element size 1.0 / 0.85 / 0.75 mm (curvature refinement set so the 3 mm fillets, where the peak sits, get elements no larger than that). Original problem: lightest 6061-T6 machined clevis bracket (base 100 x 100 x 10 mm, lug 40 mm wide with a 16 mm pin at 70 mm, two gussets, 3 mm fillets) under a (1.5, 1.0, 4.5) kN pin load, with peak von Mises at most 100 MPa and pin deflection at most 0.10 mm."
assumptions = [
  "Base bottom face fixed (bolted and dowelled to a rigid machine frame); the bottom half of the base is not assessed (the edge of a fixed face is singular, and the real joint is not modelled).",
  "Pin load through a rigid pin tied to the hole surface; a ring of one pin diameter around the hole is not assessed (pin bearing and lug net section are sized by the standard lug method).",
  "Linear elastic 6061-T6 (E 68.9 GPa, nu 0.33); checked: peak stress below yield.",
  "Small deflection; checked: pin deflection / pin height below 1 %.",
  "Stress allowable 100 MPa (fatigue-rated) and pin deflection limit 0.10 mm: synthetic.",
]
limitations = [
  "Static load only; the fatigue rating is folded into the allowable.",
  "No closed-form reference for the whole part: the evidence is exact equilibrium, geometry fidelity, a model-form check of the lug section and this mesh study.",
  "Fixed outline and fillet radius; only three dimensions vary.",
  "No physical test data.",
]

[parameters]
base_length_mm = 100.0
base_width_mm = 100.0
base_thickness_mm = 10.0
lug_radius_mm = 20.0
pin_height_mm = 70.0
pin_diameter_mm = 16.0
lug_thickness_mm = 10.800560556210893     # c011 of run 20261121-004740_clevis_opt_r1
gusset_thickness_mm = 7.268639556647726
gusset_height_mm = 40.84213540315676
gusset_aspect = 0.7
fillet_radius_mm = 3.0
youngs_modulus_MPa = 68900.0
poisson_ratio = 0.33
density_t_per_mm3 = 2.7e-9
yield_strength_MPa = 276.0
load_x_N = 1500.0
load_y_N = 1000.0
load_z_N = 4500.0
element_size_mm = 4.0
fillet_element_size_mm = 1.0

[sweep]
parameter = "fillet_element_size_mm"
values = [1.0, 0.85, 0.75]

[numerics]
solver = "CalculiX 2.22 static, C3D10, rigid pin (*RIGID BODY)"

[verification]
mesh_volume_rel_tol = 2e-3
equilibrium_rel_tol = 1e-6
section_rel_tol = 0.10
small_deflection_max = 0.01
gci_max = 0.01

[[requirements]]
id = "REQ-C1"
text = "Peak von Mises stress (outside the fixed base layer and the pin ring) shall not exceed 100 MPa (fatigue-rated allowable)."
metric = "peak_von_mises_MPa"
operator = "<="
limit = 100.0
units = "MPa"

[[requirements]]
id = "REQ-C2"
text = "Pin deflection under the load shall not exceed 0.10 mm."
metric = "pin_deflection_mm"
operator = "<="
limit = 0.10
units = "mm"
