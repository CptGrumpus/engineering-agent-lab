# Study 7, revision 5: refinement of the cold dq table (20 C magnets) where the operating-point search misbehaves.
# Merged with motor_prius_lut_cold_rev5 + motor_prius_lut_cold_lowiq_rev5 it adds an id column at -37.5 A (every
# iq row: 0-300 A in 25 A steps and 6.25-43.75 A in 6.25 A steps) and iq rows at 3.125 and 9.375 A (every id column,
# -37.5 included): 48 grid points, the grid stays complete. Same machine, mesh, steps and loss fit as the tables it
# joins. User's go-ahead 2026-11-24, after 07:38 ("do 1/2 as well": item 2, the low-current rows).
# Why: (a) the revision-5 thermal case's hot-corner state at 5500 rpm, 34 N m (jacket_h1000) has no fixed point: the
# chosen operating point jumps from id -46 to -39 A (iq 10-11 A) between 105 and 106 C magnets, -16 % total loss for
# 1 K, inside the cell id -50..-25, iq 6.25..12.5; (b) the hot map's half-table check fails on the 10 N m row above
# 4000 rpm (iq 2-4 A, inside the first cell). Question: are these the cubic interpolation of a coarse cell, or real?
#
# Predictions (written BEFORE the run, 2026-11-24 07:53):
#   P1 Every point check passes except, possibly, the dq-torque check on the 3.125 / 9.375 A rows at id -175 to
#      -300 A (as the 6.25 A row: small torque, large ripple).
#   P2 At the new nodes, the merged old table (cubic) misses FEMM's torque by under 2 % above 9 A, more at 3.125 A
#      (the old main-table check at new low-iq nodes was 1.06 %).
#   P3 With the refined tables the thermal case's 5500 rpm hot corner converges (the jump was interpolation): about
#      60 % likely; if the jump survives (smaller or not), it is a real switch between field-weakening branches,
#      reported as such.
#   P4 About 30 min per temperature (36 s per grid point, as the earlier tables).
#
# Results (cold 20261124-075333, 07:53-08:23; hot 20261124-082355, 08:23-08:56): verification FAIL on the dq-torque
# check only: cold at id -100 to -300 A, hot at -100 to -300 A except -150 (on the 3.125 / 9.375 A rows); every other
# check passes on all 48 points.
#   P1 MISSED in part: the dq-torque failures reach id -100 A, not only -175 to -300 A (same mechanism: small torque,
#      large ripple at the lowest q-axis currents).
#   P2 HELD, and then some: the old cubic table missed FEMM's torque at the new nodes by at most 0.1 % above 9 A and
#      0.06 % (0.011 N m) on the 3.125 A row (scratch scoring; the only large relative misses are at iq = 0, where the
#      torque is 0.02 N m). The table was not coarse.
#   P3 MISSED (as written: 60 % converge): on the refined tables the thermal case's 5500 rpm hot corner still cycles
#      (motor_prius_thermal_rev5_refined, 8.83 K): a real switch between two near-equal-loss operating points. The hot
#      map's light-load row, by contrast, was a half-table effect: on the refined grid the half-table check is 0.31
#      points at most (2.32 before), because the half table now keeps low-iq rows (motor_prius_efficiency_rev5_refined).
#   P4 HELD: 30 / 32 min.

[case]
name = "motor_prius_lut_cold_refine_rev5"
model = "pyleecan_femm_lut"
description = "SUPPLEMENTARY REFINEMENT of the revision-5 tables (an id column at -37.5 A over every iq row, and iq rows at 3.125 and 9.375 A over every id column, so the merged grid stays complete): 2004 Toyota Prius traction motor (revision 5, laminations M330-35A, magnets at 20 C), dq look-up table, id 0 to -300 A rms and iq 6.25 to 43.75 A rms in 6.25 A steps (supplementary low-current rows), 1000 rpm; Pyleecan + FEMM 4.2 magnetostatics over one electrical period (48 steps) with element fields; mesh fineness 2; torque, dq flux linkages and iron-loss coefficients. Revision 5 (client data: magnet 83.1 x 18.9 x 6.5 mm centred in the 6.80 mm pocket, 1.255 T at 20 C, air gap 0.775 mm; machine Toyota_Prius_ORNL_rev5centre.json)."
assumptions = [
  "2D magnetostatics (FEMM), no end effects; torque is the mean of FEMM's stress-tensor torque over one electrical period.",
  "Iron loss from the element fields with the M330-35A three-term fit applied per harmonic; rotational fields counted as two orthogonal alternating ones; minor loops and DC bias not modelled.",
  "Core mass without the stacking factor (FEMM models the stack as solid steel, lam_fill 1).",
  "Magnet temperature 20 C (MagFEMM T_mag; Br falls 0.1 %/K).",
  "Copper 76.4 mm^2 per slot (Pyleecan's 13 x 0.912 mm strands per turn, 9 turns), consistent with ORNL's 0.84 fill on the squares of insulated wires.",
]
limitations = [
  "No test data in this case: the ORNL comparison is a separate, blind step at the end of the study.",
  "The loss fit covers 0.1-1.8 T at 50-2500 Hz; deep-saturation regions (tooth tips at load) extrapolate it.",
  "No magnet eddy-current loss, no AC copper loss (proximity, skin), no mechanical loss.",
]

[parameters]
machine = "Toyota_Prius_ORNL_rev5centre.json"
speed_rpm = 1000.0
id_A = 0.0
iq_min_A = 6.25
iq_max_A = 43.75
iq_steps = 7
mesh_fineness = 2.0
steps_per_period = 48
angle_points = 2048
magnet_temperature_C = 20.0
iron_kh = 0.0202
iron_alpha = 1.791
iron_kc = 7.91e-5
iron_ke = 3.70e-4
slot_fill = 0.5345
slot_area_mm2 = 143.0
turns_per_slot = 9

