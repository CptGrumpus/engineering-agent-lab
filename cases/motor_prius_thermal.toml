# Study 7, thermal network: steady lumped network of our 2004 Prius machine (models/motor/thermal_network.py), coupled
# to the verified dq tables (losses at the network's temperatures, iterated to a self-consistent state). Independent
# check: CalculiX steady 2D conduction on half a slot pitch of the stator with the same losses, conductivities and
# boundary conditions as the network's cross-section part (three meshes).
#
# Decision (agreed with the user 2026-11-22 ~17:20): (1) the continuous torque-speed envelope, 500-6000 rpm, that keeps
# the winding hotspot within class H (180 C) and the magnets within 150 C under a stated water jacket; (2) whether the
# efficiency map's hot corner (windings 100 C, magnets 80 C) is a consistent steady operating state, and where. User's
# choices: limits class H 180 C winding hotspot and 150 C magnets (both synthetic: the insulation class and magnet grade
# are not in the design data we may read); cooling a water-glycol jacket at 65 C with h 3000 W/m^2 K on the housing,
# swept 1000-6000 (synthetic). REQ-TH1's 25 kW is our choice (half the 50 kW peak rating, a common continuous-to-peak
# ratio), to turn the envelope into a verdict; the envelope itself is the deliverable. Thermal is not in the agreed
# ORNL validation set; no ORNL data was opened for this case (ORNL's thermal report test pages stay sealed).
#
# Sources for the inputs (none from ORNL test data):
# - Geometry: models/motor/Toyota_Prius_ORNL.json (Pyleecan SlotW11 outline: shoulder x 81.9727 mm, width 3.1496 mm
#   widening to 5.6388 mm at the round end, centre x 111.6653 mm; active slot area 142.96 mm^2, which geometry()
#   reproduces to 0.001 mm^2). Copper 76.4 mm^2 per slot (the 2026-11-22 copper correction). End connection 120.6 mm
#   per side, extension 38.4 mm (the efficiency case's estimate).
# - End-space convection: h = k1 + k2 v^k3, v the rotor peripheral speed (Boglietti and Cavagnino, IEEE TIA 43(5) 2007,
#   eq. 1 in the form k1 (1 + k2' v^k3); constants from Altair Flow Simulator's motor end-space table, which cites
#   Micallef's thesis (Nottingham) and Boglietti and Cavagnino 2007): winding 15 / 6.0 / 0.9 (= 15 (1 + 0.4 v^0.9)),
#   housing 20 / 8.7 / 0.7, rotor 41.4 / 6.22 / 1.0. Measured on TEFC induction motors with finned end rings: our rotor
#   has none, so end_space_h_scale 0.5 is a sensitivity scenario.
# - Air gap: conduction only (Nu = 2 on 2 g, the laminar Couette regime of Taylor 1935 / Gazley 1958 as summarised by
#   Staton, Boglietti and Cavagnino, IEEE TEC 20(3) 2005, sec. VI). The vortex-regime constants could not be read
#   (equations are images in the PDF), so no vortex enhancement: the lower bound, conservative for the rotor;
#   air_gap_h_factor 3 is a sensitivity scenario.
# - Stator-housing interface: an equivalent air gap of 0.037 mm, the average of the measured lamination-housing gaps in
#   Staton et al. 2005 Table III (they report 0.01-0.08 mm over machines); swept 0.01 / 0.08.
# - Synthetic (typical values, stated): lamination in-plane conductivity 28 W/m K; impregnant 0.25 W/m K, winding
#   across the slot by the Maxwell-Garnett / Hashin-Shtrikman lower bound k_imp (1 + phi) / (1 - phi) = 1.02 W/m K
#   (phi = 0.606 copper in the winding region), along the slot phi x 390; liner 0.25 mm at 0.2 W/m K; aluminium
#   housing wall 6 mm at 160 W/m K, wetted over the stack and both end-winding extensions.
# - Stator iron split between teeth and yoke: 0.57 to the teeth, from region areas (283.9 / 328.3 mm^2 per slot pitch)
#   weighted by B^2 with B_tooth / B_yoke = 1.25 (tooth flux over the mean tooth width; yoke flux half a sinusoidal
#   pole, (2/pi) tau_p / (2 h_y)). Scenarios 0.4 and 0.75.
#
# Hand estimate (before any run of this model; resistances by hand from the geometry above):
#   slot winding -> coolant: liner 0.023 K/W, winding across the slot 0.0025, iron about 0.002, interface 0.017
#   (the largest after the liner), housing 0.0005, jacket 0.0024: about 0.048 K/W. End windings are tied to the slot
#   copper by the copper itself (about 0.008 K/W), so the copper loss mostly leaves through the liner; the end-space
#   path (about 0.09 K/W at 3000 rpm, 0.057 at 6000) helps at high speed. Allowable rise about 110 K (hotspot 180, slot
#   mean about 170, coolant 65) gives about 2.3 kW of copper loss at about 170 C, about 1.9 kW at the efficiency map's
#   100 C resistance: about 225 N m at 1250 rpm from the hot map's losses, less with magnets hotter than 80 C. At 6000
#   rpm the iron loss (1.4-2.2 kW at 50-80 N m) loads the interface: about 60-65 N m.
#
# Predictions, written BEFORE the first run of this model (no smoke run yet; the unit tests of the T-equivalents ran):
#   P1 Continuous torque 200-235 N m at 1250 rpm, falling with speed; 55-75 N m at 6000 rpm.
#   P2 The winding hotspot binds at every speed; the magnets stay below 150 C (110-145 C on the envelope).
#   P3 REQ-TH1: the least continuous power over 1250-6000 rpm is at 1250 rpm, 25-32 kW: PASS, narrowly.
#   P4 Hot corner: where the winding mean reaches 100 C, the magnets are at 80-90 C below 2000 rpm and 95-110 C at
#      6000 rpm (iron loss heats the teeth and rotor). So the hot corner is consistent at low speed and optimistic for
#      the magnets at high speed.
#   P5 CalculiX section against the network's cross-section: winding mean rise and teeth / yoke mean rises within 5 %;
#      the winding peak (slab factor 1.5) within 5 % (the slot is slab-like, 32 x 3.9 mm); FE mesh GCI under 0.5 %.
#   P6 Network energy balance below 1e-12; the loss-temperature iteration converges to under 0.01 K (the operating
#      point moves on a 1 A grid, so it may stop on a two-point cycle; the check allows 0.1 K); efficiency consistency
#      below 1e-9.
#   P7 Sensitivity: the interface gap moves the envelope most among the stator inputs (0.01 mm: +15-25 % torque at low
#      speed; 0.08 mm: -15-25 %); jacket h 1000: -10-15 %; 6000: +3-5 %; end-space scale 0.5: -3-8 % (most at high
#      speed); air gap x3 lowers the magnets by 5-15 K and barely moves the envelope; winding k x0.5: -5-10 %; teeth
#      fraction 0.4 / 0.75: under 3 %.
#
# Smoke run (scratch, 500 rpm steps, nominal only; AFTER the predictions above were committed in 1040954). It found two
# code defects, fixed before this evidence run: (1) the hot-corner search started at 1 N m, which the operating-point
# search cannot hit (0.5 N m band), so it returned nothing; it now starts at 10 N m, the map's lowest torque; (2) the
# convergence and magnet-extrapolation figures counted the bisection's probes past thermal runaway (winding 383 C at
# 1000 rpm / 300 N m, where the iteration never settles), so they read 1.97 K and 172 K; they now count the reported
# states, and a probe past 400 C stops iterating (it fails the limits either way). Also: gmsh's element sets are read
# from its physical-group *ELSETs, and clockwise triangles are reoriented for CalculiX. The smoke run also showed, and
# this case does NOT act on (the model and tolerances are as committed): the magnet limit binds at every speed, not the
# winding (P2); the CalculiX winding peak rise is about 10 % above the network's slab estimate, mean -4.4 %, teeth
# -3.2 %, yoke +0.7 % (P5); magnets at 93-105 C where the winding mean is 100 C (P4); about 230 N m at 1000 rpm and 67
# N m at 6000 rpm (P1). So P1, P2, P4 and P5 are no longer blind; they stay as written and are scored as written.
#
# Requirements and tolerances were fixed BEFORE the first run.

[case]
name = "motor_prius_thermal"
model = "lumped_thermal"
description = "2004 Toyota Prius traction motor (our machine): steady lumped thermal network from the geometry, coupled to the verified dq tables (losses at the network's temperatures); continuous torque-speed envelope 500-6000 rpm within a 180 C winding hotspot and 150 C magnets under a synthetic 65 C water jacket, and the magnet temperature where the winding mean reaches the efficiency map's 100 C; nominal and nine sensitivity scenarios; CalculiX slot-pitch conduction check."
assumptions = [
  "Steady state; continuous duty. Losses: copper (DC resistance at each winding part's temperature) and iron (the tables' stator and rotor coefficients); no AC copper, magnet eddy-current or mechanical loss (as in the efficiency study). Magnets carry no loss, so they sit at the rotor's mean temperature.",
  "Tables blended linearly in magnet temperature between the cold (20 C) and hot (80 C) runs; above 80 C this is an extrapolation (linear reversible Br loss), reported as magnet_extrapolation_above_hot_table_K.",
  "Cooling synthetic (user, 2026-11-22): water-glycol jacket 65 C, h 3000 W/m^2 K on the housing over the stack and end-winding extensions; the result scales with it through the jacket scenarios.",
  "Limits synthetic (user, 2026-11-22): winding hotspot 180 C (class H), magnets 150 C.",
  "Stator-housing interface: an equivalent air gap of 0.037 mm (Staton et al. 2005 Table III average of measured machines); swept 0.01 / 0.08 mm.",
  "End-space convection from correlations measured on TEFC induction motors (Boglietti and Cavagnino 2007 form; Micallef constants), v = rotor peripheral speed; scenario 0.5x.",
  "Air gap: conduction only (Nu = 2), the lower bound; scenario 3x. Shaft adiabatic: no heat path through the shaft and bearings (conservative for the rotor).",
  "Slot hotspot: winding surface + 1.5 (mean - surface), the slab value; checked against the CalculiX section's peak. End-turn hotspot: slot exit + 1.5 (mean - slot exit), not checked by FE.",
  "Stator iron loss split 0.57 teeth / 0.43 yoke (area x B^2 estimate); scenarios 0.4 and 0.75.",
]
limitations = [
  "No test data: thermal is not in the agreed ORNL validation set.",
  "The CalculiX check covers the stator cross-section only; the axial copper paths, end windings, end space and rotor are network-only (their T-equivalents are exact for 1D conduction, tests/test_motor_thermal.py).",
  "Steady state only: no transient (peak) ratings.",
  "Material conductivities and the slot liner are typical values, not measured on this machine.",
]

[parameters]
# geometry (mm), models/motor/Toyota_Prius_ORNL.json and the efficiency case
n_slots = 48
stack_length_mm = 83.82
stator_outer_radius_mm = 134.62
stator_bore_radius_mm = 80.9625
slot_shoulder_x_mm = 81.9727
slot_width_shoulder_mm = 3.1496
slot_width_round_mm = 5.6388
slot_round_centre_x_mm = 111.6653
slot_opening_mm = 1.9304
liner_thickness_mm = 0.25            # synthetic
copper_area_per_slot_mm2 = 76.4
rotor_outer_radius_mm = 80.1878
rotor_inner_radius_mm = 55.3212
end_connection_length_mm = 120.6
end_extension_mm = 38.4
# materials and cooling
impregnant_conductivity_W_mK = 0.25  # synthetic
copper_conductivity_W_mK = 390.0
liner_conductivity_W_mK = 0.2        # synthetic
lamination_conductivity_W_mK = 28.0  # synthetic, in plane
housing_conductivity_W_mK = 160.0    # synthetic, aluminium
housing_wall_mm = 6.0                # synthetic
interface_gap_mm = 0.037             # Staton et al. 2005 Table III average
jacket_htc_W_m2K = 3000.0            # synthetic (user)
coolant_temperature_C = 65.0         # synthetic (user)
air_gap_h_factor = 1.0
end_space_h_scale = 1.0
winding_k_scale = 1.0
teeth_iron_fraction = 0.57
h_winding_end_space_k1 = 15.0
h_winding_end_space_k2 = 6.0
h_winding_end_space_k3 = 0.9
h_housing_end_space_k1 = 20.0
h_housing_end_space_k2 = 8.7
h_housing_end_space_k3 = 0.7
h_rotor_end_space_k1 = 41.4
h_rotor_end_space_k2 = 6.22
h_rotor_end_space_k3 = 1.0
# electrical (as the efficiency case) and the searches
lut_run_cold = "20261122-102002_motor_prius_lut_cold,20261122-133946_motor_prius_lut_cold_lowiq"
lut_run_hot = "20261122-115824_motor_prius_lut_hot,20261122-143828_motor_prius_lut_hot_lowiq"
efficiency_run = "20261122-153450_motor_prius_efficiency_r1"
series_turns_per_phase = 72
turn_copper_area_mm2 = 8.492
stack_length_m = 0.08382
end_connection_length_m = 0.1206
copper_resistivity_20C_ohm_m = 1.72e-8
copper_alpha_per_K = 0.00393
bus_voltage_V = 500.0
current_limit_design_A = 212.0
winding_hotspot_limit_C = 180.0      # class H (user)
magnet_limit_C = 150.0               # (user)
speed_min_rpm = 500.0
speed_max_rpm = 6000.0
speed_step_rpm = 250.0
hot_corner_winding_C = 100.0
fe_reference_speed_rpm = 3000.0

[[sweep.scenarios]]
name = "nominal"

[[sweep.scenarios]]
name = "jacket_h1000"
jacket_htc_W_m2K = 1000.0

[[sweep.scenarios]]
name = "jacket_h6000"
jacket_htc_W_m2K = 6000.0

[[sweep.scenarios]]
name = "interface_0p01"
interface_gap_mm = 0.01

[[sweep.scenarios]]
name = "interface_0p08"
interface_gap_mm = 0.08

[[sweep.scenarios]]
name = "end_space_half"
end_space_h_scale = 0.5

[[sweep.scenarios]]
name = "air_gap_x3"
air_gap_h_factor = 3.0

[[sweep.scenarios]]
name = "winding_k_half"
winding_k_scale = 0.5

[[sweep.scenarios]]
name = "teeth_0p40"
teeth_iron_fraction = 0.40

[[sweep.scenarios]]
name = "teeth_0p75"
teeth_iron_fraction = 0.75

[numerics]
solver = "numpy linear network; fixed-point loss-temperature iteration; bisection to 0.05 N m; CalculiX 2.22 steady heat transfer on Gmsh 6-node triangles"
fe_element_size_mm = 0.4             # winding element size on the coarsest of three meshes (0.4 / 0.283 / 0.2 mm)

[verification]
balance_rel_tol = 1e-9               # exact linear solve: anything larger is a wiring error
coupling_tol_K = 0.1                 # the operating point moves on a 1 A grid; 0.1 K is far below the limits' meaning
consistency_rel_tol = 1e-6           # same tables, same resistance, same search: must reproduce the efficiency run
fe_balance_rel_tol = 1e-3            # film heat integrated by Simpson on curved quadratic edges
fe_gci_tol = 0.01                    # the reference must be converged well inside the 5 % comparison
section_rise_rel_tol = 0.05          # model form (lumped vs 2D): 5 % of the rise is about 2.5 % of continuous torque (rise ~ I^2)

[[requirements]]
id = "REQ-TH1"
text = "The motor shall deliver at least 25 kW continuously (steady state, winding hotspot <= 180 C, magnets <= 150 C) at every speed from 1250 rpm (just above the 1194 rpm rated base speed) to 6000 rpm, under the stated jacket."
metric = "min_continuous_power_kW"
operator = ">="
limit = 25.0
units = "kW"
