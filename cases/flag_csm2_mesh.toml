# Turek-Hron CSM2: the stiffer flag (mu_s 2.0 MPa, four times CSM1), study 6's solid stage.
# Same model, checks and tolerances as flag_csm1_mesh.toml; read that file for the background.
#
# Reference values (featflow.de, finest level): CSM2 ux = -0.469000e-3 m, uy = -16.9739e-3 m.
# Elastica, plane strain: ux -0.4639, uy -16.851 mm (0.7 % / 1.1 % short of the benchmark).
#
# Predictions, written BEFORE the evidence run:
#   P1 uy(A) about -16.96 mm on the finest mesh, within 0.1 % of the benchmark: REQ-S1 passes.
#   P2 ux(A) about -0.468 mm, within 0.5 %: REQ-S2 passes (ux is only weakly nonlinear here, so it
#      is the more sensitive number).
#   P3 Every point check passes; f1 = 2 x CSM1's (stiffness x 4, same mass), about 2.145 Hz.
#
# Results (run 20261121-131133_flag_csm2_mesh): every check passes on every mesh. uy(A) -16.941 / -16.960 /
#   -16.968 mm, ux(A) -0.46744 / -0.46832 / -0.46872 mm; extrapolated -16.975 and -0.46906 mm, 0.008 % and
#   0.014 % from the benchmark. REQ-S1 PASS (0.034 %), REQ-S2 PASS (0.059 %); observed order 1.13 as in CSM1.
#   P1-P3 held; f1 2.14397 Hz.

[case]
name = "flag_csm2_mesh"
model = "ccx_flag"
description = "Turek-Hron CSM2: the elastic flag alone (plane strain, St. Venant-Kirchhoff, mu_s 2 MPa, nu 0.4, rho 1000 kg/m3) clamped on the cylinder and bent by gravity (2 m/s2); CalculiX NLGEOM static, C3D8I elements of 5 / 2.5 / 1.25 mm; checked against the benchmark, a large-deflection elastica and beam vibration theory."
assumptions = [
  "Plane strain, per unit depth: the benchmark is 2D, and the elastica only matches it with the plane-strain modulus E / (1 - nu^2) (plane stress would give a 17 % larger drop).",
  "St. Venant-Kirchhoff material (CalculiX *ELASTIC under NLGEOM), as the benchmark defines it.",
  "The cylinder is rigid: the flag's left end, on the cylinder arc, is fully clamped.",
  "Gravity is a dead load applied in equal increments; the static solution is path independent (elastic).",
]
limitations = [
  "A solver-qualification case: it shows that the solid participant reproduces the published solid-only results, not that the coupled FSI result is right.",
  "The elastica is a beam model (no shear, straight root, inextensible), so it bounds the FE to about 1 %, not to the benchmark's digits.",
]

[parameters]
shear_modulus_Pa = 2000000.0
density_kg_per_m3 = 1000.0
poisson_ratio = 0.4
gravity_m_per_s2 = 2.0
flag_length_m = 0.35
flag_height_m = 0.02
cylinder_radius_m = 0.05
element_size_mm = 2.5
benchmark_ux_A_mm = -0.469
benchmark_uy_A_mm = -16.9739

[sweep]
parameter = "element_size_mm"
values = [5.0, 2.5, 1.25]

[numerics]
increments = 10

[verification]
equilibrium_rel_tol = 1e-6
elastica_uy_rel_tol = 0.02
elastica_ux_rel_tol = 0.03
frequency_rel_tol = 0.02
height_over_length_max = 0.1
gci_max = 0.01

[[requirements]]
id = "REQ-S1"
text = "Before it is coupled to the fluid, the solid model shall reproduce the Turek-Hron CSM2 vertical displacement of point A within 1 %."
metric = "uy_A_deviation_pct"
operator = "<="
limit = 1.0
units = "%"

[[requirements]]
id = "REQ-S2"
text = "It shall reproduce the CSM2 horizontal displacement of point A within 2 % (a second-order quantity, about a tenth of the vertical one)."
metric = "ux_A_deviation_pct"
operator = "<="
limit = 2.0
units = "%"
