# Study 19 part 3: the backward-facing step (Driver and Seegmiller, ERCOFTAC classic case 030) in 3D, with the wind
# tunnel's side walls. Decision, model and what is not blind: see cases/step3d_symmetry.toml.
#
# Case 3: a bracket on the one input the case description does not give, the side walls' own boundary layer at the
# step. step3d_sidewalls grows it from the inlet, like the floor's (theta about 1.7 mm at x = -4 H). Here the side wall
# is a symmetry plane (slip) upstream of x = -0.30 m and a no-slip wall downstream, so its layer grows over about
# 0.25 m instead of 1.10 m before x = -4 H: theta about a quarter to a third of the floor's (theta ~ length^0.8), the
# thin end of the hand estimate's bracket (a quarter to one and a half times the floor's: recovery lower by 0.028 to
# 0.052; a quarter: 0.028). A thicker side-wall layer than the floor's would need the side walls to start upstream of
# the inlet; its direction is known (a larger fall in recovery) and is stated, not run.
# Spanwise level 1, x-y level 0.5 (step3d_sidewalls' coarser point); the 2D stage is part 2's model as there.
# Inflow re-matched as in step3d_sidewalls, for the thinner layer: the side wall's displacement at x = -4 H is about a
# third of step3d_sidewalls' (2.27 mm in the scratch test), so the core speeds up by about 1.1 % instead of 2.8 %: U_in
# = 41.95 x 44.2 / 44.56 = 41.61 m/s (inflow_velocity, 2 %, checks it).
# Numerics: SIMPLEC (consistent; relaxation p 1, U 0.9, k / omega 0.7) in the 3D stage, part 2's residual targets (p
# 1e-6, U 2e-7, k / omega 2e-6), 300 start-up iterations (first-order k, omega) from the 2D field, then to the targets
# or 20,000 iterations; the 2D stage keeps part 2's SIMPLE (the steady solution does not depend on the relaxation:
# step3d_symmetry checks it). Scratch tests from the 2D field with the side walls (2026-11-27 19:12-19:40, 6 ranks):
# after 300 stage-2 iterations SIMPLEC had p 1.2e-4 against SIMPLE's (part 2's numerics) 4.8e-4, and its p and U
# residuals fell a decade per about 500-600 iterations against SIMPLE's 1,100-2,300, at 0.89 s per iteration against
# 0.78; its probe recovery was flat to 1e-4 from the 20th stage-2 iteration, while SIMPLE's still rose from 0.135 to
# 0.139 over 300. SIMPLEC is used. Besides the residuals, recovery_settled: the probe recovery Cp(30 H) - Cp(-4 H) at
# mid-span may move at most 2e-4 over the last 10 % of the iterations (a tenth of what would matter here).
# Predictions, written BEFORE the evidence run:
#   P1 Every point check passes.
#   P2 The side wall's momentum thickness at x = -4 H is 0.2-0.45 of the floor's (if its young layer stays laminar
#      longer in SST, below that: reported as measured).
#   P3 The mid-span recovery falls from the 2D 0.1553 by 60-85 % of step3d_sidewalls' fall at spanwise level 1 (the
#      side-wall layer's displacement grows mostly downstream of the step, in the adverse gradient, where both layers
#      grow; the hand estimate's ratio is 0.028 / 0.040 = 0.70), so the 3D recovery lies between the nominal 3D value
#      and the 2D one; REQ-S3 passes if the fall is at least 0.0046.
#   P4 About 2-4 h.
#   (revised with the change below, before the run) About 2-3 h: 1.08 s per iteration,
#   4,000-6,000 iterations.

# Changed after step3d_symmetry (run 20261127-200510), before this case's first run (2026-11-27 22:30): p relTol
# 0.01 instead of 0.05 in the 3D stage, and the iteration cap 12,000 instead of 20,000. That run passed the exact 2D
# limit but FAILED `continuity` (1.84e-6 against part 2's 1e-6): with SIMPLEC the pressure equation's coefficients are
# larger, so the same normalised residual leaves a larger flux imbalance, and the imbalance after each pressure solve is
# relTol x the initial one. A restart from the same state (scratch t_sym, 40 iterations) with relTol 0.01 cut it 5.4x
# at once (8.9e-6 to 1.6e-6) for 24 % more time per iteration (1.08 against 0.87 s). The criterion is part 2's,
# unchanged. The cap: SIMPLEC fell a decade per 500-700 iterations in every test; 12,000 is three times what six
# decades need.

# Results (run 20261128-054328_step3d_sidewall_start, 05:43-08:24, 2 h 41 min, 6 ranks; 3D stage 12,000 iterations,
# 0.73 s per iteration): VERIFICATION FAIL, 9 of 11 checks pass. REQ-S3 PASSES on the number (mid-span recovery 0.1349,
# window 0.1107-0.1507), shown as unverified by the run's status. Against the measurements (compare.py,
# validation/step_driver_seegmiller/part3_thin): Xr/H 6.436 against 6.26 (+2.8 %), Cf rms 8.8 %, recovery 0.1349
# against 0.1307 (+0.0042): all three PASS (unverified).
#   P1 FAILED in the same two checks as step3d_sidewalls, the same way: the p residual stalled at 2.0-2.1e-5 from
#      iteration 2,000 to the cap (target 1e-6), Uz at 3.8-4.0e-6 from iteration 6,000 (target 2e-7), continuity
#      4.4-7.6e-6 (final 5.2e-6 against 1e-6). The largest spanwise velocity, 11.8 % of U_ref, is in the same cell as
#      in step3d_sidewalls' level-1 point (x 1.0 mm, y 12.3 mm, 18.5 mm from the side wall, just behind the step
#      lip): with or without a side-wall layer upstream, the same place. The probe recovery moved 4e-6 between
#      iterations 4,000 and 12,000 (recovery_settled 6.4e-7 against 2e-4). Every other check passes: mass balance
#      2.8e-8, inflow theta within 1.5 % and U_e within 0.2 % of the stated values, y+ 0.54, cell map 1e-12 m.
#   P2 HELD: the side wall's theta at -4 H (channel mid-height) 0.507 mm, 0.30 of the floor's 1.672 (predicted
#      0.2-0.45); its displacement thickness 0.74 mm at -4 H (step3d_sidewalls: 2.28) and 1.81 mm at 30 H (3.39).
#   P3 FAILED, just outside its range: the mid-span recovery fell 0.0204 from the 2D 0.1553, 88 % of
#      step3d_sidewalls' 0.0232 at the same spanwise level (predicted 60-85 %), to 0.1349. A third of the side-wall
#      layer at the step, and about half its displacement thickness at 30 H, still gives most of the fall. The
#      inflow layer matters less than the hand estimate's ratio (0.70) assumed: the recovery counts from -4 H, where
#      both runs match the stated edge velocity, and the side wall's displacement thickness grows from -4 H to 30 H
#      by about the same in both (1.06 mm here, 1.11 mm in step3d_sidewalls). REQ-S3 passes (the fall exceeds
#      0.0046). Xr/H 6.436, 0.28 % above the 2D 6.418 (step3d_sidewalls: 0.16 % below); Cf(20 H) 2.6 % above the 2D's.
#   P4 HELD (revised range): 2 h 41 min against 2-3 h, but at 0.73 s per iteration (predicted 1.08) over 12,000
#      iterations (assumed 4,000-6,000).
# Across the span: Xr/H 6.44 at mid-span, 6.43 at 20 mm from the side wall, 6.72 at 5 mm, 7.6 in the wall's first
# cells (step3d_sidewalls: 6.21 at 5 mm).
# What it shows: the side walls' effect on the recovery depends little on the one input the case description does
# not give. With the side walls' layers from the inlet the recovery is 0.1321, with layers a third as thick at the
# step 0.1349; both lie within 0.0042 of the measured 0.1307, and REQ-S1, S2 and S3 pass at both ends of the bracket.
# A thicker layer than the floor's would lower the recovery further (stated, not run). The verdicts stay
# unverified: the same pressure stall, in both runs, and the same cell behind the step lip holds the largest
# spanwise velocity.

[case]
name = "step3d_sidewall_start"
model = "openfoam_step3d_rans"
description = "Backward-facing step in 3D with the side wall slip upstream of x = -0.30 m and no-slip downstream: a thinner side-wall boundary layer at the step (bracket on the unstated side-wall inflow); spanwise level 1, x-y level 0.5."
assumptions = [
  "As step3d_sidewalls, except the side walls' boundary layers start at x = -0.30 m (slip upstream of it), a bracket: the case description does not give them.",
  "Inflow re-matched to the stated edge velocity at x = -4 H at mid-span (44.2 m/s); 2D stage at part 2's 41.95 m/s.",
]
limitations = [
  "One x-y and one spanwise mesh level (the coarser of step3d_sidewalls'); the thin side-wall layer starts from a slip-to-wall jump.",
]

[parameters]
step_height_m = 0.0127
inlet_height_ratio = 8.0
reynolds_number_h = 37500.0
inlet_velocity_m_per_s = 41.61
inlet_velocity_2d_m_per_s = 41.95
reference_velocity_m_per_s = 44.2
upstream_length_m = 1.153
downstream_length_over_h = 50.0
inlet_turbulence_intensity = 0.01
inlet_viscosity_ratio = 10.0
mesh_level = 0.5
turbulence_model = "kOmegaSST"
half_span_m = 0.0755
side_wall = 1.0
spanwise_level = 1.0
side_wall_start_m = -0.30

[numerics]
residual_p = 1e-6
residual_U = 2e-7
residual_turb = 2e-6
max_iterations = 12000           # stage 2 ends here at the latest (stage 1: 300 iterations)
stage1_iterations = 300
max_iterations_2d = 80000
stage1_iterations_2d = 500
consistent = true
relax_p = 1.0
relax_U = 0.9
relax_turb = 0.7
p_rel_tol = 0.01                 # 3D stage only (see the header)
n_procs = 6
probe_interval = 50
solver_timeout_s = 36000

[verification]
continuity_tol = 1e-6
mass_balance_tol = 1e-6
recovery_settled_tol = 2e-4
mesh_match_tol_m = 1e-9
inflow_theta_mm = 1.697          # Re_theta 5000 at U_ref 44.2 m/s, nu 1.497e-5
inflow_u_ref_m_per_s = 44.2
inflow_theta_rel_tol = 0.05
inflow_u_rel_tol = 0.02
yplus_max = 1.0
limit_xr_rel_tol = 1e-3
limit_cp_abs_tol = 5e-4
limit_cf_rel_tol = 5e-3

[[requirements]]
id = "REQ-S3-HIGH"
text = "Part 2's REQ-S3 (upper side): the recovery Cp(30 H) - Cp(-4 H) at mid-span at most the measured 0.1307 + 0.02."
metric = "cp_recovery_30h"
operator = "<="
limit = 0.1507
units = "-"

[[requirements]]
id = "REQ-S3-LOW"
text = "Part 2's REQ-S3 (lower side): the recovery at mid-span at least the measured 0.1307 - 0.02."
metric = "cp_recovery_30h"
operator = ">="
limit = 0.1107
units = "-"
