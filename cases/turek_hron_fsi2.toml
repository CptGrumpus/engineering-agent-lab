# Turek-Hron FSI2: the flag behind the cylinder in self-excited periodic oscillation (Re 100, solid 10 times denser
# than the fluid). Same model as FSI1 (cases/turek_hron_fsi1_mesh_r1.toml: OpenFOAM v2512 moving mesh, CalculiX,
# preCICE parallel implicit IQN-ILS); new here: the periodic statistics (studies/turek_hron_fsi.py, opt-in
# numerics.periodic_periods) and a transient target. Single mesh first (fluid 2.5 mm, FSI1 r1's coarsest level, within
# 1 % of the benchmark there); a mesh / time-step study follows if this one is periodic and stable.
#
# Benchmark (featflow.de FSI benchmark, read 2026-11-22 from TU Dortmund's mirror,
# https://wwwold.mathematik.tu-dortmund.de/~featflow/en/benchmarks/cfdbenchmarking/fsi_benchmark/fsi_tests/fsi_fsi_tests.html;
# featflow.de itself fails the TLS handshake at the server). Parameters: rho_s 10e3 kg/m^3, nu_s 0.4, mu_s 0.5e6 Pa,
# fluid 1e3 kg/m^3, nu_f 1e-3 m^2/s, U 1 m/s (Re 100). Reference row: level 4+0, dt 0.0005:
#   ux(A) -1.485e-2 +- 1.270e-2 m [3.86 Hz]; uy(A) 1.30e-3 +- 8.16e-2 m [1.93 Hz];
#   drag 2.1506e2 +- 7.765e1 N/m [3.86 Hz]; lift 6.1e-1 +- 2.378e2 N/m [1.93 Hz].
# The page's own spread (levels 2-4, dt 0.02 to 0.0005, and its two further tables): uy amplitude 7.87-8.17e-2 (3.8 %),
# drag mean 201-215 (7 %), drag amplitude 67-78 (15 %), lift amplitude 227-286 (233-238 at level 4), frequencies
# 1.9-2.0 and 3.7-3.9 Hz. Definition ("Quantities for comparison"): over the last period, mean = (max + min) / 2,
# amplitude = (max - min) / 2; frequency 1 / period or the lowest significant FFT peak; forces on cylinder + flag.
#
# Requirements: limits set from the benchmark's own spread and what a screening model needs, before any run:
# uy amplitude 5 % (spread 3.8 %), uy frequency 3 %, drag mean 5 % (FSI1 matched drag to 0.03 %), drag amplitude 15 %
# (spread 15 %), lift amplitude 10 %, ux mean 10 % (a second-order quantity, as in FSI1).
#
# Choices: dt 0.001 s (the benchmark's dt 0.001 rows agree with its dt 0.0005 rows within 1-2 %); 15 s (the
# reference time series starts at 10 s; the oscillation must grow from the symmetric state and settle); coupling
# tolerance 1e-5 (FSI1: 1e-6 changed the means by under 1e-5 relative against 1e-4, at +19 % iterations); no
# numerical damping in the solid (solid_alpha 0: damping would eat the self-excited amplitude; FSI1 used -0.3 only to
# settle faster); statistics over the last 4 whole periods of uy(A).
#
# Predictions, written BEFORE any FSI2 run (hand reasoning: FSI1's accuracy at 2.5 mm, the benchmark's spread):
#   P1 The oscillation grows from rest without an imposed perturbation and is periodic by about 10 s; the last two
#      periods agree within 1 %; every coupling window converges; the moving mesh survives the 82 mm tip swing (the
#      largest risk: if anything fails, it is the mesh motion near the tip).
#   P2 uy(A) amplitude 7.9-8.3e-2 m (within 3 %), frequency 1.90-1.96 Hz (within 2 %).
#   P3 Drag mean 205-220 N/m, drag amplitude 68-82 N/m at 3.8-3.9 Hz; lift amplitude 220-245 N/m.
#   P4 ux(A) mean -1.40 to -1.55e-2 m.
#   P5 Every requirement PASS (single mesh: no discretization uncertainty claimed).
#   P6 Force transfer over 4 whole periods within 1e-2 (the flag's inertia force averages out only over whole
#      periods); inflow exact.
#   P7 About 4-7 h (15000 windows, 4-6 coupling iterations each, against FSI1's 3.5 at 0.64 s per window).
#
# Requirements and tolerances were fixed BEFORE the first run.

[case]
name = "turek_hron_fsi2"
model = "openfoam_ccx_precice_fsi"
description = "Turek-Hron FSI2: self-excited periodic oscillation of the elastic flag behind the cylinder (Re 100, density ratio 10); OpenFOAM v2512 (moving mesh) coupled to CalculiX through preCICE; fluid 2.5 mm at the body, solid 2.5 mm, dt 0.001 s to 15 s; mean, amplitude and frequency of the tip displacements, drag and lift over the last periods against the published benchmark."
assumptions = [
  "2D: one cell deep in the fluid, plane strain in the solid (one element layer, as deep as the fluid).",
  "St. Venant-Kirchhoff solid (CalculiX *ELASTIC under NLGEOM), no gravity, as the FSI tests define it.",
  "No numerical damping in the solid (HHT alpha 0).",
  "Inflow: the benchmark's parabola with its (1 - cos) ramp over 2 s.",
  "Statistics from the last whole periods (benchmark definition); the oscillation is periodic (checked: last two periods).",
]
limitations = [
  "Single fluid mesh and time step: no discretization uncertainty in this case.",
  "The fluid mesh is regenerated per size (FSI1: about +-0.5 % mesh-to-mesh scatter on the tip displacement).",
]

[parameters]
solid_density_kg_per_m3 = 10000.0
shear_modulus_Pa = 500000.0
poisson_ratio = 0.4
fluid_density_kg_per_m3 = 1000.0
kinematic_viscosity_m2_per_s = 0.001
mean_velocity_m_per_s = 1.0
fluid_cell_size_m = 0.0025
solid_element_size_mm = 2.5
time_step_s = 0.001
end_time_s = 15.0
# steady-case benchmark keys (required by the study; unused in periodic mode): the periodic means
benchmark_ux_A_m = -1.485e-2
benchmark_uy_A_m = 1.30e-3
benchmark_drag_N_per_m = 215.06
benchmark_lift_N_per_m = 0.61
benchmark_ux_A_mean = -1.485e-2
benchmark_ux_A_amp = 1.270e-2
benchmark_ux_A_freq_Hz = 3.86
benchmark_uy_A_mean = 1.30e-3
benchmark_uy_A_amp = 8.16e-2
benchmark_uy_A_freq_Hz = 1.93
benchmark_drag_mean = 215.06
benchmark_drag_amp = 77.65
benchmark_drag_freq_Hz = 3.86
benchmark_lift_mean = 0.61
benchmark_lift_amp = 237.8
benchmark_lift_freq_Hz = 1.93

[numerics]
periodic_periods = 4
solid_alpha = 0.0
write_interval_s = 1.0
ramp_time_s = 2.0
coupling_rel_tol = 1e-5
coupling_max_iterations = 100
rbf_support_radius_m = 0.05
solver_timeout_s = 43200

[verification]
periodic_rel_tol = 0.02           # last two periods: uy amplitude and drag mean agree within 2 % (a settled cycle)
force_transfer_rel_tol = 0.01     # means over 4 whole periods: inertia cancels to within the period detection
profile_rel_tol = 1e-6
gci_max = 0.01

[[requirements]]
id = "REQ-FSI2-1"
text = "The coupled model shall reproduce the FSI2 amplitude of the tip's vertical displacement within 5 %."
metric = "uy_A_amp_deviation_pct"
operator = "<="
limit = 5.0
units = "%"

[[requirements]]
id = "REQ-FSI2-2"
text = "It shall reproduce the FSI2 oscillation frequency (uy of point A) within 3 %."
metric = "uy_A_freq_Hz_deviation_pct"
operator = "<="
limit = 3.0
units = "%"

[[requirements]]
id = "REQ-FSI2-3"
text = "It shall reproduce the FSI2 mean drag within 5 %."
metric = "drag_mean_deviation_pct"
operator = "<="
limit = 5.0
units = "%"

[[requirements]]
id = "REQ-FSI2-4"
text = "It shall reproduce the FSI2 drag amplitude within 15 % (the benchmark's own levels spread 15 %)."
metric = "drag_amp_deviation_pct"
operator = "<="
limit = 15.0
units = "%"

[[requirements]]
id = "REQ-FSI2-5"
text = "It shall reproduce the FSI2 lift amplitude within 10 %."
metric = "lift_amp_deviation_pct"
operator = "<="
limit = 10.0
units = "%"

[[requirements]]
id = "REQ-FSI2-6"
text = "It shall reproduce the FSI2 mean horizontal tip displacement within 10 % (second order, as in FSI1)."
metric = "ux_A_mean_deviation_pct"
operator = "<="
limit = 10.0
units = "%"
