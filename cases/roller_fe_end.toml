# Study 10 part 2, the 3D FE roller's end region: the crowned design with the crown drawn finely along the roller.
#
# Why: roller_fe_mesh's 0.06 mm point (run 20261127-180915, landed 00:13 2026-11-28) read 634.5 MPa at mid-length but
# 724.1 MPa 0.46 mm from the roller's end, over the 650 MPa limit, where the 0.08 mm point had read 631.6 there. That
# case refines only the in-plane contact mesh; the layers along the roller stay at 0.2 mm at the end (its stated
# limitation). The end values also jump from step to step while mid-length rises smoothly (0.06 mm, at 14.54 mm:
# 751 / 771 / 697 / 816 MPa over the four approaches; 0.08 mm, at 14.80 mm: 553 / 276 / 315 / 284).
# Diagnosis (scripts/roller_crown_layers.py, 2026-11-28): the mesh draws the crown exactly at its layer planes and
# straight between them; the log crown climbs from 6.5 um at 0.2 mm from the end to 30 um at the end, so a 0.2 mm end
# layer cuts the roller short with a kink. Fed that piecewise-linear crown, the half-space model (which has no end
# face at all) puts its own peak at the end: 667.5 MPa at 14.55 mm with the 0.2 mm end layer (growth 1.3), against
# 616.6 at mid-length for the exact crown; 638.4 / 617.5 / 616.9 with end layers 0.1 / 0.05 / 0.025 mm at growth 1.2.
# So the end peak can be the drawing of the crown, not the roller's end. This case tests that on the FE model: the
# in-plane mesh fixed at the 0.08 mm level, the end layer refined 0.1 / 0.05 / 0.025 mm (growth 1.2, the longest
# layer 1.0 mm as before; 73 / 86 / 96 k nodes, meshed in scratch). Two approach steps bracketing the load (the
# mesh run bracketed it between 0.97 and 1.02 at both meshes; target factor about 1.002).
#
# Predictions, written BEFORE the evidence run:
#   P1 Equilibrium, the load bracket and the elastic check pass at every point; contact_integral FAILS at every point
#      (about 11 %, the in-plane mesh's smearing: 10.8 % at 0.08 mm); hertz_mid_pressure FAILS narrowly at every
#      point (about 3.2 %, as the 0.08 mm point: the in-plane mesh is the same).
#   P2 Mid-length pressure 647 +- 5 MPa at every point (the 0.08 mm point's 647.1: the end layers do not reach
#      mid-length).
#   P3 The end peak is the crown's drawing: at 0.05 and 0.025 mm the peak is at mid-length (peak_over_mid 1.000,
#      15 mm from the end) and the largest pressure beyond 12 mm from mid-length is at least 1 % under mid-length's,
#      at both steps; the ratio of that end maximum to mid-length changes by less than 0.03 between the two steps
#      (0.2 mm end layer, 0.08 mm: 0.96 / 0.98 / 0.97 / 1.14 over the four steps). At 0.1 mm the end may still read
#      at or above mid-length (the half-space with those planes: +3.5 %).
#   P4 REQ-C1-3D passes at 0.05 and 0.025 mm (about 647 against 650 at the coarsest in-plane mesh; finer in-plane
#      meshes read lower at mid-length: 634.5 at 0.06), and at 0.1 mm if its end stays under 650.
#   P5 About 9 hours (2.3 / 3.0 / 3.6 h), sharing the machine with roller_fe_mesh's last point and the step chain.
#   If P3 fails (the end peak stays with the crown drawn finely), the end effect is the 3D roller's own (its free end
#   face), and the next case is a stronger crown on the FE model (the half-space window runs to 2.5 x Lundberg).
#
# Results (run 20261128-014852_roller_fe_end, 01:48-11:24, 9 h 35 min; 2 h 43 / 3 h 55 / 2 h 57 min per point):
# VERIFICATION FAIL: contact_integral fails at every point (10.0 / 9.6 / 10.0 %). REQ-C1-3D as reported: PASS at 0.1
# and 0.025 mm (647.0 MPa, at mid-length), FAIL at 0.05 mm (668.1 MPa, 0.37 mm from the end), all unverified.
#   P1 FAILED in one part: equilibrium, the load bracket and the elastic check pass at every point and contact_integral
#      fails at every point (predicted about 11 %), as predicted; hertz_mid_pressure passes narrowly at every point
#      (2.9 / 2.7 / 2.9 % against 3 %), where about 3.2 % (a narrow fail) was predicted.
#   P2 HELD: mid-length 647.0 / 647.0 / 647.0 MPa (647.02, 646.96, 646.96).
#   P3 FAILED at 0.05 mm, held at 0.025 mm. At 0.025 mm the end region's largest pressure (beyond 12 mm from
#      mid-length) is 0.933 / 0.938 of mid-length's at the two steps, 2.65 mm from the end, a change of 0.005. At
#      0.1 mm, 0.932 / 0.937 at 2.60 mm (P3 allowed it to read at or above mid-length; it did not). At 0.05 mm, 0.940
#      at the lower step (2.96 mm from the end), then 1.060 at the upper: one layer 0.37 mm from the end read 466.3 MPa
#      at the lower step and 692.0 at the upper, +48 % for 4.9 % more load, while mid-length rose 2.1 %.
#   P4 FAILED as reported: 0.05 mm FAILS at 668.1 MPa. That value is not a pressure the model computed anywhere. The
#      study blended each step's own maximum (639.6 at mid-length, 692.0 at the end) with the load weight, at the
#      upper step's position; the interpolated profile reads 589 MPa there and peaks at 647.0 near mid-length.
#      Fixed 2026-11-28 (studies/roller_3d.py interpolate_to_target: the peak from the interpolated profile).
#   P5 HELD on the total, 9 h 35 min against about 9; the per-point times (2.7 / 3.9 / 3.0 h, predicted 2.3 / 3.0 /
#      3.6) followed the machine's load, not the node count.
# What it shows: the end peak is neither the drawn crown nor the free end face. Both would show at both load steps and
# get stronger or weaker steadily as the end layers refine. Here it appears at one point of three (the middle end
# layer) and at one step of two. scripts/roller_step_consistency.py, run over both FE runs, finds the same signature
# in roller_fe_mesh. Its end layer 0.46 mm from the end reads 751 / 771 / 697 / 816 MPa over four evenly rising loads
# at 0.06 mm, and 738 / 746 / 698 / 873 at 0.045 mm; its 0.08 mm point holds 0.96-0.98 of mid-length for three steps,
# then jumps to 1.14 at the fourth. The end/mid ratio between the bracketing steps moves 0.149 / 0.106 there, and
# 0.004 / 0.005 / 0.005 on the settled meshes (0.08 mm in roller_fe_mesh; 0.1 and 0.025 mm here). The FE model's end
# pressure is therefore not settled on four meshes of six, and an unsettled value is not evidence either way. The
# study now checks it (end_consistency, tolerance 0.03, this P3's own criterion, committed before the run): it fails
# exactly the three points that read over 650 at the end (724.1, 715.7, 668.1) and passes the other three. Where
# the end is settled, it sits at 0.93-0.98 of mid-length: the crowned roller's peak is at mid-length, 634.5-647.1 MPa
# on every mesh of both runs. That is under 650, with a 0.4-2.4 % margin, and unverified on contact_integral (6-11 %).
# The pre-written branch for a failed P3 (a stronger crown) is not taken: it assumed a steady end effect, and this
# one is not steady.

[case]
name = "roller_fe_end"
model = "ccx_roller_3d"
description = "Study 10's track roller (100 mm diameter, 30 mm long [synthetic], 500 N/mm) with the chosen logarithmic crown (A = 1.793 um, z_m 30 um) on a 60 mm plate, 3D CalculiX penalty contact, 0.08 mm contact elements; the layers along the roller refined at the end (0.1 / 0.05 / 0.025 mm) to draw the crown's steep end; two approach steps bracketing the load."
assumptions = [
  "Linear elastic steel (E 210 GPa, nu 0.3), frictionless penalty contact as study 10 (50 E / h).",
  "Quarter model: symmetric about the plane through the roller's axis and about its mid-length; the plate 60 mm wide, 50 mm deep, 120 mm long (study 10's section).",
  "The crown applied as a micron drop of the roller's nodes (each slice shifted), capped at 60 um; between layer planes the surface is straight (8-node bricks).",
  "The results interpolated linearly in load between the two steps that bracket 500 N/mm.",
]
limitations = [
  "In-plane contact mesh fixed at 0.08 mm, the coarsest level of roller_fe_mesh: the mid-length value carries that mesh's discretization error, measured there.",
  "No misalignment; contact pressure and the shear below it only.",
]

[parameters]
roller_radius_mm = 50.0
roller_length_mm = 30.0
plate_width_mm = 60.0
block_half_width_mm = 60.0
block_depth_mm = 50.0
youngs_modulus_MPa = 210000.0
poisson_ratio = 0.3
yield_strength_MPa = 1200.0
contact_element_size_mm = 0.08
far_element_size_mm = 4.0
refined_zone_mm = 1.6
end_layer_mm = 0.05
layer_growth = 1.2
max_layer_mm = 1.0
penalty_stiffness_factor = 50.0
line_load_N_per_mm = 500.0
profile = "log"
crown_A_um = 1.793145692168688       # 1.3 x Lundberg's 1.379 um (roller_hs_mesh)
crown_zm_um = 30.0
cap_um = 60.0
approach_mm = 0.0155
approach_factors = [0.98, 1.02]

[sweep]
parameter = "end_layer_mm"
values = [0.1, 0.05, 0.025]

[numerics]
solver_timeout_s = 64800
threads = 4

[verification]
equilibrium_rel_tol = 1e-5
hertz_rel_tol = 0.03
integral_rel_tol = 0.03
mesh_noise_rel = 1e-3
gci_max = 0.03

[[requirements]]
id = "REQ-C1-3D"
text = "The peak contact pressure anywhere along the crowned roller shall not exceed 650 MPa (study 10's REQ on the peak pressure), on the 3D finite-element model."
metric = "peak_contact_pressure_MPa"
operator = "<="
limit = 650.0
units = "MPa"
