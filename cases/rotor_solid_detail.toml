# Study 23 part 2: the fan rotor as a 3D solid. Part 1 (cases/rotor_fan_design.toml, page 23) recommends a 65 mm shaft
# from a ROSS beam model: a uniform shaft, the impeller a rigid 400 x 25 mm disc bored to it, point bearings at the
# shaft's ends; first forward critical 3714 rpm on the soft bearings (1e7 N/m), 23.8 % over the 3000 rpm top speed
# (REQ-G1: at least 15 %). A real rotor has its impeller on a hub and smaller bearing journals, and a disc that is not
# rigid: does the recommendation hold?
#
# Model (models/fea/rotor_solid.py, studies/rotor_solid.py): the rotor as a 3D solid (CadQuery, Gmsh C3D10, CalculiX
# *FREQUENCY), half model about a plane through the axis (the lateral bending modes in that plane), bearings as point
# springs on rigid end faces, everything bonded. In each point ROSS runs on the same rotor (models/rotor/fan_rotor.py,
# now with an optional hub, taken as shaft elements of the hub's diameter, and journals). The solid checks ROSS at
# rest; ROSS's critical speed (with the gyroscopic terms a modal solid at rest lacks) is then corrected by the solid's
# ratio of the first frequencies at rest.
#
# Smoke (scratch, between 11:36 and 11:58; 8 mm elements, 53-61 k nodes, 25-33 s a solve): ROSS's builder reproduces part 1 (3714
# rpm, 61.88 Hz at rest, 1e7); the solid on the uniform rotor 62.38 Hz (+0.8 %); with a 130 x 100 mm hub and 55 x 50
# mm journals the solid gives 61.41 Hz (-1.6 % on its uniform rotor) where ROSS gives 62.64 Hz (+1.2 % on its own):
# the beam model gets the detail's direction wrong. Corrected critical about 3685 rpm. Two CalculiX traps: *SPRING
# reads "card without data" unless the stiffness has a decimal point; the hub and journal lengths must fall on ROSS's
# element nodes (50 mm elements).
#
# This case: the detail one feature at a time, soft bearings (they govern), elements 8 mm (mesh scale 0.8): the
# uniform rotor; a hub only (130 x 100 mm, bonded); journals only (55 x 50 mm at each end); both; both on stiff
# bearings (1e8). Hub and journal sizes are [synthetic]: a plausible layout for a 65 mm shaft and a 400 mm impeller,
# not a client's drawing.
#
# Predictions, written BEFORE the run (2026-11-27 11:58):
#   P1 uniform: as the mesh study's 0.8 level (solid / ROSS 1.005-1.010).
#   P2 hub only: ROSS 1-2 % above its uniform rotor, the solid 0-1.5 % below its own: solid / ROSS 0.97-0.99. The
#      beam model's fat shaft section over-stiffens what a bonded hub does (the load enters the hub over its length).
#   P3 journals only: both models 0.3-1.0 % below their uniform rotors, solid / ROSS within 0.5 % of the uniform
#      ratio (a stepped shaft is what beam elements describe well).
#   P4 detailed: solid / ROSS 0.975-0.985; corrected critical 3660-3710 rpm, margin 22-24 %: REQ-G1 passes, the 65 mm
#      recommendation holds. On stiff bearings the margin stays above 45 %.
#   P5 solid_vs_ross (2 %) passes on the uniform rotor and journals only, may fail with a hub (the point of the case);
#      every other check passes; under 10 minutes.
#
# Results (run 20261127-120457_rotor_solid_detail, 12:05-12:09, scored 2026-11-27 12:10). VERIFICATION FAIL on
# solid_vs_ross at detailed_kb1e8 (3.1 %), the hub's effect this case is about.
#   P1 held: uniform solid / ROSS 1.0081.
#   P2 half held: hub only, ROSS +1.13 % on its uniform rotor (in 1-2 %), the solid -1.62 % on its own (predicted
#      0 to -1.5 %): solid / ROSS 0.9807 (in 0.97-0.99). The beam model gets the hub's effect backwards.
#   P3 half held: journals only, solid / ROSS 1.0080, the same as the uniform rotor (held); but both models rise
#      slightly (+0.1 %), where a fall was predicted: the journals sit where the bending moment is smallest, and they
#      take mass off.
#   P4 held: detailed solid / ROSS 0.9805; corrected critical 3686 rpm, margin 22.9 % (REQ-G1 passes: the 65 mm
#      recommendation holds); stiff bearings 0.9691, 4578 rpm, margin 52.6 %.
#   P5 held: solid_vs_ross passes on the uniform rotor, journals, hub (1.93 %) and detailed (1.95 %) at 1e7 and fails at
#      1e8 (3.09 %): the stiffer the bearings, the more of the rotor's flexibility is the shaft, the larger the hub's
#      share; every other check passes; 4 minutes.
# Findings:
#   1. A hub on a beam model is a choice between two wrong answers. As a shaft section of the hub's diameter (ROSS
#      here) it is too stiff: +2.0 % (soft bearings) to +3.2 % (stiff) on f1 against the solid. As mass and inertia
#      only (a rigid disc element; scratch, 12:10) it is too soft: 57.81 Hz, -5.9 % (69.52 Hz, -8.8 % on stiff
#      bearings). A 100 mm hub on a 65 mm shaft stiffens it partly, and only the solid says how much.
#   2. For study 23 the difference does not change the verdict: the corrected first critical is 3686 rpm on soft
#      bearings, 22.9 % above the top speed (part 1's beam model: 23.8 %).

[case]
name = "rotor_solid_detail"
model = "ccx_rotor_solid"
description = "Fan rotor (study 23 part 2): the real rotor's detail one feature at a time (hub, journals), the 3D solid against ROSS on each, and the corrected first critical speed."
assumptions = [
  "Linear elastic steel (E 205 GPa, density 7850 kg/m^3, Poisson 0.29), as part 1; every part bonded (a hub shrunk or tightly keyed on the shaft); the disc elastic in the solid, rigid in ROSS.",
  "Bearings as point springs at the shaft's end faces (rigid end faces on a reference node, free to rotate), stiffness 1e7 (soft) or 1e8 N/m, as part 1's band; damping left out (natural frequencies).",
  "Half model about a plane through the axis: its modes are the lateral bending modes in that plane (axisymmetric rotor: the other plane is the same).",
  "The solid is at rest; the gyroscopic stiffening at speed comes from ROSS, whose critical speed is scaled by the solid's ratio of first frequencies at rest.",
]
limitations = [
  "Hub and journal sizes are synthetic (a plausible layout, not a drawing); the keyway and key are left out of the solid (a tight key restores the section).",
  "No blades or aerodynamic loads; linear bearings, as part 1.",
]

[parameters]
density_kg_per_m3 = 7850.0
youngs_modulus_Pa = 205000000000.0
poisson_ratio = 0.29
n_elements = 20
bearing_span_m = 1.0
shaft_diameter_m = 0.065
disc_width_m = 0.025
disc_diameter_m = 0.4
bearing_stiffness_N_per_m = 10000000.0
bearing_damping_Ns_per_m = 500.0
speed_min_rpm = 1000.0
speed_max_rpm = 3000.0
campbell_max_rpm = 9000.0
campbell_points = 91
modes = 6
response_points = 41
hub_diameter_m = 0.0
hub_length_m = 0.0
journal_diameter_m = 0.0
journal_length_m = 0.0
element_size_mm = 10.0
mesh_scale = 1.0

[sweep]
[[sweep.scenarios]]
name = "uniform"
mesh_scale = 0.8

[[sweep.scenarios]]
name = "hub"
mesh_scale = 0.8
hub_diameter_m = 0.13
hub_length_m = 0.1

[[sweep.scenarios]]
name = "journals"
mesh_scale = 0.8
journal_diameter_m = 0.055
journal_length_m = 0.05

[[sweep.scenarios]]
name = "detailed"
mesh_scale = 0.8
hub_diameter_m = 0.13
hub_length_m = 0.1
journal_diameter_m = 0.055
journal_length_m = 0.05

[[sweep.scenarios]]
name = "detailed_kb1e8"
mesh_scale = 0.8
hub_diameter_m = 0.13
hub_length_m = 0.1
journal_diameter_m = 0.055
journal_length_m = 0.05
bearing_stiffness_N_per_m = 1.0e8


[numerics]
solver_timeout_s = 1800
solve_timeout_s = 3600
solid_modes = 6

[verification]
volume_rel_tol = 1e-9
min_scaled_jacobian = 0.1
ross_rel_tol = 0.02
gci_max = 0.01

[[requirements]]
id = "REQ-G1"
text = "Every forward critical speed shall lie at least 15 % outside the 1000-3000 rpm operating range (part 1's REQ-G1): here the first forward critical, ROSS's corrected by the solid at rest."
metric = "corrected_margin_pct"
operator = ">="
limit = 15.0
units = "%"
