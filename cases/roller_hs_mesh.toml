# Why (standing rule, 2026-11-27): study 10 passed the roller at 609 MPa against 650 (6 %) as a long roller, plane
# strain, with "no end effects or edge loading". A real roller has ends, and a straight one loads them hard. The 3D FE
# model of the roller (models/fea/roller_3d.py) is built but too slow for a mesh study tonight (one solve about an
# hour); the half-space influence-coefficient method, the standard tool for roller profiles, solves in seconds and is
# exact against two Hertz solutions (scratch, 2026-11-27: a long straight roller's mid-length within 6e-4 of Hertz
# line contact for the line load it carries; a crowned roller within 1.4e-4 of Hertz's elliptical contact).
# This case: the chosen crown (A x 1.3) at three grids, refined together across the contact and along the roller.
# Scratch trials (same settings): 616.32 / 616.62 / 616.76 MPa at grid scale 1 / 1.5 / 2.25.
#
# Predictions, written BEFORE the evidence run:
#   P1 Every check passes at every grid.
#   P2 Peak 616.3 / 616.6 / 616.8 MPa, at mid-length, converging (ratio about 0.47); GCI under 0.1 %.
#   P3 REQ-C1-3D passes by about 5 % (617 against 650): the crowned roller keeps study 10's verdict, with 1.7 % less
#      margin than the long roller.
#   P4 Under a minute.
#
# Results (run 20261127-172428_roller_hs_mesh): verification PASS (9/9 point checks, 1/1 run check).
#   P1 HELD: the Hertz references within 8.9e-4 / 5.7e-4 / 2.4e-4.
#   P2 HELD: peak 616.32 / 616.62 / 616.76 MPa at mid-length; GCI 0.026 %.
#   P3 HELD: REQ-C1-3D passes, 616.8 against 650 MPa (5.1 % margin, the long roller's was 6.8 % against Hertz).
#   P4 HELD.
# Answer: crowned (log, A = 1.3 x Lundberg's, z_m 30 um), the roller keeps study 10's verdict at 617 MPa.

[case]
name = "roller_hs_mesh"
model = "python_roller_halfspace"
description = "Study 10's track roller with a logarithmic crown (A = 1.3 x Lundberg's, z_m 30 um) on half-spaces; grid scale 1 / 1.5 / 2.25 (24 / 36 / 54 cells across, end cells 0.1 / 0.067 / 0.044 mm)."
assumptions = [
  "Both bodies elastic half-spaces (E 210 GPa, nu 0.3), frictionless; the roller 100 mm in diameter and 30 mm long [length synthetic], the plate wider and deeper than the contact.",
  "The roller's end face is not modelled (the half-space continues past it): near the end the method overstates a sharp-edged peak somewhat; the crowned design's peak is at mid-length, where this does not apply.",
  "The profiles as the 3D FE model's (models/fea/roller_3d.drop_um): an edge radius of 1 mm, or a logarithmic crown of the Fujiwara-Kawase form, z_m 30 um, A a multiple of Lundberg's 2 Q / (pi l E').",
  "The load centred and the roller aligned: no tilt or misalignment.",
]
limitations = [
  "No misalignment: a tilted roller loads one end; a crown's margin against tilt is a separate check.",
  "Contact pressure only (study 10's REQ-C1); the subsurface shear is not computed here.",
  "Half-spaces: the roller's end face and the plate's finite size are left out.",
]

[parameters]
roller_radius_mm = 50.0
roller_length_mm = 30.0               # synthetic: study 10 gave only a line load ("a long roller")
youngs_modulus_MPa = 210000.0
poisson_ratio = 0.3
line_load_N_per_mm = 500.0            # study 10: 15 kN on the 30 mm roller
profile_code = 2                 # 0 square ends, 1 straight with an edge radius, 2 logarithmic crown
edge_radius_mm = 1.0
z_fine_mm = 0.0
crown_A_factor = 1.3                 # times Lundberg's A = 2 Q / (pi l E') = 1.379 um
crown_zm_um = 30.0
cap_um = 200.0
grid_scale = 1.5
pressure_limit_MPa = 650.0

[sweep]
parameter = "grid_scale"
values = [1.0, 1.5, 2.25]

[numerics]
solver = "NumPy / SciPy, Boussinesq influence coefficients, active-set contact"

[verification]
hertz_rel_tol = 3e-3     # the two Hertz references on each point's own grid (trials: under 1e-3 from 24 cells)
load_rel_tol = 1e-5      # the approach's secant stops at 1e-6
mesh_noise_rel = 1e-6
gci_max = 0.01

[[requirements]]
id = "REQ-C1-3D"
text = "The peak contact pressure anywhere along the roller, its ends included, shall not exceed 650 MPa (study 10's REQ on the peak pressure)."
metric = "peak_contact_pressure_MPa"
operator = "<="
limit = 650.0
units = "MPa"
