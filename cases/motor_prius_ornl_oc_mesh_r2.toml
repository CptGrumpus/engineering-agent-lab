# Study 7, open circuit, revision 2 of our machine: the pocket's extra thickness moved to the air-gap side. Same model,
# sweep, requirement and tolerances as motor_prius_ornl_oc_mesh_r1.toml; read it (and motor_prius_ornl_oc_mesh.toml)
# for the background.
#
# Why: r1 grew the pocket inward (HoleM50's H3 alone). Fig. 21 is stretched 1.1 % in x in the PDF (its rotor OD outline
# is an ellipse, x/y 1.0114); corrected, the drawing's inner edge matches Pyleecan's (inner apex 17.76 against 17.78 mm
# below the OD) and its outer apex is 10.65 mm deep against Pyleecan's 10.96. So: H0 10.65 mm, H3 6.80 mm, W0 41.21 mm
# (keeps the 17.4 deg arm angle). Bridge, magnet Br and recoil permeability as in r1. The machine file also no longer
# carries Pyleecan's absolute material paths (metadata only).
#
# Predictions, written BEFORE the run (no ORNL measured data opened):
#   P1 Every point check passes on every mesh.
#   P2 Back-EMF slightly above r1 (the magnet's outer face 0.3 mm nearer the gap, less flux lost to the rotor iron
#      above it): about +0.2 % (0 to +0.5 %) on r1's finest-mesh value.
#   P3 GCI under 1 %; REQ-M1 a verified fail near 1010 V.
# Its finest-mesh back-EMF becomes the blind prediction.
#
# Results (run 20261122-013743_motor_prius_ornl_oc_mesh_r2): verification FAIL on the REQ-M1 metric's GCI only.
# Laminations M400-50A (Pyleecan's inherited curve). Superseded as the blind prediction by r3 (M330-35A, the study's
# stand-in steel, decided 2026-11-22 ~00:40, after these predictions); r2 is the "inherited steel" side.
#   P1 HELD: 15/15 point checks; winding theory 0.32 %.
#   P2 MISSED (above the range): back-EMF 109.834 / 109.749 / 109.699 V per 1000 rpm at fineness 2 / 4 / 8, +1.09 % on
#      r1's finest (108.52 V) against +0.2 % (0 to +0.5 %). The estimate counted only the magnet face moving 0.3 mm
#      nearer the gap; the move also thins the iron above the magnet and reshapes the bridge ends (W0 42.0 -> 41.2 mm),
#      which it left out. Not separated here.
#   P3 PARTLY: flux-linkage GCI 0.079 % (extrapolated from 0.214092 / 0.213927 / 0.213830 Wb). The line-to-line peak at
#      6000 rpm is 1028.66 / 1028.91 / 1028.50 V: oscillatory within 0.04 %, so the GCI returns no estimate and REQ-M1 is
#      formally withheld on this run (r1 verified it). Verdict not in doubt: about twice the 500 V bus. Higher than the
#      predicted 1010 V, with the back-EMF.
#   Solve times 19 s / 71 s / 380 s.

[case]
name = "motor_prius_ornl_oc_mesh_r2"
model = "pyleecan_femm"
description = "2004 Toyota Prius traction motor rebuilt from ORNL/TM-2005/33 Fig. 21 (radii, air gap 0.775 mm, slot, pocket thickness and position), ORNL/TM-2004/120 (bridge) and ORNL/TM-2004/137 Fig. 14 (magnet B-H line) at open circuit, 1000 rpm; Pyleecan + FEMM 4.2 magnetostatics over one electrical period (48 steps), mesh fineness 2 / 4 / 8; back-EMF and the uncontrolled-generator voltage at top speed."
assumptions = [
  "2D magnetostatics (FEMM), no end effects: the stack (83.8 mm) is long against the air gap (0.775 mm), but end-winding leakage and axial fringing are not modelled.",
  "Stator, rotor, slot and pocket thickness from ORNL/TM-2005/33 Fig. 21; bridge 1.45 mm from ORNL/TM-2004/120; magnet Br 1.243 T and recoil permeability 1.129 from ORNL/TM-2004/137 Fig. 14 (temperature not stated, taken as 20 C); magnet width, laminations (M400-50A) and winding still Pyleecan's.",
  "Magnet temperature 20 C; Br falls about 0.1 %/K, so a hot motor has a lower back-EMF (stated, not modelled here).",
  "Maximum speed 6000 rpm, the commonly published rating for this motor; ORNL's design report tabulates ratings only up to base speed.",
]
limitations = [
  "No test data in this case: the ORNL comparison is a separate, blind step.",
  "The magnet fills the pocket thickness (HoleM50); TM-2004/120 gives a thinner magnet (5.31 mm), not modelled.",
  "Line-to-line peak from the phase flux linkages with their harmonics; the inverter's own clamping is not modelled.",
]

[parameters]
machine = "Toyota_Prius_ORNL.json"
speed_rpm = 1000.0
id_A = 0.0
iq_A = 0.0
mesh_fineness = 1.0
steps_per_period = 48
angle_points = 2048
max_speed_rpm = 6000.0
bus_voltage_V = 500.0
rated_torque_Nm = 400.0

[sweep]
parameter = "mesh_fineness"
values = [2.0, 4.0, 8.0]

[numerics]
solver_timeout_s = 3600

[verification]
phase_symmetry_rel_tol = 1e-3
phase_shift_deg_tol = 0.5
winding_theory_rel_tol = 0.02
open_circuit_torque_rel_tol = 1e-3
mesh_noise_rel = 1e-5
gci_max = 0.01

[[requirements]]
id = "REQ-M1"
text = "With the inverter not switching (a fault at top speed), the line-to-line back-EMF peak at 6000 rpm shall not exceed the 500 V maximum bus voltage."
metric = "back_emf_LL_peak_at_max_speed_V"
operator = "<="
limit = 500.0
units = "V"
