# Turek-Hron FSI3, time-step level b (dt 0.0005 s), damped solid (study 6): turek_hron_fsi3_mesh_b (read it; the same
# 2.5 mm fluid mesh and dt, run 20261123-161107) rerun with ONE change, solid_alpha = -0.05 (HHT, CalculiX's default)
# in place of 0. At 5.46 Hz and dt 0.0005 s the damping of the flag's motion is about 0.04 % of critical; it damps the
# stiff high-frequency modes.
#
# Why: the FSI3 time-step study is dt_a at alpha -0.05 (turek_hron_fsi3_dt_a_alpha, record to 7.999 s), level b at
# alpha 0 (turek_hron_fsi3_mesh_b) and dt_c at alpha -0.05 (turek_hron_fsi3_dt_c_alpha, running). The damping test
# put the alpha effect under 0.06 % on every metric, so the mix would have been stated, not hidden; this run removes
# it, so all three time steps share one solid setup. User's decision 2026-11-26 about 07:33 ("Queue it"): rerun level
# b at alpha -0.05, predictions first, start once FSI2 levels a and b have finished (at most four coupled runs on the
# 24 cores).
#
# Predictions, written BEFORE the run (2026-11-26 07:34):
#   P1 The run reaches 8 s and both participants exit 0 (participants_exit.txt); every point check passes.
#   P2 No creep: the solid's Newton count is 2 in every attempt (flag.sta; so far in every alpha -0.05 run).
#   P3 The run repeats its alpha-0 record (turek_hron_fsi3_mesh_b scored to 7.999 s by scripts/score_truncated_fsi.py:
#      uy amplitude 33.910 mm, frequency 5.4640 Hz, ux mean -2.7006 mm, drag mean 469.85 N/m, drag amplitude
#      25.273 N/m, lift amplitude 153.44 N/m) within 0.1 % on each (the damping test at twice this dt: at most 0.06 %).
#   P4 The three-level time-step check (dt_a_alpha / this run / dt_c_alpha, each cut at 7.999 s by
#      scripts/score_truncated_fsi.py --parameter time_step_s) classifies every quantity as the same check does with
#      the alpha-0 level b in this run's place, and each uncertainty (GCI) differs by under 0.2 percentage points.
#   P5 5.5-8 h, starting beside FSI2 level c (to about 10:30) and FSI3 dt_c (to about 14:30).
#
# Results (run 20261126-083740_turek_hron_fsi3_dt_b_alpha, 08:37-15:13, scored 2026-11-26 15:20). VERIFICATION
# PASS, 7/7 checks (flag cells 123 deg, periodic 7.6e-6, force transfer 3.0e-9), every requirement PASS: over the last
# periods to 8 s uy amplitude 33.910 mm (3.09 %), frequency 5.4640 Hz (0.074 %), drag mean 469.85 N/m (2.03 %), drag
# amplitude 25.273 (8.89 %), lift amplitude 153.41 (0.32 %), ux mean -2.7007 mm (6.23 %).
#   P1 HELD: 8 s reached, both participants ended normally (CalculiX "Job finished", OpenFOAM "End"), every point
#      check passes.
#   P2 HELD: 2 Newton iterations in all 106,495 solid attempts (solid_newton_counts.json).
#   P3 HELD: against the alpha-0 record to 7.999 s (b_alpha_t7999.json, same cut): uy amplitude -0.001 %, frequency
#      -0.0001 %, ux mean +0.004 % (larger in magnitude), drag mean +0.0005 %, drag amplitude -0.001 %, lift amplitude
#      -0.016 % (limit 0.1 %). Not in the prediction: the small lift mean (9.93 -> 9.92 N/m) moved 0.13 %. The last
#      whole periods end at 7.908 s, so the full 8 s record and the 7.999 s cut give the same numbers.
#   P4 HELD (scored 18:33 once dt_c_alpha finished): the three-level check with this run (all alpha -0.05) and with the
#      alpha-0 level b in its place classify every quantity the same way (all six monotone; drag amplitude FAILS the
#      1 % limit in both, 1.387 / 1.385 %; the other five PASS). Uncertainty differences: lift amplitude +0.020
#      percentage points (0.471 / 0.451 %), ux mean -0.010, uy amplitude +0.002, drag amplitude +0.002, drag mean
#      -0.001, frequency 0.000 (limit 0.2). p4_alpha_vs_mixed_t7999.json in the run: score_truncated_fsi.py's score()
#      and the study's verify_run_level on both sets (the script itself refuses runs whose [numerics] differ).
#   P5 HELD: 6 h 36 min (predicted 5.5-8 h).

[case]
name = "turek_hron_fsi3_dt_b_alpha"
model = "openfoam_ccx_precice_fsi"
description = "Turek-Hron FSI3: self-excited periodic oscillation of the elastic flag behind the cylinder (Re 200, density ratio 1); OpenFOAM v2512 (moving mesh) coupled to CalculiX through preCICE; fluid 2.5 mm at the body (time-step study level b, dt 0.0005 s), solid 2.5 mm, dt 0.0005 s to 8 s; mean, amplitude and frequency of the tip displacements, drag and lift over the last periods against the published benchmark."
assumptions = [
  "2D: one cell deep in the fluid, plane strain in the solid (one element layer, as deep as the fluid).",
  "St. Venant-Kirchhoff solid (CalculiX *ELASTIC under NLGEOM), no gravity, as the FSI tests define it.",
  "A little numerical damping in the solid: HHT alpha -0.05 (CalculiX's default), which damps the stiff high-frequency modes and leaves the 5.46 Hz motion practically undamped (well under 0.1 % of critical).",
  "Inflow: the benchmark's parabola with its (1 - cos) ramp over 2 s.",
  "Statistics from the last whole periods (benchmark definition); the oscillation is periodic (checked: last two periods).",
]
limitations = [
  "One level of a three-level mesh study run as separate cases side by side (scripts/combine_mesh_levels.py applies the study's run-level check to the three runs).",
  "The fluid mesh is regenerated per size (FSI1: about +-0.5 % mesh-to-mesh scatter on the tip displacement).",
]

[parameters]
solid_density_kg_per_m3 = 1000.0
shear_modulus_Pa = 2000000.0
poisson_ratio = 0.4
fluid_density_kg_per_m3 = 1000.0
kinematic_viscosity_m2_per_s = 0.001
mean_velocity_m_per_s = 2.0
fluid_cell_size_m = 0.0025
solid_element_size_mm = 2.5
time_step_s = 0.0005
end_time_s = 8.0
# steady-case benchmark keys (required by the study; unused in periodic mode): the periodic means
benchmark_ux_A_m = -2.88e-3
benchmark_uy_A_m = 1.47e-3
benchmark_drag_N_per_m = 460.5
benchmark_lift_N_per_m = 2.50
benchmark_ux_A_mean = -2.88e-3
benchmark_ux_A_amp = 2.72e-3
benchmark_ux_A_freq_Hz = 10.93
benchmark_uy_A_mean = 1.47e-3
benchmark_uy_A_amp = 3.499e-2
benchmark_uy_A_freq_Hz = 5.46
benchmark_drag_mean = 460.5
benchmark_drag_amp = 27.74
benchmark_drag_freq_Hz = 10.93
benchmark_lift_mean = 2.50
benchmark_lift_amp = 153.91
benchmark_lift_freq_Hz = 5.46

[numerics]
periodic_periods = 4
solid_alpha = -0.05
write_interval_s = 1.0
ramp_time_s = 2.0
coupling_rel_tol = 1e-5
coupling_max_iterations = 100
rbf_support_radius_m = 0.05
solver_timeout_s = 43200

[verification]
periodic_rel_tol = 0.02           # last two periods: uy amplitude and drag mean agree within 2 % (a settled cycle)
force_transfer_rel_tol = 1e-3     # window by window (preCICE watch-integrals, fixed in FSI1 r2): no inertia involved
flag_cell_max_angle_deg = 140.0   # the corner-wrap check from FSI1's noise study
profile_rel_tol = 1e-6
gci_max = 0.01

[[requirements]]
id = "REQ-FSI3-1"
text = "The coupled model shall reproduce the FSI3 amplitude of the tip's vertical displacement within 5 %."
metric = "uy_A_amp_deviation_pct"
operator = "<="
limit = 5.0
units = "%"

[[requirements]]
id = "REQ-FSI3-2"
text = "It shall reproduce the FSI3 oscillation frequency (uy of point A) within 3 %."
metric = "uy_A_freq_Hz_deviation_pct"
operator = "<="
limit = 3.0
units = "%"

[[requirements]]
id = "REQ-FSI3-3"
text = "It shall reproduce the FSI3 mean drag within 5 %."
metric = "drag_mean_deviation_pct"
operator = "<="
limit = 5.0
units = "%"

[[requirements]]
id = "REQ-FSI3-4"
text = "It shall reproduce the FSI3 drag amplitude within 25 % (the benchmark's own tables spread about 40 %)."
metric = "drag_amp_deviation_pct"
operator = "<="
limit = 25.0
units = "%"

[[requirements]]
id = "REQ-FSI3-5"
text = "It shall reproduce the FSI3 lift amplitude within 10 %."
metric = "lift_amp_deviation_pct"
operator = "<="
limit = 10.0
units = "%"

[[requirements]]
id = "REQ-FSI3-6"
text = "It shall reproduce the FSI3 mean horizontal tip displacement within 15 % (second order; the benchmark spreads 12 %)."
metric = "ux_A_mean_deviation_pct"
operator = "<="
limit = 15.0
units = "%"
