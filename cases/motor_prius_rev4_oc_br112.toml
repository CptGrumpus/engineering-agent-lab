# Study 7, revision 4, second remanence source (user's decision 2026-11-23 12:04, "Run 1.12 T too"): as
# motor_prius_rev4_oc but with the design report's remanence, 1.12 T (ORNL/TM-2004/120 Table 5.4), instead of the
# measured sample curve's 1.243 T. Machines: build_prius_ornl.py --br 1.12 --design-magnet {outer,centre,inner} (the
# --br option's change-table label calls the value a post-test calibration; here it is the design report's value).
#
# Prediction (CALIBRATION_PLAN.md, addendum P5, committed f86277d BEFORE the 1.243 T result was read): back-EMF at
# 1.12 T = 0.88-0.89 x the 1.243 T value placement by placement. Read since (run 20261123-110021): 85.31 / 82.37 /
# 79.26 V at 1.243 T, so P5 says 75.1-75.9 / 72.5-73.3 / 69.7-70.5 V. Every point check passes; about 55 min.
#
# Results (run 20261123-120639_motor_prius_rev4_oc_br112, 12:06-13:15): VERIFICATION PASS, 15/15 checks (5 per point).
#   Back-EMF fundamental, V rms line-to-line per 1000 rpm: outer 75.17, centre 72.58, inner 69.81.
#   Ratio to the 1.243 T run: 0.8811 / 0.8811 / 0.8808. Against ORNL's routine test (about 89.38 as a fundamental):
#   outer -15.9 %, centre -18.8 %, inner -21.9 % (at 1.243 T: -4.6 / -7.8 / -11.3 %).
#   P5 HELD on every placement (inside each band, at its low end) and inside 66-85 V. Time MISSED: 69 min, not about
#      55 (the third solve took 32 min against 18: the machine was loaded with five other jobs).
#   Peak at 6000 rpm: 726.3 / 700.8 / 672.1 V (REQ-M1 FAIL on every placement; ORNL measured 850).
#   Reading: 1.12 T with the drawn magnet misses ORNL's cold back-EMF by 16-22 %, so the pair (1.12 T, drawn magnet) is
#   ruled out for the test condition; 1.243 T with the drawn magnet stays the primary model. Source check after the
#   run (CALIBRATION_PLAN.md, "Result of P5"): TM-2004/120 labels the value "BrT" while its own SPEED parameter list
#   (Appendix D, Table D.2) defines Br as the remanence at 20 C, and 1.243 T at the report's -0.1 %/C is 1.12 T at
#   about 119 C: most likely a hot design value, not a compensation for the filled pocket.
#   Documentation errors in this file, left as run (the run's input copy is hashed): the second assumption and the
#   magnet-temperature assumption still say 1.243 T at 20 C (this case uses 1.12 T); the second limitation (magnet fills
#   the pocket) is stale since revision 4, here and in motor_prius_rev4_oc.toml.

[case]
name = "motor_prius_rev4_oc_br112"
model = "pyleecan_femm"
description = "2004 Toyota Prius traction motor rebuilt from ORNL/TM-2005/33 Fig. 21 (radii, air gap 0.775 mm, slot, pocket thickness and position), ORNL/TM-2004/120 (bridge) and ORNL/TM-2004/137 Fig. 14 (magnet B-H line), laminations M330-35A (stand-in grade), at open circuit, 1000 rpm; Pyleecan + FEMM 4.2 magnetostatics over one electrical period (48 steps), mesh fineness 8; REVISION 4: the design magnet (TM-2004/120: 19.24 x 5.31 mm) in the drawn 6.80 mm pocket, remanence 1.12 T (the design report's value, TM-2004/120 Table 5.4), placed outer / centre / inner; no calibration; back-EMF and the uncontrolled-generator voltage at top speed."
assumptions = [
  "2D magnetostatics (FEMM), no end effects: the stack (83.8 mm) is long against the air gap (0.775 mm), but end-winding leakage and axial fringing are not modelled.",
  "Stator, rotor, slot and pocket thickness from ORNL/TM-2005/33 Fig. 21; bridge 1.45 mm from ORNL/TM-2004/120; magnet Br 1.243 T and recoil permeability 1.129 from ORNL/TM-2004/137 Fig. 14 (temperature not stated, taken as 20 C); magnet width and winding still Pyleecan's.",
  "Laminations M330-35A, a stand-in: ORNL gives the thickness (0.36 mm) but not the grade. B-H curve from Tata Steel's typical data (50 Hz) up to 1.8 T, extrapolated above (saturation polarization 2.0 T).",
  "Magnet temperature 20 C; Br falls about 0.1 %/K, so a hot motor has a lower back-EMF (stated, not modelled here).",
  "Maximum speed 6000 rpm, the commonly published rating for this motor; ORNL's design report tabulates ratings only up to base speed.",
]
limitations = [
  "No test data in this case: the ORNL comparison is a separate, blind step.",
  "The magnet fills the pocket thickness (HoleM50); TM-2004/120 gives a thinner magnet (5.31 mm), not modelled.",
  "Line-to-line peak from the phase flux linkages with their harmonics; the inverter's own clamping is not modelled.",
  "The real lamination grade is unknown; the bracketing grades (M250-35A, a high-strength rotor grade) are separate cases.",
]

[parameters]
machine = "Toyota_Prius_ORNL.json"
speed_rpm = 1000.0
id_A = 0.0
iq_A = 0.0
mesh_fineness = 8.0
steps_per_period = 48
angle_points = 2048
max_speed_rpm = 6000.0
bus_voltage_V = 500.0
rated_torque_Nm = 400.0

[[sweep.scenarios]]
name = "outer"
machine = "Toyota_Prius_ORNL_Br1p1200_mag531outer.json"

[[sweep.scenarios]]
name = "centre"
machine = "Toyota_Prius_ORNL_Br1p1200_mag531centre.json"

[[sweep.scenarios]]
name = "inner"
machine = "Toyota_Prius_ORNL_Br1p1200_mag531inner.json"

[numerics]
solver_timeout_s = 3600

[verification]
phase_symmetry_rel_tol = 1e-3
phase_shift_deg_tol = 0.5
winding_theory_rel_tol = 0.02
open_circuit_torque_rel_tol = 1e-3
mesh_noise_rel = 1e-5
gci_max = 0.01

[[requirements]]
id = "REQ-M1"
text = "With the inverter not switching (a fault at top speed), the line-to-line back-EMF peak at 6000 rpm shall not exceed the 500 V maximum bus voltage."
metric = "back_emf_LL_peak_at_max_speed_V"
operator = "<="
limit = 500.0
units = "V"
