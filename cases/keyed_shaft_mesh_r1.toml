# Study 26 part 2, r1 (the keyed gear seat; problem, model and assumptions in cases/keyed_shaft_mesh.toml). The first
# runs (20261126-232303 mesh, 20261126-234913 check, 20261127-000418 design) showed four faults, fixed in r1:
#   (1) the near box could not see the shoulder fillet's peaks (bending about 27 deg from the keyway, on its cut face;
#       torsion on the far side of the shaft): two fillet submodels now cover the whole half ring, one quarter ring
#       each (keyless: the same 8 mm sector as before, the shaft being axisymmetric);
#   (2) peaks were read on driven faces: no peak is now read within 1 mm of one (numerics.driven_skip_mm);
#   (3) the global keyway size (0.3 mm) inverted elements at a 0.25 mm corner: now at most 0.75 r_k (0.4 mm corner:
#       unchanged);
#   (4) Le and Le's bending factor may be the axial stress: kt_key_bending_far_axial reports it beside the principal.
# Mesh-only smoke of the fillet box (00:45-01:00): the whole half ring as one box is 327 k nodes at scale 0.8 and 566
#   k at 0.64 (d36), past what SPOOLES solves; as two quarter rings 281-289 k each at 0.64 (d36) and 195-200 k at 0.8
#   (d40). The rk 0.25 global mesh at 0.1875 mm: no inverted element (minimum scaled Jacobian 0.24).
#
# This case: keyed_shaft_mesh repeated with the r1 model, submodel sizes x 1.0 / 0.8 / 0.64 (keyway corner elements
# r_k / 3 x scale, fillet 0.2 mm x scale; the finest fillet boxes are 281-289 k nodes each). The global model does not
# scale, so all three levels share the base global mesh of keyed_shaft_noise (sound: minimum scaled Jacobian 0.43).
# Noise floors declared from keyed_shaft_noise (run 20261127-010741): keyway Kt 1.76 % (bending) and 0.23 % (torsion),
# fillet Kt 0.46 % (bending), fatigue safety 1.23 %, static safety 0.73 %.
#
# Predictions, written BEFORE the run (2026-11-27 01:54):
#   P1 The keyway's values repeat run 20261126-232303 to four digits (the key boxes, their meshes and the global mesh
#      are unchanged; the governing peaks are more than 1 mm inside): 3.203 / 3.184 / 3.170 (bending), 2.776 /
#      2.761 / 2.763 (torsion); fatigue safety 1.174 / 1.180 / 1.184, static 1.713 / 1.722 / 1.724: REQ-S1 and
#      REQ-S2 FAIL at the keyway.
#   P2 Fillet Kt from the half-ring boxes 2.10-2.13 (bending) and 1.69-1.71 (torsion) at every level; fillet fatigue
#      and static safety 1.64-1.67 and 2.47-2.50 (not governing).
#   P3 Run-level: keyway bending spread 1.04 % under its 1.76 % floor ("converged", uncertainty 0.65 %); torsion
#      oscillatory, 0.34 %; fatigue 0.53 %, static 0.40 % (both under their floors); fillet bending under 0.5 %:
#      every discretization check passes the 1 % target.
#   P4 Every point check passes; 60-100 min.
#
# Results (run 20261127-031958_keyed_shaft_mesh_r1, 03:19-03:58, scored 2026-11-27 03:58). VERIFICATION PASS.
#   P1 held: keyway Kt 3.203 / 3.184 / 3.170 (bending) and 2.776 / 2.761 / 2.763 (torsion); fatigue safety 1.174 /
#      1.180 / 1.184, static 1.713 / 1.722 / 1.724, all as run 20261126-232303 to four digits: REQ-S1 and REQ-S2 FAIL
#      at the keyway.
#   P2 held: fillet Kt 2.114 / 2.118 / 2.110 (bending) and 1.705 / 1.702 / 1.702 (torsion); fillet fatigue safety
#      1.651 / 1.650 / 1.655, static 2.481 / 2.483 / 2.486.
#   P3 held: keyway bending spread 1.02 % under its 1.76 % floor, "converged", uncertainty 0.64 %; torsion
#      oscillatory, 0.34 %; fatigue safety 0.50 % and static 0.40 % (converged, under their floors); fillet bending
#      0.24 %. Every discretization check passes the 1 % target.
#   P4 half held: every point check passes (global against fillet submodel within 0.03-0.53 %); 39 min, not 60-100.
# Finding: with the floors measured first, the same three keyway levels that r0 called "1.41 %, FAIL" and "anomalous
#   order" read as converged within 0.64 %. The numbers did not change; the noise they are judged against was known.

[case]
name = "keyed_shaft_mesh_r1"
model = "ccx_keyed_shaft"
description = "Keyed gear seat (study 26 part 2, r1): the mesh study with the half-ring fillet submodels; submodel mesh scale 1.0 / 0.8 / 0.64 against the measured noise floors."
assumptions = [
  "Linear elastic, small strain; Kt from gross nominal stresses at the small diameter; the fatigue and overload checks of part 1 (Shigley: Marin factors, Neuber notch sensitivity with each feature's own radius, von Mises combination, modified Goodman; Kf applied to the overload).",
  "Rotating bending 300 N m (fully reversed) and steady torque 500 N m act at the keyway as at the fillet (the keyway's end is 2 mm from the fillet; conservative).",
  "The key's bearing pressure on the keyway wall and any press fit of the gear are not modelled (Shigley's practice for keyseat factors).",
  "DIN 6885 form A keyway dimensions from published reproductions of the table (the current DIN 6885-1:2021 was not read); corner radius 0.25-0.40 mm.",
]
limitations = [
  "Submodels driven by a coarse global model; their boxes keep 3 mm (or more) of material between the keyway's corners and the cut faces.",
  "Stress at nodes (CalculiX's extrapolation, averaged), as part 1.",
]

[parameters]
D_mm = 45.0
d_mm = 36.0
fillet_radius_mm = 1.6
small_length_mm = 90.0
large_length_mm = 60.0
bending_moment_Nm = 300.0
torque_Nm = 500.0
youngs_modulus_MPa = 210000.0
poisson_ratio = 0.3
ultimate_MPa = 1000.0
yield_MPa = 750.0
overload_factor = 1.5
key_width_mm = 10.0
key_depth_mm = 5.0
key_corner_radius_mm = 0.4
key_gap_mm = 2.0
key_length_mm = 40.0
global_key_size_mm = 0.3
global_fillet_size_mm = 0.5
far_size_mm = 4.0
sub_key_size_rel = 0.333
sub_fillet_size_mm = 0.2
mesh_scale = 0.8
box_margin_mm = 3.0
sub_far_size_mm = 1.5
kt_reference_bending = 0.0
kt_reference_torsion = 0.0
kt_key_reference_bending = 0.0
kt_key_reference_torsion = 0.0

[sweep]
parameter = "mesh_scale"
values = [1.0, 0.8, 0.64]

[numerics]
parallel_solves = 6
solve_timeout_s = 7200
solver_timeout_s = 43200
driven_skip_mm = 1.0

[verification]
equilibrium_rel_tol = 1e-6
load_rel_tol = 1e-4          # 7-point rule on curved end faces: 8e-6 measured
global_sub_rel_tol = 0.02    # fillet Kt, global model against its submodel (smoke: 0.2 % bending, 1.5 % torsion)
reference_rel_tol = 0.01     # keyless fillet Kt against part 1's verified value
key_reference_rel_tol = 0.05 # Le and Le's keyseat factors (their own FE, p-adaptive to 2 % in strain energy)
min_scaled_jacobian = 0.1
gci_max = 0.01
# measured by keyed_shaft_noise (run 20261127-010741): relative spread over five meshes at scale 0.8
mesh_noise_rel = { kt_key_bending = 0.0176, kt_key_torsion = 0.0023, kt_fillet_bending = 0.0046, fatigue_safety = 0.0123, static_safety = 0.0073 }

[[requirements]]
id = "REQ-S1"
text = "The fatigue safety factor (modified Goodman, Shigley's method) shall be at least 1.5 at the shoulder fillet and at the keyway."
metric = "fatigue_safety"
operator = ">="
limit = 1.5
units = ""

[[requirements]]
id = "REQ-S2"
text = "The first-cycle yield safety factor at a 1.5 x overload shall be at least 2.0 at the shoulder fillet and at the keyway."
metric = "static_safety"
operator = ">="
limit = 2.0
units = ""
