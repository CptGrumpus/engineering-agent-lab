# Heated coolant channel: mesh study revision 2 (40 / 80 / 160 cells across the gap). Same model,
# question, requirements and tolerances as heated_channel_mesh_r1.toml; read it (and heated_channel_mesh.toml)
# for the background, the predictions P1-P4 and the partial results.
#
# Why: r1's 160-cell point hit the backend's fixed 2-hour solver timeout at flow iteration 960 of 2000.
# Changes, decided before this run:
# - The solver timeout is now a case setting (numerics solver_timeout_s, 8 h here; default unchanged).
# - flow_iterations 2000 -> 1200: the r1 160-cell flow was at Ux 2.2e-8 and p 1.3e-10 by iteration 940,
#   far inside flow_converged's 1e-6, and the 80-cell flow reached 1e-12 by about 700. The flow_converged
#   check still has to pass at every level.
#
# Predictions P1-P4 of r1 stand. Revised P5: about 1200 x 4-7 s = 1.5-2.5 h for the 160-cell flow,
# depending on what else shares the CPU, plus about 10 min for the temperature stage.

[case]
name = "heated_channel_mesh_r2"
model = "openfoam_heated_channel"
description = "2D laminar water channel (1 mm gap, 0.1 m/s) with both walls heated at 30 kW/m2 over 50 mm; OpenFOAM incompressibleFluid + scalarTransport; cells across the gap 40 / 80 / 160, verified against the Graetz thermal-entry solution."
assumptions = [
  "Constant water properties at 25 C (temperature rise under 20 K), so temperature is a passive scalar.",
  "Hydrodynamically developed inflow: parabolic profile at an exact flow rate, 5 mm unheated entry.",
  "Uniform heat flux into the water on both walls; the plate's conduction is not modelled (no conjugate heat transfer).",
  "2D: the passage is much wider than the gap (side walls neglected; the 3D duct study shows a 3 % effect on flow).",
]
limitations = [
  "Synthetic geometry and loads; not calibrated to a product.",
  "No conjugate conduction in the plate, so real wall temperatures would be smoothed along the length.",
  "Checks establish numerical verification against the Graetz solution and the energy balance only; no test data.",
]

[parameters]
gap_mm = 1.0
heated_length_mm = 50.0
entry_length_mm = 5.0
exit_length_mm = 5.0
mean_velocity_m_per_s = 0.1
density_kg_per_m3 = 997.0
dynamic_viscosity_Pa_s = 0.00089
specific_heat_J_per_kgK = 4180.0
conductivity_W_per_mK = 0.607
inlet_temperature_C = 25.0
wall_heat_flux_W_per_m2 = 30000.0
cells_across_gap = 40
cell_aspect_ratio = 5.0

[sweep]
parameter = "cells_across_gap"
values = [40, 80, 160]

[numerics]
flow_iterations = 1200
solver_timeout_s = 28800
temperature_iterations = 1500
write_interval = 100
relaxation_T = 1.0

[verification]
temperature_change_rel_max = 1e-5
flow_residual_max = 1e-6
flow_rel_tol = 1e-6
profile_rel_tol = 0.01
energy_rel_tol = 1e-6
wall_rel_tol = 0.01
peak_rel_tol = 0.01
gci_max = 0.01

[[requirements]]
id = "REQ-T1"
text = "Peak wall temperature over the heated length shall not exceed 45 C."
metric = "max_wall_temperature_C"
operator = "<="
limit = 45.0
units = "C"

[[requirements]]
id = "REQ-T2"
text = "Coolant temperature rise from inlet to outlet shall not exceed 10 K."
metric = "outlet_bulk_rise_K"
operator = "<="
limit = 10.0
units = "K"
