# Study 7, revision 5 (client data): the efficiency map from the four revision-5 dq tables
# (motor_prius_lut_{cold,cold_lowiq,hot,hot_lowiq}_rev5), with the client's measured phase resistance, 69 mOhm at 21 C
# (ORNL/TM-2010/253 Table 2.7; 68.7 mOhm at 20 C, 15 % above the geometric 59.6). Read motor_prius_efficiency_r1.toml
# for the model, the merged tables and the checks. References on the tables' own mesh and temperature:
# back-EMF 105.84 V (motor_prius_rev5_oc_f2, run 20261123-223450), MTPA 247.68 / 449.11 N m at 100 / 200 A rms
# (motor_prius_rev5_torque_ref, run 20261123-223541, fineness 4). The four lut_run names are filled in when the
# tables finish (written PENDING now): a mechanical edit, nothing else changes. Scored against ORNL's efficiency
# (TM-2006/423 Table B-1) separately, once, after this run.
#
# Predictions (written BEFORE the tables finish, 2026-11-23 23:07):
#   P1 Every check passes in the cold scenario (back-EMF and MTPA now referenced on the same mesh and temperature);
#      the hot scenario may fail its half-table map check on the 10 N m row above 4000 rpm (as r1 and the calibrated
#      map: field-weakening branch switching at iq 2-4 A).
#   P2 Against the blind map (r1, 1.243 T on the blind geometry, geometric resistance): lower at high torque below base
#      speed, by 0.3-1 point at 300-400 N m (15 % more copper loss); about the same or up to 0.3 point higher at
#      light load above 3000 rpm (back-EMF 4.6 % lower: less iron loss). Peak efficiency within 0.5 point of r1's.
#   P3 Against ORNL (scored separately): median hot-minus-ORNL gap 4.3-5.0 points (blind 5.2, calibrated 4.5): still
#      above the 2-point limit; the gap is the losses the model leaves out, not the flux.
#   P4 REQ-M2 PASS (400 N m needs about 175 A, under 212); REQ-M5 PASS cold (55-58 kW minimum over the speed range;
#      blind 58.6), hot 49-54 kW, near the 50 kW limit (blind 53.7).
#   P5 Seconds per scenario.
#
# Results (run 20261124-062847_motor_prius_efficiency_rev5, 2 s; lut_run names filled in 06:28): verification FAIL,
# on the hot scenario's half-table map check only (2.32 points against 2, at 4000 rpm / 10 N m; median 0.02 points,
# at most 0.20 above 60 N m); cold 8/8 PASS (half-table check 0.84 points). REQ-M5 PASS both (cold 55.85 kW, hot
# 51.65 kW, the hot verdict unverified on that check). Peak efficiency 97.22 % cold (2500 rpm, 70 N m), 96.87 % hot.
#   P1 HELD (the failure is the light-load row above 4000 rpm, as written).
#   P2 MISSED in part. Peak within 0.5 point of r1: HELD (-0.19 / -0.18). Lower at high torque below base speed:
#      right way, larger than written: 1000 rpm / 300 N m -1.32 cold, -1.71 hot (written 0.3-1). Light load above
#      3000 rpm "about the same or up to 0.3 higher": MISSED, -0.04 to -0.40 lower (cold), except hot 6000 rpm /
#      30 N m +1.63. Why (loss split, efficiency_map.csv): copper loss +19-25 % everywhere (resistance +15 %, current
#      +2-4 % from the lower torque per ampere), iron loss within -0.1 to -1 %: in field weakening the voltage limit,
#      not the magnets, sets the stator flux, so the 4.6 % lower back-EMF does not cut iron loss as written. At hot
#      6000 rpm / 30 N m the blind map needed 52.6 A against 43.0 (its stronger magnets need more d current).
#   P3 HELD: median hot-minus-ORNL 4.37 points (p10-p90 2.78-7.11; blind 5.21, calibrated 4.50; 8 of 393 points
#      within 2 points of the cold-hot band), still above the 2-point limit (scripts/motor_rev5_vs_ornl.py ->
#      validation/motor_ornl/rev5_efficiency_vs_ornl.json).
#   P4 HELD: 400 N m needs 171.0 A rms cold, 177.3 hot (MTPA on the merged tables; limit 212): REQ-M2 PASS; REQ-M5
#      cold 55.85 kW in 55-58, hot 51.65 in 49-54.
#   P5 HELD (2 s for both).

[case]
name = "motor_prius_efficiency_rev5"
model = "lut_efficiency"
description = "2004 Toyota Prius traction motor, REVISION 5 (client data: magnet 83.1 x 18.9 x 6.5 mm, 1.255 T at 20 C, air gap 0.775 mm; measured phase resistance 69 mOhm at 21 C), motor-only efficiency map from the verified dq look-up tables (25 A tables merged with low-q-current tables at 6.25 A): 500-6000 rpm, 10-400 N m, least copper + iron loss under the 500 V bus voltage limit and the current limit; cold (all 20 C) and hot (windings 100 C, magnets 80 C) scenarios."
assumptions = [
  "Motor-only efficiency: copper (DC resistance, end connections included) and iron loss; no mechanical, magnet eddy-current, AC copper or inverter loss (user's framing, 2026-11-22).",
  "Voltage limit Vdc / sqrt 6 phase rms (linear modulation of a 500 V bus); the resistive drop is included, inductive coupling to the inverter is not.",
  "Current limit 212 A rms for the design (25 A/mm^2 on 76.4 mm^2 of bare copper per slot, a stated assumption) and 300 A for the map's edge.",
  "Iron loss from the table's coefficients, P = A f + B f^2 + C f^1.5 with f the electrical frequency, at each grid point.",
  "Phase resistance: the client's measured 69 mOhm at 21 C (ORNL/TM-2010/253 Table 2.7), referred to temperature with alpha 0.00393 /K [client: routine test]; the geometric parameters stay in the case for reference only.",
]
limitations = [
  "Revision 5 carries about 18 % more magnet flux than ORNL's back-EMF test shows (unexplained; CALIBRATION_PLAN step 4); not calibrated. ORNL's efficiency is not used here and is scored separately.",
  "The tables are 2D magnetostatic at 1000 rpm; the iron loss is scaled to speed by the fitted coefficients, not recomputed per speed.",
  "Steady thermal corners only (cold and hot); no thermal model links temperature to the operating point yet.",
]

[parameters]
lut_run = "20261123-230647_motor_prius_lut_cold_rev5,20261124-004731_motor_prius_lut_cold_lowiq_rev5"
magnet_temperature_C = 20.0
winding_temperature_C = 20.0
series_turns_per_phase = 72
turn_copper_area_mm2 = 8.492
stack_length_m = 0.08382
end_connection_length_m = 0.1206
copper_resistivity_20C_ohm_m = 1.72e-8
copper_alpha_per_K = 0.00393
phase_resistance_measured_ohm = 0.069
phase_resistance_measured_at_C = 21.0
bus_voltage_V = 500.0
current_limit_design_A = 212.0
current_limit_map_A = 300.0
speed_min_rpm = 500.0
speed_max_rpm = 6000.0
speed_step_rpm = 250.0
torque_min_Nm = 10.0
torque_max_Nm = 400.0
torque_step_Nm = 10.0
rated_power_kW = 50.0
rated_torque_Nm = 400.0
ref_back_emf_V = 105.84
ref_mtpa_100A_Nm = 247.68
ref_mtpa_200A_Nm = 449.11

[[sweep.scenarios]]
name = "cold"
lut_run = "20261123-230647_motor_prius_lut_cold_rev5,20261124-004731_motor_prius_lut_cold_lowiq_rev5"
magnet_temperature_C = 20.0
winding_temperature_C = 20.0
ref_back_emf_V = 105.84
ref_mtpa_100A_Nm = 247.68
ref_mtpa_200A_Nm = 449.11

[[sweep.scenarios]]
name = "hot"
lut_run = "20261124-014553_motor_prius_lut_hot_rev5,20261124-031723_motor_prius_lut_hot_lowiq_rev5"
magnet_temperature_C = 80.0
winding_temperature_C = 100.0
ref_back_emf_V = 0.0
ref_mtpa_100A_Nm = 0.0
ref_mtpa_200A_Nm = 0.0

[numerics]
fine_step_A = 1.0
halfgrid_map_check = true

[verification]
back_emf_rel_tol = 0.001
mtpa_rel_tol = 0.01
interp_halfgrid_rel_tol = 0.05
merge_rel_tol = 1e-4
interp_map_max_pts = 2.0

[[requirements]]
id = "REQ-M5"
text = "The motor shall deliver its rated 50 kW from the rated base speed (50 kW at 400 N m: 1194 rpm) to 6000 rpm within the 500 V bus voltage limit and the 212 A rms design current limit."
metric = "min_power_rated_speed_range_kW"
operator = ">="
limit = 50.0
units = "kW"
