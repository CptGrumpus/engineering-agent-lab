# Steel frame study: a synthetic client's equipment-platform frame to AISC 360-22 (LRFD), Direct Analysis Method.
# Framing approved by the user 2026-11-24 (after 17:04, as drafted; BACKLOG): single-bay portal, fixed bases, rigid
# knees; columns W10x33, 4.0 m; beam W14x30, 6.0 m span; ASTM A992 (Fy 345 MPa, E 200,000 MPa). The client's factored
# loads (no ASCE 7): beam UDL 35 kN/m, lateral 15 kN at beam level; service live 12 kN/m, service lateral 10 kN.
# The verified Python plane-frame solver carries the verdicts (the user's decision, 2026-11-24 18:52); the CalculiX
# frame model (models/fea/frame_ccx.py) stays a documented cross-check.
#
# Two framing gaps, filled conservatively here and listed as questions for the client: (1) the beam's lateral bracing
# is not specified: taken as unbraced over the full 6.0 m span (top flange not credited to the platform deck), with
# Cb from the beam's own moment diagram; (2) the columns' out-of-plane bracing: braced at the base and at the beam
# only (weak-axis and lateral-torsional unbraced length 4.0 m). A sensitivity case on (1) is
# steel_frame_beam_bracing.toml.
#
# Predictions (2026-11-25 23:11): NOT BLIND. A development smoke test of this exact code (scratch, 23:00-23:10)
# printed the values below, so P2-P4 are a reproduction check of the committed code, nothing more. The independent
# evidence is in the point checks: AISC Example C.1A (the analysis), Design Examples E.1D, F.1-3B and H.1B (the
# member checks), Kleinlogel's closed forms (first order), the Appendix 8 B1-B2 method (second order), equilibrium.
#   P1 Every point check passes.
#   P2 REQ-A1 PASS: largest H1 ratio 0.801, the beam under gravity + lateral (elastic lateral-torsional buckling over
#      6.0 m, Cb 1.26); columns at most 0.452 (the leeward column). Second-order drift ratio 1.02.
#   P3 REQ-A2 PASS: live-load deflection 4.10 mm against L/360 = 16.7 mm.
#   P4 REQ-A3 PASS: service drift 2.61 mm against H/400 = 10.0 mm.
#
# Results (run 20261125-231923_steel_frame_portal, scored 23:20): VERIFICATION PASS; every requirement PASSES.
#   Point checks: AISC Design Examples (C.1A drift and moments, E.1D, F.1-3B, H.1B) largest miss 0.91 % of the 1 %
#   tolerance (C.1A's first-order drift); Kleinlogel 3.6e-9; equilibrium 3e-14; B1-B2 against the exact second-order
#   moment 0.05 %; 2 against 8 segments 3e-10; alpha Pr / Pns 0.051 (tau_b = 1); drift ratio 1.020.
#   P1-P4 HELD (as reproductions, see above): largest H1 0.8006 (beam, gravity + lateral, elastic LTB, Cb 1.26);
#   columns 0.452; live deflection 4.10 mm (REQ-A2, limit 16.7); service drift 2.61 mm (REQ-A3, limit 10.0).

[case]
name = "steel_frame_portal"
model = "aisc_portal_frame"
description = "Single-bay steel portal for an equipment platform (W10x33 columns 4.0 m, W14x30 beam 6.0 m, fixed bases), AISC 360-22 LRFD by the Direct Analysis Method: member interaction H1-1, beam live-load deflection and service drift against the client's limits."
assumptions = [
  "Plane frame; rigid knees (no joint flexibility); fixed bases.",
  "Direct Analysis Method (C2): second-order analysis with P-Delta and P-delta (exact stability functions), all stiffnesses x 0.8, tau_b = 1 (checked: alpha Pr / Pns under 0.5), notional loads 0.002 Y in the lateral direction.",
  "Effective length = unbraced length (C3). Columns braced out of plane at base and beam only (4.0 m); beam laterally unbraced over its 6.0 m span (conservative; the client has not specified the bracing).",
  "Cb from each member's own second-order moment diagram (Eq. F1-1).",
  "Factored loads as given by the client (LRFD); serviceability with nominal stiffness: live-load deflection first order, drift second order with the service live load on the beam.",
  "Section properties from the AISC Shapes Database v16.0; ASTM A992 Fy 345 MPa, E 200,000 MPa.",
]
limitations = [
  "Connections, base plates and anchorage not designed (the knees and bases are assumed rigid and adequate).",
  "Out-of-plane stability of the frame (bracing members) not checked.",
  "No dynamic or fatigue assessment of the equipment loads.",
  "Synthetic client and loads.",
]

[parameters]
frame_height_m = 4.0
bay_span_m = 6.0
column_shape = "W10X33"
beam_shape = "W14X30"
youngs_modulus_MPa = 200000.0
yield_strength_MPa = 345.0
base = "fixed"
factored_gravity_kN_per_m = 35.0
factored_lateral_kN = 15.0
service_live_kN_per_m = 12.0
service_lateral_kN = 10.0
beam_unbraced_length_m = 6.0
column_unbraced_length_weak_m = 4.0

[numerics]

[verification]
benchmark_rel_tol = 0.01        # AISC examples: forces within 1 %, C.1A drift within 2 % (scaled to 1 %)
closed_form_rel_tol = 1e-6      # Kleinlogel, axially rigid model: exact up to round-off
equilibrium_rel_tol = 1e-9
b1b2_rel_tol = 0.02             # Appendix 8 is approximate; at a drift ratio near 1 it should be within 2 %
segment_rel_tol = 1e-6          # the stability-function solution is exact at the nodes

[[requirements]]
id = "REQ-A1"
text = "Every member's combined axial and flexural ratio by AISC 360-22 Eq. H1-1 (LRFD, Direct Analysis Method) shall be at most 1.0."
metric = "max_interaction_ratio"
operator = "<="
limit = 1.0
units = "-"

[[requirements]]
id = "REQ-A2"
text = "The beam's live-load deflection shall be at most L/360 (6,000 / 360 = 16.7 mm)."
metric = "live_deflection_mm"
operator = "<="
limit = 16.67
units = "mm"

[[requirements]]
id = "REQ-A3"
text = "The frame's drift under the service lateral load shall be at most H/400 (4,000 / 400 = 10.0 mm)."
metric = "service_drift_mm"
operator = "<="
limit = 10.0
units = "mm"
