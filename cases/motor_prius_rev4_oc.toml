# Study 7, revision 4 (validation/motor_ornl/CALIBRATION_PLAN.md, "Revision 4", predictions committed 1a559b4 BEFORE
# this case was written): the magnet at its design size from ORNL/TM-2004/120 Table 5.3 (19.24 x 5.31 mm) inside the
# 6.80 mm pocket drawn in ORNL/TM-2005/33 Fig. 21, with the magnet material as measured (ORNL/TM-2004/137 Fig. 14:
# Br 1.243 T, recoil permeability 1.129) and NO calibration. Three placements bracket the unknown fit: the magnet
# against the pocket's outer (air-gap side) face, centred, against its inner face; the 1.49 mm air strip fills the
# rest. Machines: models/motor/build_prius_ornl.py --design-magnet {outer,centre,inner} (HoleUD from HoleM50).
#
# Predictions (copied from the plan):
#   P1 Back-EMF 75-95 V rms line-to-line per 1000 rpm on every placement (magnetic-circuit estimate about 82; blind
#      model 110.9; ORNL measured 89.78). Within 5 % of 89.78 (85.3-94.3) would mean the geometry explains the blind
#      miss without touching the material.
#   P2 The placement moves the back-EMF by under 3 %.
#   P3 (inductances, a later case) Ld within 5 % of the blind model's: the saliency is not fixed by this.
#   P4 Every point check passes (15/15 per point as before). About 25 min (three fineness-8 solves).
# ORNL's back-EMF (the routine test) is already open (2026-11-22); this case is scored against it in the plan.
#
# Results (run 20261123-110021_motor_prius_rev4_oc, 11:00-11:54): VERIFICATION PASS, 15/15 point checks. A first run
# (20261123-105948) failed on all three points in under a minute: the new machine files were not registered in
# studies/motor_em.py's MACHINES (fixed 29ed9fd; tool-notes).
#   Back-EMF fundamental, V rms line-to-line per 1000 rpm: outer 85.31, centre 82.37, inner 79.26 (blind model 110.9).
#   ORNL's routine test: 89.78 full waveform, about 89.38 as a fundamental (our full / fundamental ratio 1.0044):
#   outer -4.6 %, centre -7.8 %, inner -11.3 %. The blind model was +23.5 %.
#   P1 HELD: 75-95 V on every placement; the outer placement is inside 5 % of ORNL, with the material as measured
#      and nothing calibrated. The drawn magnet geometry explains most of the blind miss.
#   P2 MISSED: the placement moves the back-EMF 7.6 % (outer to inner), not under 3 %: the air strip on the gap side
#      (inner placement leaves it between magnet and bridges) changes the leakage through the bridges, not only the
#      series reluctance.
#   P4 4 h: 15/15 HELD; time MISSED, 54 min, not about 25 (18 min per solve: the HoleUD mesh is finer around the
#      strips).
#   Peak at 6000 rpm: 822.5 / 796.3 / 764.5 V (REQ-M1 FAIL on every placement; ORNL measured 850).

[case]
name = "motor_prius_rev4_oc"
model = "pyleecan_femm"
description = "2004 Toyota Prius traction motor rebuilt from ORNL/TM-2005/33 Fig. 21 (radii, air gap 0.775 mm, slot, pocket thickness and position), ORNL/TM-2004/120 (bridge) and ORNL/TM-2004/137 Fig. 14 (magnet B-H line), laminations M330-35A (stand-in grade), at open circuit, 1000 rpm; Pyleecan + FEMM 4.2 magnetostatics over one electrical period (48 steps), mesh fineness 8; REVISION 4: the design magnet (TM-2004/120: 19.24 x 5.31 mm) in the drawn 6.80 mm pocket, measured remanence 1.243 T, placed outer / centre / inner; no calibration; back-EMF and the uncontrolled-generator voltage at top speed."
assumptions = [
  "2D magnetostatics (FEMM), no end effects: the stack (83.8 mm) is long against the air gap (0.775 mm), but end-winding leakage and axial fringing are not modelled.",
  "Stator, rotor, slot and pocket thickness from ORNL/TM-2005/33 Fig. 21; bridge 1.45 mm from ORNL/TM-2004/120; magnet Br 1.243 T and recoil permeability 1.129 from ORNL/TM-2004/137 Fig. 14 (temperature not stated, taken as 20 C); magnet width and winding still Pyleecan's.",
  "Laminations M330-35A, a stand-in: ORNL gives the thickness (0.36 mm) but not the grade. B-H curve from Tata Steel's typical data (50 Hz) up to 1.8 T, extrapolated above (saturation polarization 2.0 T).",
  "Magnet temperature 20 C; Br falls about 0.1 %/K, so a hot motor has a lower back-EMF (stated, not modelled here).",
  "Maximum speed 6000 rpm, the commonly published rating for this motor; ORNL's design report tabulates ratings only up to base speed.",
]
limitations = [
  "No test data in this case: the ORNL comparison is a separate, blind step.",
  "The magnet fills the pocket thickness (HoleM50); TM-2004/120 gives a thinner magnet (5.31 mm), not modelled.",
  "Line-to-line peak from the phase flux linkages with their harmonics; the inverter's own clamping is not modelled.",
  "The real lamination grade is unknown; the bracketing grades (M250-35A, a high-strength rotor grade) are separate cases.",
]

[parameters]
machine = "Toyota_Prius_ORNL.json"
speed_rpm = 1000.0
id_A = 0.0
iq_A = 0.0
mesh_fineness = 8.0
steps_per_period = 48
angle_points = 2048
max_speed_rpm = 6000.0
bus_voltage_V = 500.0
rated_torque_Nm = 400.0

[[sweep.scenarios]]
name = "outer"
machine = "Toyota_Prius_ORNL_mag531outer.json"

[[sweep.scenarios]]
name = "centre"
machine = "Toyota_Prius_ORNL_mag531centre.json"

[[sweep.scenarios]]
name = "inner"
machine = "Toyota_Prius_ORNL_mag531inner.json"

[numerics]
solver_timeout_s = 3600

[verification]
phase_symmetry_rel_tol = 1e-3
phase_shift_deg_tol = 0.5
winding_theory_rel_tol = 0.02
open_circuit_torque_rel_tol = 1e-3
mesh_noise_rel = 1e-5
gci_max = 0.01

[[requirements]]
id = "REQ-M1"
text = "With the inverter not switching (a fault at top speed), the line-to-line back-EMF peak at 6000 rpm shall not exceed the 500 V maximum bus voltage."
metric = "back_emf_LL_peak_at_max_speed_V"
operator = "<="
limit = 500.0
units = "V"
