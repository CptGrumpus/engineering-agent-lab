# Study 26 part 2, r1 (the keyed gear seat; problem, model and assumptions in cases/keyed_shaft_mesh.toml). The first
# runs (20261126-232303 mesh, 20261126-234913 check, 20261127-000418 design) showed four faults, fixed in r1:
#   (1) the near box could not see the shoulder fillet's peaks (bending about 27 deg from the keyway, on its cut face;
#       torsion on the far side of the shaft): two fillet submodels now cover the whole half ring, one quarter ring
#       each (keyless: the same 8 mm sector as before, the shaft being axisymmetric);
#   (2) peaks were read on driven faces: no peak is now read within 1 mm of one (numerics.driven_skip_mm);
#   (3) the global keyway size (0.3 mm) inverted elements at a 0.25 mm corner: now at most 0.75 r_k (0.4 mm corner:
#       unchanged);
#   (4) Le and Le's bending factor may be the axial stress: kt_key_bending_far_axial reports it beside the principal.
# Mesh-only smoke of the fillet box (00:45-01:00): the whole half ring as one box is 327 k nodes at scale 0.8 and 566
#   k at 0.64 (d36), past what SPOOLES solves; as two quarter rings 281-289 k each at 0.64 (d36) and 195-200 k at 0.8
#   (d40). The rk 0.25 global mesh at 0.1875 mm: no inverted element (minimum scaled Jacobian 0.24).
#
# This case: keyed_shaft_design repeated with the r1 model, plus the question its run raised: the DIN corner radius
# is 0.25-0.40 mm, and scaled by the 36 mm seat's rk025 ratio the 40 mm seat would fail at 0.25 mm. So: rk025
# (36 mm, corner 0.25), d38 and d40 (corner 0.40), d40_rk025 and d42_rk025 (DIN 12 x 8 for 38-44 mm; D = 1.25 d,
# fillet at the lower tolerance 0.05 d - 0.2 mm, as part 1 scaled the step).
#
# Predictions, written BEFORE the run (2026-11-27 01:05) (hand values: part 1's assessment with Kt scaled from run
# 20261127-000418):
#   P1 rk025: keyway Kt 3.82-3.90 (bending) and 3.15-3.22 (torsion), fatigue safety 1.03-1.05, yield 1.52-1.55
#      (the submodels are unchanged; only the global mesh that drives them is repaired); mesh_quality passes.
#   P2 d38 and d40 at the keyway as before within 0.2 % (fatigue 1.377 / 1.535, yield 2.017 / 2.355); their fillet
#      Kt from the new box, torsion 1.67-1.72, not governing.
#   P3 d40_rk025: keyway Kt 4.1-4.3 (bending), fatigue safety 1.30-1.40 (REQ-S1 FAIL), yield 2.05-2.15.
#   P4 d42_rk025: fatigue safety 1.50-1.60 (marginal PASS), yield 2.35-2.50: with the corner at the bottom of its
#      tolerance the smallest keyed seat is 42 mm; with "r 0.4 min" on the drawing it is 40 mm.
#   P5 Every check passes; 50-80 min.

[case]
name = "keyed_shaft_design_r1"
model = "ccx_keyed_shaft"
description = "Keyed gear seat, r1 (study 26 part 2): the 36 mm seat at the keyway's lower corner radius (0.25 mm), the 38 and 40 mm seats at 0.40 mm, and the 40 and 42 mm seats at 0.25 mm (DIN 12 x 8 keyways, D = 1.25 d, fillet 0.05 d - 0.2 mm); mesh scale 0.8."
assumptions = [
  "Linear elastic, small strain; Kt from gross nominal stresses at the small diameter; the fatigue and overload checks of part 1 (Shigley: Marin factors, Neuber notch sensitivity with each feature's own radius, von Mises combination, modified Goodman; Kf applied to the overload).",
  "Rotating bending 300 N m (fully reversed) and steady torque 500 N m act at the keyway as at the fillet (the keyway's end is 2 mm from the fillet; conservative).",
  "The key's bearing pressure on the keyway wall and any press fit of the gear are not modelled (Shigley's practice for keyseat factors).",
  "DIN 6885 form A keyway dimensions from published reproductions of the table (the current DIN 6885-1:2021 was not read); corner radius 0.25-0.40 mm.",
]
limitations = [
  "Submodels driven by a coarse global model; their boxes keep 3 mm (or more) of material between the keyway's corners and the cut faces.",
  "Stress at nodes (CalculiX's extrapolation, averaged), as part 1.",
]

[parameters]
D_mm = 45.0
d_mm = 36.0
fillet_radius_mm = 1.6
small_length_mm = 90.0
large_length_mm = 60.0
bending_moment_Nm = 300.0
torque_Nm = 500.0
youngs_modulus_MPa = 210000.0
poisson_ratio = 0.3
ultimate_MPa = 1000.0
yield_MPa = 750.0
overload_factor = 1.5
key_width_mm = 10.0
key_depth_mm = 5.0
key_corner_radius_mm = 0.4
key_gap_mm = 2.0
key_length_mm = 40.0
global_key_size_mm = 0.3
global_fillet_size_mm = 0.5
far_size_mm = 4.0
sub_key_size_rel = 0.333
sub_fillet_size_mm = 0.2
mesh_scale = 0.8
box_margin_mm = 3.0
sub_far_size_mm = 1.5
kt_reference_bending = 0.0
kt_reference_torsion = 0.0
kt_key_reference_bending = 0.0
kt_key_reference_torsion = 0.0

[sweep]
[[sweep.scenarios]]
name = "rk025"
key_corner_radius_mm = 0.25

[[sweep.scenarios]]
name = "d38"
d_mm = 38.0
D_mm = 47.5
fillet_radius_mm = 1.7

[[sweep.scenarios]]
name = "d40"
d_mm = 40.0
D_mm = 50.0
fillet_radius_mm = 1.8
key_width_mm = 12.0

[[sweep.scenarios]]
name = "d40_rk025"
d_mm = 40.0
D_mm = 50.0
fillet_radius_mm = 1.8
key_width_mm = 12.0
key_corner_radius_mm = 0.25

[[sweep.scenarios]]
name = "d42_rk025"
d_mm = 42.0
D_mm = 52.5
fillet_radius_mm = 1.9
key_width_mm = 12.0
key_corner_radius_mm = 0.25

[numerics]
parallel_solves = 6
solve_timeout_s = 7200
solver_timeout_s = 43200
driven_skip_mm = 1.0

[verification]
equilibrium_rel_tol = 1e-6
load_rel_tol = 1e-4          # 7-point rule on curved end faces: 8e-6 measured
global_sub_rel_tol = 0.02    # fillet Kt, global model against its submodel (smoke: 0.2 % bending, 1.5 % torsion)
reference_rel_tol = 0.01     # keyless fillet Kt against part 1's verified value
key_reference_rel_tol = 0.05 # Le and Le's keyseat factors (their own FE, p-adaptive to 2 % in strain energy)
min_scaled_jacobian = 0.1
gci_max = 0.01

[[requirements]]
id = "REQ-S1"
text = "The fatigue safety factor (modified Goodman, Shigley's method) shall be at least 1.5 at the shoulder fillet and at the keyway."
metric = "fatigue_safety"
operator = ">="
limit = 1.5
units = ""

[[requirements]]
id = "REQ-S2"
text = "The first-cycle yield safety factor at a 1.5 x overload shall be at least 2.0 at the shoulder fillet and at the keyway."
metric = "static_safety"
operator = ">="
limit = 2.0
units = ""
