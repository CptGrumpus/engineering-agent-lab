# Study 7, POST-TEST CALIBRATION, hypothesis A (validation/motor_ornl/CALIBRATION_PLAN.md): the committed machine
# (motor_prius_ornl_oc_mesh_r3) with only the magnet remanence changed, at 1.00 / 1.03 / 1.06 T, to find the remanence
# whose open-circuit back-EMF matches ORNL's routine back-EMF test (89.78 V rms line-to-line per 1000 rpm, full
# waveform; ours 111.25 at 1.243 T). Mesh fineness 8, as r3's finest level (GCI 0.01 %). Not validation: the back-EMF
# is the calibration data (user's rule, 2026-11-22: calibrate on the routine test, predict the rest).
#
# Prediction (before the run): back-EMF falls about 1.14 % per 1 % of remanence near 1.2 T (scratch sensitivity
# 2026-11-21, 1.243 -> 1.12 T: -11.3 %), a little less per percent at lower remanence (the bridges saturate less, so
# a slightly larger share of the flux leaks): about 87 / 90 / 92.5 V at 1.00 / 1.03 / 1.06 T, so the match near
# 1.03 T.
#
# Requirements: REQ-M1 kept for the record (it fails at any of these: about 820-860 V peak at 6000 rpm).

[case]
name = "motor_prius_cal_oc_br"
model = "pyleecan_femm"
description = "2004 Toyota Prius traction motor rebuilt from ORNL/TM-2005/33 Fig. 21 (radii, air gap 0.775 mm, slot, pocket thickness and position), ORNL/TM-2004/120 (bridge) and ORNL/TM-2004/137 Fig. 14 (magnet B-H line), laminations M330-35A (stand-in grade), at open circuit, 1000 rpm; Pyleecan + FEMM 4.2 magnetostatics over one electrical period (48 steps), mesh fineness 8, magnet remanence 1.00 / 1.03 / 1.06 T (post-test calibration); back-EMF and the uncontrolled-generator voltage at top speed."
assumptions = [
  "2D magnetostatics (FEMM), no end effects: the stack (83.8 mm) is long against the air gap (0.775 mm), but end-winding leakage and axial fringing are not modelled.",
  "Stator, rotor, slot and pocket thickness from ORNL/TM-2005/33 Fig. 21; bridge 1.45 mm from ORNL/TM-2004/120; magnet Br 1.243 T and recoil permeability 1.129 from ORNL/TM-2004/137 Fig. 14 (temperature not stated, taken as 20 C); magnet width and winding still Pyleecan's.",
  "Laminations M330-35A, a stand-in: ORNL gives the thickness (0.36 mm) but not the grade. B-H curve from Tata Steel's typical data (50 Hz) up to 1.8 T, extrapolated above (saturation polarization 2.0 T).",
  "Magnet temperature 20 C; Br falls about 0.1 %/K, so a hot motor has a lower back-EMF (stated, not modelled here).",
  "Maximum speed 6000 rpm, the commonly published rating for this motor; ORNL's design report tabulates ratings only up to base speed.",
]
limitations = [
  "No test data in this case: the ORNL comparison is a separate, blind step.",
  "The magnet fills the pocket thickness (HoleM50); TM-2004/120 gives a thinner magnet (5.31 mm), not modelled.",
  "Line-to-line peak from the phase flux linkages with their harmonics; the inverter's own clamping is not modelled.",
  "The real lamination grade is unknown; the bracketing grades (M250-35A, a high-strength rotor grade) are separate cases.",
]

[parameters]
machine = "Toyota_Prius_ORNL.json"
speed_rpm = 1000.0
id_A = 0.0
iq_A = 0.0
mesh_fineness = 8.0
steps_per_period = 48
angle_points = 2048
max_speed_rpm = 6000.0
bus_voltage_V = 500.0
rated_torque_Nm = 400.0

[[sweep.scenarios]]
name = "br1p00"
machine = "Toyota_Prius_ORNL_Br1p0000.json"

[[sweep.scenarios]]
name = "br1p03"
machine = "Toyota_Prius_ORNL_Br1p0300.json"

[[sweep.scenarios]]
name = "br1p06"
machine = "Toyota_Prius_ORNL_Br1p0600.json"

[numerics]
solver_timeout_s = 3600

[verification]
phase_symmetry_rel_tol = 1e-3
phase_shift_deg_tol = 0.5
winding_theory_rel_tol = 0.02
open_circuit_torque_rel_tol = 1e-3
mesh_noise_rel = 1e-5
gci_max = 0.01

[[requirements]]
id = "REQ-M1"
text = "With the inverter not switching (a fault at top speed), the line-to-line back-EMF peak at 6000 rpm shall not exceed the 500 V maximum bus voltage."
metric = "back_emf_LL_peak_at_max_speed_V"
operator = "<="
limit = 500.0
units = "V"
