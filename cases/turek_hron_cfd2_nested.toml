# Turek-Hron CFD2 (Re 100), mesh study revision 1: NESTED meshes (body cell size 2.5 / 1.25 / 0.625 mm,
# one base mesh split uniformly). Same model, requirements and tolerances as turek_hron_cfd2_mesh.toml.
#
# Why: lift (REQ-F2) stayed formally unverified on regenerated meshes. Gmsh remeshes the quad-dominant domain at
# each size, and four meshes of one nominal size (1.21-1.29 mm, turek_hron_cfd2_noise_a-d, 2026-11-25) scattered
# the lift by 2.45 % peak to peak (sample sd 0.97 %), as large as the move between levels, so no GCI could separate refinement from scatter.
# This revision removes the scatter instead of declaring it: numerics nested_base_cell_size_m = 0.0025 builds ONE
# 2D mesh at 2.5 mm and splits it uniformly with Gmsh's RefineMesh (each quad into four, the new nodes on the
# cylinder placed on the true circle), then extrudes it one layer (models/cfd/turek_hron_openfoam.py,
# extrude_msh22). The three levels 2.5 / 1.25 / 0.625 mm are exact subdivisions (13,047 / 52,188 / 208,752 cells,
# refinement ratio exactly 2). Model, solver settings, checks, requirements and tolerances are unchanged; no noise
# floor is declared. Smoke test (18:30-18:50, scratch, not a run): every level all hexahedra, checkMesh OK
# (non-orthogonality 34 / 42 / 45 deg, skewness 0.62 / 0.87 / 0.98), arc nodes on the circle to 1e-16 m, fluid
# cells at the flag 123 / 116 / 116 deg. OpenFOAM's refineMesh was tried first and rejected: it cut about 800
# skewed quads twice in one direction (polyhedra, skewness 6.4 at the second level).
#
# Predictions, written BEFORE the run (2026-11-25 18:52):
#   P1 Every point check passes on every level; SIMPLE converges in about 400 / 1,000 / 2,800 (the mesh study: 383 / 981 / 2,808) iterations.
#   P2 Drag: monotone, observed order 1-3, GCI under 0.3 %: REQ-F1 verified PASS; extrapolated drag within
#      0.1 % of the earlier mesh study's (136.719 N/m).
#   P3 Lift (the point of this revision): monotone (0 < R < 1), observed order 1-3, GCI under 1 %: REQ-F2
#      verified PASS; the extrapolated lift within 1 % of the benchmark (10.5343 N/m).
#   P4 The nested 1.25 mm lift lies inside the regenerated meshes' scatter at that size (10.47-10.94 N/m: the five 1.25 mm values 10.573-10.835, widened by 1 %): the nested
#      mesh is one more member of that family, not a different answer.
#   P5 40-70 min beside the running enclosure and FSI jobs.
# Decision rule: P3 held -> lift verified on page 17 (the CFD cases close); the FSI meshes stay as they are (their
# lift is checked by the coupled runs' own studies). P3 missed (oscillatory or divergent on nested meshes) -> the
# scatter was not only the topology: the base mesh may sit outside the asymptotic range for lift; next is a fourth
# level (0.3125 mm, about 835k cells, about 17 h single-core), asked of the user first. No tolerance changes either way.
#
# Results (run 20261125-185358_turek_hron_cfd2_nested, scored 19:30): VERIFICATION FAIL (lift's run-level check).
#   P1 HELD: every point check on every level; 383 / 968 / 2,754 iterations; flag cells 123 / 116 / 116 deg.
#   P2 HELD: drag 138.113 / 137.314 / 136.988 N/m, monotone, observed order 1.29, GCI 0.20 %, extrapolated 136.764
#      (0.03 % from the earlier mesh study's 136.719; 0.05 % from the benchmark): REQ-F1 verified PASS.
#   P3 MISSED: lift 10.8523 / 10.4239 / 10.3817 N/m, monotone (R 0.099) but observed order 3.34, above 1.5 x the
#      design order 2: 'anomalous order', no uncertainty (run-level FAIL). Extrapolated 10.368 (order 2) to 10.377
#      (order 3.34): 1.5-1.6 % under the benchmark, not within 1 % as predicted. REQ-F2 PASS in value, unverified.
#   P4 MISSED: the nested 1.25 mm lift (10.424) lies just under the regenerated meshes' band (10.47-10.94); the
#      nested family settles lower than the regenerated 0.625 mm mesh did (10.606).
#   P5 HELD: 34 min (18:54-19:28).
#   Decision (rule above): the coarsest level is likely outside the asymptotic range for lift; the user approved a
#   fourth level at 19:29 ("Yes, overnight"): turek_hron_cfd2_nested_r1 (1.25 / 0.625 / 0.3125 mm).

[case]
name = "turek_hron_cfd2_nested"
model = "openfoam_turek_hron"
description = "Turek-Hron CFD2: steady laminar flow (Re 100) in a 2.5 x 0.41 m channel round a cylinder (r 0.05 m) with a rigid 0.35 x 0.02 m flag; OpenFOAM 14 on NESTED Gmsh quad meshes (one 2.5 mm base split uniformly), body cell size 2.5 / 1.25 / 0.625 mm; drag and lift against the published benchmark."
assumptions = [
  "2D (one cell deep, empty front and back), as the benchmark defines it.",
  "Steady flow: the benchmark treats CFD2 (Re 100) as steady (the flag acts as a splitter plate); the SIMPLE residual targets and the settled force history check it.",
  "The flag is rigid and fixed (the CFD tests make it so by a huge stiffness and density).",
  "Inflow: the benchmark's parabolic profile at the full mean velocity (the steady tests have no time ramp).",
]
limitations = [
  "A solver-qualification case: it shows that the fluid participant reproduces the published fluid-only forces, not that the coupled result is right.",
  "Pressure outlet at 2.5 m as in the benchmark; no separate domain-length study.",
]

[parameters]
mean_velocity_m_per_s = 1.0
kinematic_viscosity_m2_per_s = 0.001
density_kg_per_m3 = 1000.0
flag_length_m = 0.35
cell_size_m = 0.0025
benchmark_drag_N_per_m = 136.7
benchmark_lift_N_per_m = 10.5343

[sweep]
parameter = "cell_size_m"
values = [0.0025, 0.00125, 0.000625]

[numerics]
max_iterations = 20000
residual_p = 1e-10
residual_U = 1e-11
nested_base_cell_size_m = 0.0025

[verification]
forces_settled_max = 1e-6
flow_rel_tol = 5e-3
mass_rel_tol = 1e-6
profile_rel_tol = 1e-6
gci_max = 0.01

[[requirements]]
id = "REQ-F1"
text = "Before it is coupled to the solid, the fluid model shall reproduce the Turek-Hron CFD2 drag within 1 %."
metric = "drag_deviation_pct"
operator = "<="
limit = 1.0
units = "%"

[[requirements]]
id = "REQ-F2"
text = "It shall reproduce the CFD2 lift within 2 % (lift is a small difference of large pressure forces, about 8 % of the drag)."
metric = "lift_deviation_pct"
operator = "<="
limit = 2.0
units = "%"
