# Turek-Hron CFD2 (Re 100), nested-mesh revision 1: the same nested family (one 2.5 mm base split uniformly)
# one level further, 1.25 / 0.625 / 0.3125 mm (52,188 / 208,752 / 835,008 cells). Same model, checks, requirements
# and tolerances as turek_hron_cfd2_nested.toml (read it for the method and the first results).
#
# Why: on 2.5 / 1.25 / 0.625 mm the lift converged monotonically but at an observed order of 3.34 (anomalous against
# the design order 2), so no uncertainty: the 2.5 mm level is likely outside the asymptotic range for lift. The
# user approved a fourth level at 19:29 ("Yes, overnight"). The two coarser levels are rerun rather than reused so
# the harness's own run-level check applies to one run, and they double as a determinism check. Only change besides
# the sweep: numerics solver_timeout_s (the OpenFOAM stage's 2 h default would stop the 0.3125 mm level).
#
# Predictions, written BEFORE the run (2026-11-25 19:31):
#   P1 Every point check passes on every level. The 1.25 and 0.625 mm levels repeat run 20261125-185358 exactly
#      (drag and lift to 1e-9 relative: the same mesh and solver). SIMPLE at 0.3125 mm takes 7,000-9,000
#      iterations (968 / 2,754 so far, about x2.9 per halving).
#   P2 Lift at 0.3125 mm 10.365-10.380 N/m (the two extrapolations above: 10.368-10.377); monotone on the three
#      finest, observed order 1.5-3, GCI under 0.5 %: REQ-F2 verified PASS, the lift settling 1.4-1.7 % under the
#      benchmark.
#   P3 Drag at 0.3125 mm 136.83-136.89 N/m; monotone, GCI under 0.15 %; extrapolated within 0.05 % of 136.764.
#   P4 6-9 h in all (the 0.3125 mm level 5.5-8 h).
# Decision rule: P2 held -> lift verified for CFD2; the 1.5 % gap to the benchmark is then a stated, verified
# difference (inside the 2 % requirement), not mesh error, and page 17 says so with the regenerated meshes' higher
# values as the contrast. P2 missed (anomalous or oscillatory again) -> the lift stays unverified in form, reported
# in value with the four-level spread; no further level.

#
# Results (run 20261125-193110_turek_hron_cfd2_nested_r1, 19:31-04:37, scored 2026-11-26 04:39): VERIFICATION FAIL
# (lift's run-level check; one point check, below).
#   Drag 137.314 / 136.988 / 136.843 N/m (1.25 / 0.625 / 0.3125 mm), monotone, observed order 1.16, GCI 0.107 %,
#   extrapolated 136.725 (0.03 % under the three-level 136.764 of run 185358; 0.02 % from the benchmark 136.7):
#   REQ-F1 verified PASS again.
#   Lift 10.4239 / 10.3817 / 10.4310 N/m: down, then UP at the finest level (R = -1.17); the harness classes it
#   divergent (oscillating, growing), no estimate. Four nested levels, 2.5 mm included: 10.8523 / 10.4239 / 10.3817 /
#   10.4310. The three finest spread 0.47 % and sit 0.98-1.45 % under the benchmark (10.5343), inside REQ-F2's 2 %
#   (PASS, unverified). Not iteration error: the finest level's lift settled to 10.43102 with a geometric-tail
#   estimate of 1e-6 N/m still to come, 1/40,000 of the 0.049 N/m reversal. Cause not diagnosed (a possibility, not
#   tested: Gmsh's refinement snaps each level's new boundary nodes onto the curved cylinder, so the family is not
#   strictly nested at the wall, and the lift, a small difference of large pressure forces, feels that most).
#   P1 MISSED: the 0.3125 mm level's forces_settled is 2.38e-6 against 1e-6 (the spread of the last 10 % of its 8,968
#      iterations, about 900: the tail of the lift's decay, 2.5e-5 N/m in all, 1e-11 N/m on the last iteration). Every other check passes on every level. The 1.25 and 0.625 mm levels repeat run 185358
#      exactly (drag, lift and iteration counts identical); 8,968 iterations, inside 7,000-9,000. The check stands as
#      failed; its tolerance is not changed after the fact.
#   P2 MISSED: lift 10.4310, above the 10.365-10.380 band, and not monotone; no GCI.
#   P3 HELD: drag 136.843 in 136.83-136.89, GCI 0.107 % under 0.15 %, extrapolated 136.725 within 0.03 % of 136.764.
#   P4 MISSED: 9 h 06 min, just over 9 h (the 0.3125 mm level 8.6 h).
#   Decision rule (P2 missed): CFD2's lift stays unverified in form, reported in value with the four-level spread;
#   no further level.

[case]
name = "turek_hron_cfd2_nested_r1"
model = "openfoam_turek_hron"
description = "Turek-Hron CFD2: steady laminar flow (Re 100) in a 2.5 x 0.41 m channel round a cylinder (r 0.05 m) with a rigid 0.35 x 0.02 m flag; OpenFOAM 14 on NESTED Gmsh quad meshes (one 2.5 mm base split uniformly), body cell size 1.25 / 0.625 / 0.3125 mm; drag and lift against the published benchmark."
assumptions = [
  "2D (one cell deep, empty front and back), as the benchmark defines it.",
  "Steady flow: the benchmark treats CFD2 (Re 100) as steady (the flag acts as a splitter plate); the SIMPLE residual targets and the settled force history check it.",
  "The flag is rigid and fixed (the CFD tests make it so by a huge stiffness and density).",
  "Inflow: the benchmark's parabolic profile at the full mean velocity (the steady tests have no time ramp).",
]
limitations = [
  "A solver-qualification case: it shows that the fluid participant reproduces the published fluid-only forces, not that the coupled result is right.",
  "Pressure outlet at 2.5 m as in the benchmark; no separate domain-length study.",
]

[parameters]
mean_velocity_m_per_s = 1.0
kinematic_viscosity_m2_per_s = 0.001
density_kg_per_m3 = 1000.0
flag_length_m = 0.35
cell_size_m = 0.0025
benchmark_drag_N_per_m = 136.7
benchmark_lift_N_per_m = 10.5343

[sweep]
parameter = "cell_size_m"
values = [0.00125, 0.000625, 0.0003125]

[numerics]
max_iterations = 20000
residual_p = 1e-10
residual_U = 1e-11
nested_base_cell_size_m = 0.0025
solver_timeout_s = 172800

[verification]
forces_settled_max = 1e-6
flow_rel_tol = 5e-3
mass_rel_tol = 1e-6
profile_rel_tol = 1e-6
gci_max = 0.01

[[requirements]]
id = "REQ-F1"
text = "Before it is coupled to the solid, the fluid model shall reproduce the Turek-Hron CFD2 drag within 1 %."
metric = "drag_deviation_pct"
operator = "<="
limit = 1.0
units = "%"

[[requirements]]
id = "REQ-F2"
text = "It shall reproduce the CFD2 lift within 2 % (lift is a small difference of large pressure forces, about 8 % of the drag)."
metric = "lift_deviation_pct"
operator = "<="
limit = 2.0
units = "%"
