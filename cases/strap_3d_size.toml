# Study 2 part 2, case 2: the largest cable hole in 3D.
#
# Why: study 2 put the largest hole at about 16.7 mm on plane stress (allowable 120 MPa). With the mid-thickness peak
# about 1.5 % higher (strap_3d_mesh, scratch trials), the limit moves down. Same sizes as study 2 near the limit, plane
# stress values from its run for each; hole-edge elements 0.267 mm (the middle of strap_3d_mesh).
#
# Predictions, written BEFORE the evidence run:
#   P1 Every point check passes at every size.
#   P2 Mid-thickness stress about 112.1 / 118.9 / 127.2 MPa at 14 / 16 / 18 mm, 1.4-1.6 % over plane stress (the factor
#      varies little over this range of t / r, 0.57 to 0.44).
#   P3 REQ-H1 passes at 14 and 16 mm, fails at 18; interpolated, the largest hole is about 16.3 mm (study 2: 16.7). The
#      recommendation (specify 16 mm) stands, its margin about 1 % instead of 2.6 %.
#   P4 A few minutes.

[case]
name = "strap_3d_size"
model = "cadquery_ccx_strap_3d"
description = "Study 2's strap as a 3D solid with a 14 / 16 / 18 mm cable hole; hole-edge elements 0.267 mm, 7 graded layers through the half thickness."
assumptions = [
  "Linear elastic, isotropic 6061-T6 (E = 68.9 GPa, nu = 0.33), as study 2; checked: peak below yield.",
  "Uniform end traction, as study 2; checked: the stress there is uniform.",
  "Hole smooth, central and straight through.",
  "The 120 MPa allowable is synthetic; compared with the largest stress on the hole edge, at mid-thickness.",
]
limitations = [
  "Mesh 0.267 mm at the hole: its uncertainty comes from strap_3d_mesh at 16 mm.",
  "No surface finish, burrs, chamfer or residual stress, as study 2.",
]

[parameters]
length_mm = 160.0
width_mm = 40.0
thickness_mm = 4.0
hole_diameter_mm = 16.0
axial_load_N = 5000.0
youngs_modulus_MPa = 68900.0
poisson_ratio = 0.33
yield_strength_MPa = 276.0
hole_element_size_mm = 0.267
far_element_size_mm = 4.0
z_layers = 0
z_ratio = 1.3
# study 2, run 20261119-235211_strap_hole_size (p04-p06)
plane_stress_peak_MPa = { "14" = 110.473, "16" = 116.988, "18" = 125.263 }

[sweep]
parameter = "hole_diameter_mm"
values = [14.0, 16.0, 18.0]

[numerics]
solver_timeout_s = 3600
threads = 4

[verification]
equilibrium_rel_tol = 1e-6
ligament_force_rel_tol = 0.01
far_field_rel_tol = 1e-3
kt_rel_tol = 0.02

[[requirements]]
id = "REQ-H1"
text = "Peak stress at the hole edge under the 5 kN service load shall not exceed 120 MPa (synthetic fatigue allowable), anywhere through the thickness."
metric = "peak_hole_stress_MPa"
operator = "<="
limit = 120.0
units = "MPa"
