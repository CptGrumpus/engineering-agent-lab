# Fatigue life of the strap with a 16 mm cable hole (chained analysis):
# CAD-to-FEA strap model (strap_hole studies) for the elastic Kt at the hole,
# then Peterson notch sensitivity (K_f), Smith-Watson-Topper mean-stress
# correction, and a Basquin S-N curve fitted to published 6061-T6 test data.
#
# Decision: the strap cycles 0 -> 5 kN in service, 1e7 times over its life.
# Is the fatigue life adequate with a scatter factor of 3 (3e7 cycles), and
# what is the highest cyclic load (R = 0) the strap can be rated for?
#
# Predictions (written BEFORE the first evidence run; Kt_net 2.246 from
# strap_hole_size at d = 16 mm, q = 0.926, K_f = 2.154; S-N fit to both data
# sets: sigma_f' = 504 MPa, b = -0.0786):
#   5 kN: 8.1e9 cycles     7 kN: 1.1e8     9 kN: 4.6e6
#   6 kN: 8.0e8            8 kN: 2.1e7     10 kN: 1.2e6
#   Rating for 3e7 cycles: 7.8 kN. Fitting only Chung & Abel gives 7.8 kN,
#   only Brodrick & Spiering 9.9 kN: the material data spread is the largest
#   uncertainty. The fitted curve at 1e9 reversals (98.8 MPa) is within 2.4 %
#   of the ASM datasheet's 96.5 MPa at 5e8 cycles.
#
# Requirements and tolerances were fixed BEFORE the first evidence run.

[case]
name = "strap_fatigue_load"
model = "strap_fatigue"
description = "6061-T6 strap, 160 x 40 x 4 mm, 16 mm central cable hole, axial load cycling from zero to a peak swept from 5 to 10 kN. Strap FE (CadQuery, Gmsh, CalculiX) for the hole-edge Kt, then notch, mean-stress and S-N fatigue models. Finds the fatigue life at the 5 kN service load and the highest cyclic load that gives 3e7 cycles."
assumptions = [
  "Elastic stress at the notch from the verified strap FE (plane stress); checked: notch peak stress below the 276 MPa yield, so no notch plasticity correction is needed.",
  "Peterson notch sensitivity with a = 0.635 mm for aluminium alloys.",
  "Smith-Watson-Topper mean-stress correction (load cycles 0 to peak, R = 0).",
  "Basquin S-N curve fitted to 25 published strain-controlled 6061-T6 test points (Chung and Abel 1988; Brodrick and Spiering 1972, via the University of Waterloo FDE database).",
  "Smooth machined hole; no surface treatment, corrosion, or fretting at the hole.",
  "Scatter factor 3 on life: 1e7 service cycles require a computed life of 3e7.",
]
limitations = [
  "All S-N test data are below 5e4 reversals; life at 1e7 cycles is an extrapolation, cross-checked against one independent high-cycle value (ASM, 96.5 MPa at 5e8 cycles).",
  "The two data sets disagree by up to 30 % in stress at long life; the rating spans 7.8 to 9.9 kN depending on which is used.",
  "Synthetic geometry, load, and life requirement. No physical fatigue tests of the part.",
]

[parameters]
length_mm = 160.0
width_mm = 40.0
thickness_mm = 4.0
hole_diameter_mm = 16.0
axial_load_N = 5000.0        # peak of the load cycle
min_load_N = 0.0             # valley of the load cycle (R = 0)
youngs_modulus_MPa = 68900.0
poisson_ratio = 0.33
yield_strength_MPa = 276.0
hole_element_size_mm = 0.4
hole_element_ratio = 0.025   # hole-edge element size / diameter, as strap_hole_size
far_element_size_mm = 4.0
sn_data_set = "both"         # both | chung_abel | brodrick_spiering

[sweep]
parameter = "axial_load_N"
values = [5000.0, 6000.0, 7000.0, 8000.0, 9000.0, 10000.0]

[numerics]
solver = "Strap FE: CalculiX 2.22 plane stress CPS6 from Gmsh 4.15 and CadQuery; fatigue: closed-form Basquin + SWT"

[verification]
equilibrium_rel_tol = 1e-6
far_field_rel_tol = 1e-3
ligament_force_rel_tol = 0.01
kt_rel_tol = 0.02             # FE Kt_net vs Peterson (model form), as strap_hole_*
hcf_crosscheck_rel_tol = 0.10 # fitted S-N amplitude at 1e9 reversals vs ASM 96.5 MPa
sn_scatter_max = 0.10         # standard deviation of log(stress) residuals of the S-N fit
round_trip_rel_tol = 1e-9     # life inverted back to stress amplitude

[[requirements]]
id = "REQ-F1"
text = "Fatigue life at the load cycle shall be at least 3e7 cycles (1e7 service cycles with a scatter factor of 3)."
metric = "fatigue_life_cycles"
operator = ">="
limit = 3.0e7
units = "cycles"
