# Study 19, turbulent flow, part 1: fully developed pipe flow with RANS (k-omega SST), first case: the mesh study at
# Re 1e5 with the low-Reynolds wall treatment (the viscous sublayer resolved).
#
# Decision this informs (synthetic framing): can our OpenFOAM RANS setup be trusted for turbulent pressure-drop
# budgets (a coolant line, a heat-exchanger passage)? The answer is judged against Prandtl's smooth-pipe law,
# 1/sqrt(f) = 2.0 log10(Re sqrt(f)) - 0.8, fitted to Nikuradse's measurements and the smooth curve of the Moody chart:
# measured data through a correlation, the first comparison with measurements in the portfolio's fluids work (the
# backward-facing step, with measured profiles, follows when its data host is reachable: BACKLOG). Blasius and
# Petukhov are reported beside it.
#
# Model (models/cfd/pipe_openfoam.py): an axisymmetric wedge (5 deg, one cell thick, one cell long, cyclic ends: the
# fully developed state), D = 0.1 m, water-like nu = 1e-6 m^2/s, bulk velocity held by meanVelocityForce, k-omega SST
# (openfoam.org v14), wall cells graded geometrically to the requested first-cell y+.
#
# Smoke test (scratch, n 80, y+ 0.5, 2026-11-22 10:38): f 0.01783, -0.90 % on Prandtl (Blasius +0.21 %, Petukhov
# -0.90 %); force balance 4e-13, bulk velocity 2e-13, gradient converged to 6e-12 by 12000 iterations; first-cell y+
# 0.25 (the cell centre, half the face height the grading targets); log law within 3.4 %. The pressure residual never
# falls in a periodic domain (pressure is a constant there), so convergence is judged on the gradient and on U, k and
# omega; residual_p is set to 1 (inactive).
#
# Mesh study: n_radial 40 / 80 / 160 with the target first-face y+ 1.0 / 0.5 / 0.25, so the whole grid is halved each
# time (refinement ratio 2).
#
# Predictions, written BEFORE the evidence run:
#   P1 Every point check passes on every mesh (y+ under 1 on all three: 0.5 / 0.25 / 0.12 at the cell centre).
#   P2 f converges monotonically, GCI under 0.5 %; finest within 0.1 % of the smoke test's 0.01783.
#   P3 f within 2 % of Prandtl on every mesh (about -0.9 %): REQ-T1 verified PASS.
#   P4 About 1 / 2 / 5 min.
#
# Results (run 20261122-104218_pipe_rans_mesh): verification FAIL (the run-level GCI, and one log-law check on n40).
#   P1 MISSED: 20/21 point checks. n40's log-law deviation is 5.08 % against 5 %; everything else passes on all three
#      (force balance <= 3e-12, bulk velocity <= 2e-13, wall shear uniform). First-cell y+ 0.49 / 0.25 / 0.13 as
#      predicted. All three runs stopped at the 15000-iteration cap with the U, k and omega residuals above 1e-9, but
#      the pressure gradient had stopped moving (change <= 3e-11 over the last 10 %), so f is iteratively converged.
#   P2 MISSED: f 0.017303 / 0.017834 / 0.018130. Monotone, but slow: observed order 0.84 where the scheme is formally
#      second order; GCI 2.6 % against the 1 % tolerance; extrapolated f 0.018504. n80 reproduced the smoke test
#      exactly (0.017834 against 0.01783), but the finest mesh moved +1.7 % from it, not within 0.1 %. The three
#      meshes are a true systematic refinement (growth 1.160 / 1.076 / 1.037, each about the square root of the one
#      before: every cell split in two), so the low order is not a grid-family artefact. Hypothesis, not yet tested:
#      SST's wall value of omega is set from the first-cell distance, so f keeps moving as the wall cell shrinks,
#      even below y+ 1; and n40 (axis cell about 7 mm) is outside the asymptotic range.
#   P3 MISSED on n40 (-3.85 %); held on n80 and n160 (-0.90 / +0.74 %). REQ-T1 is PASS (unverified) at every point,
#      because the failed GCI withholds it. The verdict is not in doubt (even the extrapolated f is +2.8 % on Prandtl,
#      inside 5 %), but the sign of the agreement is: the "about -0.9 %" was the n80 mesh's error, and the
#      mesh-converged SST answer looks likely to be 2-3 % ABOVE Prandtl.
#   P4 HELD roughly: 1.7 / 1.7 / 1.9 min, 5 min 20 s in all (time set by the iteration cap, not the mesh).
# Consequence: the Reynolds sweep (pipe_rans_reynolds, low_re points on the n80 mesh) carries about -3.6 % mesh error
# at Re 1e5 against the extrapolated value; its agreement with Prandtl is partly mesh error cancelling model error.
# Next: a revision on finer meshes (n 80 / 160 / 320, and 640 if still outside the asymptotic range), predictions first.

[case]
name = "pipe_rans_mesh"
model = "openfoam_pipe_rans"
description = "Fully developed turbulent pipe flow, Re 1e5 (D 0.1 m, nu 1e-6 m^2/s), axisymmetric periodic wedge, RANS k-omega SST, low-Reynolds wall treatment; mesh study on the radial cells (40 / 80 / 160, wall cell halved with them); friction factor against Prandtl's smooth-pipe law."
assumptions = [
  "Fully developed, steady, incompressible, axisymmetric mean flow in a hydraulically smooth pipe.",
  "RANS with the k-omega SST model (openfoam.org v14 coefficients); its form error is what this study measures.",
  "Hydraulic diameter of the wedge 2 R cos(2.5 deg) (its wall is a flat face): 0.1 % below D, used consistently.",
]
limitations = [
  "Smooth walls only; roughness (the Colebrook range) not modelled.",
  "The reference is a correlation of measurements (about +-2 % scatter in Nikuradse's smooth-pipe data), not the measurements themselves.",
]

[parameters]
diameter_m = 0.1
reynolds_number = 100000.0
kinematic_viscosity_m2_per_s = 1e-6
n_radial = 80
first_cell_yplus = 0.5
wall_treatment = "low_re"
turbulence_model = "kOmegaSST"

[[sweep.scenarios]]
name = "n40"
n_radial = 40
first_cell_yplus = 1.0

[[sweep.scenarios]]
name = "n80"
n_radial = 80
first_cell_yplus = 0.5

[[sweep.scenarios]]
name = "n160"
n_radial = 160
first_cell_yplus = 0.25

[numerics]
residual_p = 1.0        # inactive: pressure is a constant in a periodic domain
residual_U = 1e-9
residual_turb = 1e-9
max_iterations = 15000
solver_timeout_s = 7200

[verification]
mesh_study = true
force_balance_rel_tol = 1e-4   # exact in steady periodic flow; above this means unconverged or a sampling error
bulk_velocity_rel_tol = 1e-6
iterative_rel_tol = 1e-6
yplus_max_low_re = 1.0
yplus_min_wall_function = 30.0
yplus_max_wall_function = 300.0
log_law_rel_tol = 0.05         # model form: the log law's constants scatter by a few per cent
mesh_noise_rel = 1e-6
gci_max = 0.01

[[requirements]]
id = "REQ-T1"
text = "The predicted friction factor shall be within 5 % of Prandtl's smooth-pipe law (the Moody chart's smooth curve), a usable accuracy for pressure-drop budgets."
metric = "friction_abs_dev_prandtl_pct"
operator = "<="
limit = 5.0
units = "%"
