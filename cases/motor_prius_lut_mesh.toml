# Study 7, efficiency map, first case: mesh study of the dq look-up table (LUT) at one loaded point, to choose the
# mesh fineness of the full grid. Model pyleecan_femm_lut (studies/motor_lut.py; runner models/motor/pyleecan_em.py in
# its dq-grid mode): one FEMM simulation per (id, iq) over one electrical period, keeping the element fields; per core
# the iron-loss coefficients A, B, C with P = A f + B f^2 + C f^1.5 (f electrical, Hz), so one solve serves every speed.
#
# Framing (user, 2026-11-22 ~09:15, BACKLOG): motor-only efficiency; a cold / hot temperature band; mechanical losses
# left out. The efficiency map itself (copper loss, voltage limit, flux weakening) is computed from the LUT by a later
# case. ORNL test data is NOT used.
#
# Iron-loss model: M330-35A (Tata typical data, models/motor/materials/M330-35A_tata_2009.csv), three-term fit
# P = kh f B^alpha + kc (f B)^2 + ke (f B)^1.5 W/kg (kh 0.0202, alpha 1.791, kc 7.91e-5, ke 3.70e-4; 6.4 % rms, 13.5 %
# worst against the sheet), applied to each harmonic of B in each element (|B_k| = sqrt(|Bx_k|^2 + |By_k|^2): a
# rotating field counts as two orthogonal alternating ones, Pyleecan's LossModelBertotti convention), summed and
# integrated over the core mass. Core mass without the stacking factor: FEMM is given lam_fill 1 (solid steel).
#
# Smoke test (scratch, fineness 2, id -100 / iq 150 A rms, 2026-11-22 09:43): 403.45 N m; the dq torque equation gave
# 403.4 N m with sign +1 (Pyleecan's dq transform already handles the flux sign); 29 s per solve. Field check at open
# circuit: the FFT returns single-sided peak amplitudes (a tooth's fundamental 1.21 T against its 1.12 T time peak:
# a flat-topped waveform); stator |B| median 1.09 T, max 1.68 T. At the loaded point the stator is deep in saturation
# (area-mean peak |B| 1.95 T, tooth tips 2.9 T), so the loss fit (0.1-1.8 T data) is extrapolated there: stated.
# The stacking-factor division was removed after the smoke test (it counted 5 % more steel than FEMM models).
#
# Copper: 76.4 mm^2 per slot (13 strands of 0.912 mm per turn, 9 turns; see the CORRECTION note in
# motor_prius_torque_current_r1.toml), entered as slot_fill 0.5345 on the 143.0 mm^2 slot.
#
# Predictions, written BEFORE the run (no ORNL measured data opened):
#   P1 Every point check passes on every mesh; the dq torque equation within 0.5 % of FEMM's torque.
#   P2 Torque at iq 150 A: within 0.5 % of the smoke test's 403.45 N m on every mesh, GCI under 1 % (as the torque
#      mesh study: 0.055 % spread at 333 A).
#   P3 Iron loss at iq 150 A: about 3.1 kW at 6000 rpm and 0.25 kW at 1000 rpm on fineness 2 (smoke test, less the
#      5 % stacking factor), falling slightly with refinement (finer tooth-tip elements resolve the local peaks but
#      also the averaging): change under 5 % from fineness 2 to 8; GCI between 0.5 and 3 %, possibly withheld
#      (oscillatory or anomalous, as the back-EMF peak was).
#   P4 About 30 s / 75 s / 7 min per solve at fineness 2 / 4 / 8, two solves each: about 17 min.
# Decision this informs: the grid's fineness. If the fineness-4 iron loss is within 2 % of the extrapolated value,
# the grid runs at 4 (about 75 s per point); if not, at 8 on a coarser grid.

[case]
name = "motor_prius_lut_mesh"
model = "pyleecan_femm_lut"
description = "2004 Toyota Prius traction motor (our machine from ORNL Fig. 21, laminations M330-35A, magnets at 20 C), dq look-up table column at id -100 A rms, iq 0 and 150 A rms, 1000 rpm; Pyleecan + FEMM 4.2 magnetostatics over one electrical period (48 steps) with element fields; mesh fineness 2 / 4 / 8; torque, dq flux linkages and iron-loss coefficients."
assumptions = [
  "2D magnetostatics (FEMM), no end effects; torque is the mean of FEMM's stress-tensor torque over one electrical period.",
  "Iron loss from the element fields with the M330-35A three-term fit applied per harmonic; rotational fields counted as two orthogonal alternating ones; minor loops and DC bias not modelled.",
  "Core mass without the stacking factor (FEMM models the stack as solid steel, lam_fill 1).",
  "Magnet temperature 20 C (MagFEMM T_mag; Br falls 0.1 %/K).",
  "Copper 76.4 mm^2 per slot (Pyleecan's 13 x 0.912 mm strands per turn, 9 turns), consistent with ORNL's 0.84 fill on the squares of insulated wires.",
]
limitations = [
  "No test data in this case: the ORNL comparison is a separate, blind step at the end of the study.",
  "The loss fit covers 0.1-1.8 T at 50-2500 Hz; deep-saturation regions (tooth tips at load) extrapolate it.",
  "No magnet eddy-current loss, no AC copper loss (proximity, skin), no mechanical loss.",
]

[parameters]
machine = "Toyota_Prius_ORNL.json"
speed_rpm = 1000.0
id_A = -100.0
iq_min_A = 0.0
iq_max_A = 150.0
iq_steps = 2
mesh_fineness = 4.0
steps_per_period = 48
angle_points = 2048
magnet_temperature_C = 20.0
iron_kh = 0.0202
iron_alpha = 1.791
iron_kc = 7.91e-5
iron_ke = 3.70e-4
slot_fill = 0.5345
slot_area_mm2 = 143.0
turns_per_slot = 9

[sweep]
parameter = "mesh_fineness"
values = [2.0, 4.0, 8.0]

[numerics]
solver_timeout_s = 7200

[verification]
power_balance_rel_tol = 0.02
dq_torque_rel_tol = 0.005
current_rel_tol = 1e-3
mesh_noise_rel = 1e-5
gci_max = 0.02

[[requirements]]
id = "REQ-M3"
text = "The column's operating points shall stay within the 25 A/mm^2 rms copper current-density limit (marks the grid points the motor can sustain for a short time)."
metric = "current_density_max_A_per_mm2"
operator = "<="
limit = 25.0
units = "A/mm^2"
