# Largest cable hole in the aluminium strap that keeps the hole-edge peak
# stress within the 120 MPa allowable (CAD-to-FEA pipeline as strap_hole_mesh).
#
# Predictions (written BEFORE the first evidence run, from Peterson's Kt_net):
#   d =  6 mm:  95.9 MPa     d = 12 mm: 104.9 MPa     d = 16 mm: 116.4 MPa
#   d =  8 mm:  98.0 MPa     d = 14 mm: 110.0 MPa     d = 18 mm: 124.6 MPa
#   d = 10 mm: 100.9 MPa
#   The allowable is reached at about d = 16.9 mm: 16 mm passes, 18 mm fails.
#   The FE values should sit within about 1 % of these (mesh study).
#
# The mesh is the 0.25 mm hole-edge size from strap_hole_mesh, scaled down for
# small holes so the hole circumference always has at least as many elements
# as the 10 mm case (element size = 0.025 d).
#
# Requirements and tolerances were fixed BEFORE the first evidence run; they
# match strap_hole_mesh.

[case]
name = "strap_hole_size"
model = "cadquery_ccx_strap"
description = "6061-T6 aluminium strap, 160 x 40 x 4 mm, 5 kN axial service load, central cable hole swept from 6 to 18 mm. Finds the largest hole that keeps the peak hole-edge stress within 120 MPa."
assumptions = [
  "Linear elastic, isotropic 6061-T6 (E = 68.9 GPa, nu = 0.33); checked: peak stress below the 276 MPa yield strength.",
  "Plane stress; through-thickness variation at the hole neglected.",
  "Uniform end traction 70 mm or more from the hole; checked: the stress there is uniform.",
  "Hole smooth and central (quarter symmetry).",
  "The 120 MPa allowable is synthetic.",
]
limitations = [
  "Synthetic geometry, load, and allowable.",
  "Peterson's Kt is a model-form reference.",
  "No physical test data.",
]

[parameters]
length_mm = 160.0
width_mm = 40.0
thickness_mm = 4.0
hole_diameter_mm = 10.0
axial_load_N = 5000.0
youngs_modulus_MPa = 68900.0
poisson_ratio = 0.33
yield_strength_MPa = 276.0
hole_element_size_mm = 0.25    # used only if hole_element_ratio is absent
hole_element_ratio = 0.025     # hole-edge element size / hole diameter
far_element_size_mm = 4.0

[sweep]
parameter = "hole_diameter_mm"
values = [6.0, 8.0, 10.0, 12.0, 14.0, 16.0, 18.0]

[numerics]
solver = "CalculiX 2.22 static, plane stress CPS6 (Gmsh 4.15 mesh from a CadQuery STEP)"

[verification]
equilibrium_rel_tol = 1e-6
far_field_rel_tol = 1e-3
ligament_force_rel_tol = 0.01
kt_rel_tol = 0.02
gci_peak_max = 0.01

[[requirements]]
id = "REQ-H1"
text = "Peak stress at the hole edge under the 5 kN service load shall not exceed 120 MPa (synthetic fatigue allowable)."
metric = "peak_hole_stress_MPa"
operator = "<="
limit = 120.0
units = "MPa"
