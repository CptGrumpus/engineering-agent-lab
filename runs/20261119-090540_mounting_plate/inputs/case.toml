# Parametric aluminium mounting plate (CadQuery): clearance-hole size sweep
# against mass and hole-placement design rules.
#
# Requirements and tolerances were fixed BEFORE the first run. The targets were
# chosen with hand calculations so that mass and edge distance pull in opposite
# directions across the sweep (synthetic design problem).

[case]
name = "mounting_plate"
model = "cadquery_plate"
description = "6061-T6 aluminium plate 120 x 80 x 6 mm with R8 corners and a 3 x 2 grid of clearance holes on a 40 mm pitch; hole diameter swept over ISO 273 medium clearance sizes for M5 to M12 (5.5 to 13.5 mm)."
assumptions = [
  "Density 2.70 g/cm^3 (6061-T6); nominal dimensions, no manufacturing tolerances.",
  "Edge distance is measured from hole centre to the nearest straight edge; the hole grid stays clear of the corner fillets.",
  "Design rules: edge distance >= 2 d (common plate/sheet practice), web between holes >= 1.5 t.",
]
limitations = [
  "Geometry-only study: no structural or fatigue assessment of the holes.",
  "Design-rule limits are generic, not taken from a specific standard or customer specification.",
]

[parameters]
length_mm = 120.0
width_mm = 80.0
thickness_mm = 6.0
corner_radius_mm = 8.0
hole_diameter_mm = 9.0
holes_x = 3
holes_y = 2
hole_pitch_x_mm = 40.0
hole_pitch_y_mm = 40.0
density_g_per_mm3 = 0.0027

[sweep]
parameter = "hole_diameter_mm"
values = [5.5, 6.6, 9.0, 11.0, 13.5]   # M5, M6, M8, M10, M12 medium clearance

[numerics]
kernel = "OpenCASCADE via CadQuery"

[verification]
volume_rel_tol = 1e-9        # B-rep volume vs closed form, and STEP round trip
length_abs_tol_mm = 1e-6     # bounding box, hole positions and diameters

[[requirements]]
id = "REQ-P1"
text = "Plate mass shall not exceed 150 g."
metric = "mass_g"
operator = "<="
limit = 150.0
units = "g"

[[requirements]]
id = "REQ-P2"
text = "Hole centre to plate edge distance shall be at least 2 x hole diameter."
metric = "edge_distance_ratio"
operator = ">="
limit = 2.0
units = "x d"

[[requirements]]
id = "REQ-P3"
text = "The web between adjacent holes shall be at least 9 mm (1.5 x thickness)."
metric = "ligament_mm"
operator = ">="
limit = 9.0
units = "mm"
