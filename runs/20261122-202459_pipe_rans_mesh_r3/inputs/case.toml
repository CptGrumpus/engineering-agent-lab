# Study 19, pipe friction, revision 3 of pipe_rans_mesh (read pipe_rans_mesh for the framing, r1 and r2 for the
# history). Same model, checks and requirement; the mesh levels move up one (n 160 / 320 / 640, first-face y+ 0.25 /
# 0.125 / 0.0625) and all three use a 1 mm axial length, which n640 needs to pass checkMesh (aspect ratio 760).
#
# Why: r2 (run 20261122-153857) left REQ-T1 PASS but unverified: GCI 1.05 % against 1 % on n 80 / 160 / 320, the
# friction factor converging at about first order. A finer level should settle it.
#
# Probe (scratch, 2026-11-22 19:58-20:20, n640, 1 mm axial length, 80000 iterations): not converged (iterative check
# 6e-5 against 1e-6; force balance 7e-5), the pressure gradient settling slowly: 0.09207 / 0.09178 / 0.09174 /
# 0.09178 at 45000-60000 iterations, f 0.01835 from the wall shear at 80000. So n640 at 1 mm does converge, slowly
# (r1's 0.05 mm stalled; 1 mm does not), about 3500 iterations per minute alone.
#
# Predictions, written BEFORE the evidence run:
#   P1 Every point check passes, n640 included, within 300000 iterations (n640 about 150000-250000).
#   P2 n160 and n320 reproduce r2's values (0.018130, 0.018280) to 1e-5 relative: once converged, the axial length of
#      a fully developed periodic cell does not matter.
#   P3 n640 0.01834-0.01836. The triple is monotone at an observed order of about 1 (1.0-1.3), GCI 0.3-0.6 %: the
#      run-level check passes and REQ-T1 is verified PASS; extrapolated f +2.2 to +2.4 % on Prandtl (r2: +2.42 %).
#   P4 About 2 h (n640 dominates).

[case]
name = "pipe_rans_mesh_r3"
model = "openfoam_pipe_rans"
description = "Fully developed turbulent pipe flow, Re 1e5 (D 0.1 m, nu 1e-6 m^2/s), axisymmetric periodic wedge, RANS k-omega SST, low-Reynolds wall treatment; mesh study on the radial cells (160 / 320 / 640, wall cell halved with them; axial length 1 mm); friction factor against Prandtl's smooth-pipe law."
assumptions = [
  "Fully developed, steady, incompressible, axisymmetric mean flow in a hydraulically smooth pipe.",
  "RANS with the k-omega SST model (openfoam.org v14 coefficients); its form error is what this study measures.",
  "Hydraulic diameter of the wedge 2 R cos(2.5 deg) (its wall is a flat face): 0.1 % below D, used consistently.",
]
limitations = [
  "Smooth walls only; roughness (the Colebrook range) not modelled.",
  "The reference is a correlation of measurements (about +-2 % scatter in Nikuradse's smooth-pipe data), not the measurements themselves.",
]

[parameters]
diameter_m = 0.1
reynolds_number = 100000.0
kinematic_viscosity_m2_per_s = 1e-6
n_radial = 160
first_cell_yplus = 0.25
wall_treatment = "low_re"
turbulence_model = "kOmegaSST"

[[sweep.scenarios]]
name = "n160"
n_radial = 160
first_cell_yplus = 0.25

[[sweep.scenarios]]
name = "n320"
n_radial = 320
first_cell_yplus = 0.125

[[sweep.scenarios]]
name = "n640"
n_radial = 640
first_cell_yplus = 0.0625

[numerics]
residual_p = 1.0        # inactive: pressure is a constant in a periodic domain
residual_U = 1e-9
residual_turb = 1e-9
max_iterations = 300000
axial_length_m = 0.001   # aspect ratio 760 at n640 (checkMesh limit 1000); the default D/50 = 2 mm fails it there
solver_timeout_s = 14400

[verification]
mesh_study = true
force_balance_rel_tol = 1e-4   # exact in steady periodic flow; above this means unconverged or a sampling error
bulk_velocity_rel_tol = 1e-6
iterative_rel_tol = 1e-6
yplus_max_low_re = 1.0
yplus_min_wall_function = 30.0
yplus_max_wall_function = 300.0
log_law_rel_tol = 0.05         # model form: the log law's constants scatter by a few per cent
mesh_noise_rel = 1e-6
gci_max = 0.01

[[requirements]]
id = "REQ-T1"
text = "The predicted friction factor shall be within 5 % of Prandtl's smooth-pipe law (the Moody chart's smooth curve), a usable accuracy for pressure-drop budgets."
metric = "friction_abs_dev_prandtl_pct"
operator = "<="
limit = 5.0
units = "%"
