# Bolted joint: preload plus a side load, with friction contact (CalculiX). When does the joint slip,
# and when would it open? Mesh study, element size 1.0 / 0.7 / 0.5 mm.
#
# Decision (synthetic): two 6 mm steel plates are clamped by an M8 property-class 8.8 bolt
# (washer bearing diameter 13 mm, 9 mm hole) tightened to 15 kN. The joint must carry a 2 kN side
# load by friction alone (slip-critical, safety 1.25 against slip: 2.5 kN), and must not open under a
# 10 kN axial separating load. Both must hold after the joint settles (embedding).
#
# The FE answers what the hand method can only estimate: how the plates actually share the clamp
# force (their compliance, and where they press together) and the friction the interface carries
# when it slides. VDI 2230 supplies the bolt compliance and the settling amount; the joint diagram
# combines them.
#
# Prototype and smoke tests (1.0 mm, before this case's evidence run):
# - The slip plateau came out 0.54 % short of mu F_V/2 (1491.9 against 1500 N). First explanation, wrong:
#   the z support sat on a node under the nut pressure and took 41 N; moved to an unloaded rim node
#   (reaction now 1e-16), the plateau did not move. Second, wrong: friction aligned with the accumulated
#   slip; a ten times longer slide left the plateau unchanged. Cause: the washer pressure was set from
#   the exact annulus area, but the mesh's faces have chord edges, so the meshed annulus is
#   sin(dtheta)/dtheta (0.4 %) smaller and the FE clamp force was 0.4 % short. The pressure now comes from
#   the meshed face areas: plateau 2996.0 N for 3000 (1.3e-3). The rest is not yet explained; the
#   mesh study shows whether it is discretisation. Tolerance unchanged (1e-3).
# - Plate compliance 5.26e-7 mm/N against VDI 4.51e-7 (cone model); contact diameter 22.8 mm against the
#   cone limit 19.1 mm. Contact pressure read from the .frd (*CONTACT FILE): the .dat contact print lists
#   internal contact elements, not positions. About 100 s at 1.0 mm.
#
# Predictions, written BEFORE the first evidence run:
#   P1 Slip load 3.000 kN at the 15 kN assembly preload (mu F_V), to 0.1 %, on every mesh.
#   P2 Plate compliance about 5.2e-7 mm/N (FE), within 20 % of VDI's 4.5e-7; contact diameter near
#      the VDI cone limit of 19.1 mm.
#   P3 Settling of 9.5 um costs about 3.04 kN of clamp force (20 %), leaving about 11.96 kN: design
#      slip load about 2.39 kN, so REQ-J1 FAILS by about 4 %. The fix is a preload of at least
#      15.5 kN (within the bolt's capacity: 15 kN is 68 % of its proof stress).
#   P4 Opening load about 13.0 kN after settling: REQ-J2 passes.
#
# Requirements and tolerances were fixed BEFORE the first run.

[case]
name = "bolted_joint_mesh"
model = "ccx_bolted_joint"
description = "Two 6 mm steel plates clamped by an M8 8.8 bolt at 15 kN, friction 0.2: CalculiX half model with penalty friction contact, clamp then side displacement to gross slip; joint diagram with VDI 2230 bolt compliance and embedding; element size 1.0 / 0.7 / 0.5 mm."
assumptions = [
  "The bolt acts through its clamp force: uniform pressure on the washer annuli (head and nut bearing areas); its shank is not modelled and must not touch the hole (checked: slip displacement below the 0.5 mm clearance).",
  "Coulomb friction, mu = 0.2 at the plate interface (dry machined steel): synthetic.",
  "Clamped region represented by circular plates of 40 mm diameter (the VDI substitute body; checked: the pressure cone fits inside).",
  "Embedding (settling) 9.5 um: VDI 2230 Table 5 for Rz < 10 um, axial load (thread 3, head 2.5, nut 2.5, one interface 1.5): synthetic surface finish.",
  "Axial load introduced at mid-thickness of the plates (load introduction factor n = 0.5): synthetic.",
  "Linear elastic steel, small displacement.",
]
limitations = [
  "No tightening torque scatter (VDI alpha_A): the 15 kN is the minimum preload assumed after tightening.",
  "Bolt compliance, embedding and the load factor come from VDI 2230 (hand method), not from a modelled bolt.",
  "Slip under a static side load only; no cyclic loading, fretting or self-loosening.",
  "No physical test data.",
]

[parameters]
plate_outer_diameter_mm = 40.0
hole_diameter_mm = 9.0
washer_diameter_mm = 13.0
top_thickness_mm = 6.0
bottom_thickness_mm = 6.0
youngs_modulus_MPa = 210000.0
poisson_ratio = 0.3
preload_N = 15000.0
friction_coefficient = 0.2
element_size_mm = 1.0
contact_stiffness_factor = 50.0      # penalty K = 50 E / h (the roller-contact study's choice)
stick_slope_factor = 50.0            # stick slope = 50 E / h
slip_displacement_mm = 0.012         # well past gross slip (prototype: plateau from 0.004 mm)
slip_increments = 6
bolt_thread = "M8"
bolt_shank_length_mm = 8.0
bolt_free_thread_length_mm = 4.0     # clamp length 12 = shank 8 + free thread 4
bolt_proof_stress_MPa = 600.0        # property class 8.8, ISO 898-1 (S_p for d <= 16 mm about 580-600)
embedding_um = 9.5
load_introduction_factor = 0.5

[sweep]
parameter = "element_size_mm"
values = [1.0, 0.7, 0.5]

[numerics]
solver = "CalculiX 2.22 static, C3D8I, surface-to-surface penalty contact with Coulomb friction"

[verification]
slip_rel_tol = 1e-3                  # Coulomb: exact once the interface slides (penalty regularisation only)
plateau_rel_tol = 1e-4               # gross slip: force constant over the last three increments
equilibrium_rel_tol = 1e-6
plate_compliance_rel_tol = 0.25      # model form: the cone is an approximation, and the plates are about 15 % of
                                     # the joint compliance, so a 25 % error moves the design slip load by about 1 %
contact_diameter_rel_tol = 0.2       # model form
bolt_utilisation_max = 0.9
gci_max = 0.01

[[requirements]]
id = "REQ-J1"
text = "After settling, the joint shall carry 2.5 kN of side load by friction before slipping (2 kN service load, safety 1.25 against slip)."
metric = "design_slip_load_N"
operator = ">="
limit = 2500.0
units = "N"

[[requirements]]
id = "REQ-J2"
text = "After settling, the joint shall not open under a 10 kN axial separating load."
metric = "opening_load_N"
operator = ">="
limit = 10000.0
units = "N"
