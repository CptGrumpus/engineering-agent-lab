# Study 7, lamination bracket, open circuit: the final machine (as motor_prius_ornl_oc_mesh_r3) with M250-35A
# laminations instead of the stand-in M330-35A. User's decision 2026-11-22 ~00:40: bracket the unknown grade so the
# blind predictions become ranges. This grade is the lower-loss side: a higher-silicon grade that needs more field above 1.3 T (1.4 T: 642 against 428 A/m; 1.5 T: 1810 against 1027; 1.7 T: 7290 against 5409; 1.8 T: 11700 against 9677), about the same below.
# Machine file Toyota_Prius_ORNL_M250-35A.json, written by models/motor/build_prius_ornl.py --steel (same geometry and magnets).
#
# Predictions, written BEFORE the run (no ORNL measured data opened):
#   P1 Every point check passes on every mesh.
#   P2 Back-EMF about -0.35 % on r3's finest (110.884 V), range -0.7 to -0.1 %. Scaled from r3: M400-50A -> M330-35A
#      changed the iron MMF by about 90 A (teeth near 1.5 T over 33.5 mm, yoke near 1.3 T over about 60 mm) and moved the
#      back-EMF +1.08 %; M330-35A -> M250-35A adds about 29 A (mostly the teeth), so about a third of that, negative.
#   P3 Flux-linkage GCI under 1 %; REQ-M1 a fail near 1035-1040 V (its GCI may again be withheld, as on r2 and r3).
#   P4 Solve times as r3 (about 20 s / 80 s / 7 min).

[case]
name = "motor_prius_ornl_oc_m250"
model = "pyleecan_femm"
description = "2004 Toyota Prius traction motor rebuilt from ORNL/TM-2005/33 Fig. 21 (radii, air gap 0.775 mm, slot, pocket thickness and position), ORNL/TM-2004/120 (bridge) and ORNL/TM-2004/137 Fig. 14 (magnet B-H line), laminations M250-35A (bracketing grade), at open circuit, 1000 rpm; Pyleecan + FEMM 4.2 magnetostatics over one electrical period (48 steps), mesh fineness 2 / 4 / 8; back-EMF and the uncontrolled-generator voltage at top speed."
assumptions = [
  "2D magnetostatics (FEMM), no end effects: the stack (83.8 mm) is long against the air gap (0.775 mm), but end-winding leakage and axial fringing are not modelled.",
  "Stator, rotor, slot and pocket thickness from ORNL/TM-2005/33 Fig. 21; bridge 1.45 mm from ORNL/TM-2004/120; magnet Br 1.243 T and recoil permeability 1.129 from ORNL/TM-2004/137 Fig. 14 (temperature not stated, taken as 20 C); magnet width and winding still Pyleecan's.",
  "Laminations M250-35A, a bracketing grade (the real grade is unknown; the stand-in is M330-35A). B-H curve from Tata Steel's M250-35A typical data (June 2008, 50 Hz) up to 1.8 T, extrapolated above (saturation polarization 2.0 T).",
  "Magnet temperature 20 C; Br falls about 0.1 %/K, so a hot motor has a lower back-EMF (stated, not modelled here).",
  "Maximum speed 6000 rpm, the commonly published rating for this motor; ORNL's design report tabulates ratings only up to base speed.",
]
limitations = [
  "No test data in this case: the ORNL comparison is a separate, blind step.",
  "The magnet fills the pocket thickness (HoleM50); TM-2004/120 gives a thinner magnet (5.31 mm), not modelled.",
  "Line-to-line peak from the phase flux linkages with their harmonics; the inverter's own clamping is not modelled.",
]

[parameters]
machine = "Toyota_Prius_ORNL_M250-35A.json"
speed_rpm = 1000.0
id_A = 0.0
iq_A = 0.0
mesh_fineness = 1.0
steps_per_period = 48
angle_points = 2048
max_speed_rpm = 6000.0
bus_voltage_V = 500.0
rated_torque_Nm = 400.0

[sweep]
parameter = "mesh_fineness"
values = [2.0, 4.0, 8.0]

[numerics]
solver_timeout_s = 3600

[verification]
phase_symmetry_rel_tol = 1e-3
phase_shift_deg_tol = 0.5
winding_theory_rel_tol = 0.02
open_circuit_torque_rel_tol = 1e-3
mesh_noise_rel = 1e-5
gci_max = 0.01

[[requirements]]
id = "REQ-M1"
text = "With the inverter not switching (a fault at top speed), the line-to-line back-EMF peak at 6000 rpm shall not exceed the 500 V maximum bus voltage."
metric = "back_emf_LL_peak_at_max_speed_V"
operator = "<="
limit = 500.0
units = "V"
