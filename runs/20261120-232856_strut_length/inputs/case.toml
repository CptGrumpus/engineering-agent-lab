# Strut buckling: how long can a pinned aluminium strut be? Linear eigenvalue buckling, then the
# imperfect strut (geometrically nonlinear) to first yield, over a sweep of lengths.
#
# Decision (synthetic): a 6061-T6 strut of solid 25 x 16 mm section, pinned at both ends, carries
# 8 kN in compression. It must reach twice that, 16 kN, before any fibre yields, allowing for an
# initial bow of L/1000 (a typical straightness tolerance). What is the longest acceptable strut?
#
# Why the eigenvalue alone is not the answer: a real strut is never straight. Its bow grows as
# e0 / (1 - P / P_cr), so the bending stress, not the critical load, sets the capacity; the study
# runs the imperfect strut to first yield and checks the nonlinear response three ways: the
# amplification law, the Southwell plot (which recovers P_cr from the nonlinear run alone), and
# the Perry-Robertson first-yield formula. For short struts (Euler stress above half the yield)
# elastic buckling no longer governs (Johnson range); the validity check flags that.
#
# Prototype (hand runs at L = 500 mm, before this case): eigenvalue 23 134 N at 2 mm elements and
# 23 135 N at 3 mm against Euler-Engesser 23 150 N (0.07 %). The nonlinear run printed only the
# last increment while a *NODE FILE with FREQUENCY was in the step; without it every increment
# prints. 3 mm elements: 115 s per nonlinear run.
# Smoke-test findings (scratch runs at 500 mm, before the evidence run):
# - Global equilibrium in the nonlinear step was 2.9e-6 out with CalculiX's default Newton force
#   criterion (0.5 % of the average force); *CONTROLS, PARAMETERS=FIELD 1e-7, 1e-5 brings it to 2e-7.
#   The tolerance (1e-6) did not move.
# - The mode-shape check failed (1 - MAC 8e-4, then 1.1e-2): the .dat prints the static pre-buckling
#   solution before the first eigenvector, and the parser read it as mode 1. With the eigenvector
#   blocks read after "EIGENVALUE NUMBER 1", 1 - MAC = 2.5e-11. Two wrong explanations were tried
#   first (Lanczos accuracy, raised to 1e-8; the support layout, made symmetric: equal end tractions,
#   axial restraint at the midspan axis node, so the equilibrium check is exact). Both changes kept.
# - Smoke values at 500 mm: P_cr 23 136 N, Southwell 23 131 N, first yield 21 803 N (Perry-Robertson
#   22 066 N, 1.1 % apart), deflection at first yield 10.8 mm (L/46).
#
# Predictions, written BEFORE the first evidence run (validation/column_buckling.py, Engesser P_cr,
# Perry-Robertson with e0 = L/1000):
#   P1 First-yield load 33.7 / 22.1 / 15.5 / 11.5 kN at L = 400 / 500 / 600 / 700 mm, i.e. 93 to
#      97 % of the elastic critical load (36.1 / 23.2 / 16.1 / 11.8 kN): the bow costs 3 to 7 %.
#   P2 REQ-K1 passes at 400 and 500 mm and fails at 600 and 700 mm; the longest acceptable strut is
#      about 590 mm (Perry-Robertson).
#   P3 FE eigenvalues within 0.2 % of Euler-Engesser; Southwell P_cr within 0.5 % of the eigenvalue.
#   P4 Every length is in the Euler range (Euler stress 0.21 to 0.66 of half the yield stress).
#
# Requirements and tolerances were fixed BEFORE the first run.

[case]
name = "strut_length"
model = "ccx_strut"
description = "Pinned-pinned 6061-T6 strut, 25 x 16 mm solid section, in compression: CalculiX linear buckling and a geometrically nonlinear analysis with an L/1000 initial bow to first yield, at L = 400 / 500 / 600 / 700 mm; checked against Euler-Engesser, the amplification law, the Southwell plot and Perry-Robertson."
assumptions = [
  "Pins on the centroidal axis at both ends (knife-edge line supports across the width at mid-thickness).",
  "Initial bow e0 = L/1000 in the weak direction, half-sine shaped (the first buckling mode): synthetic tolerance.",
  "Load axial and concentric at the ends, uniform over the end face (dead load).",
  "Linear elastic material up to first yield (6061-T6, E = 68.9 GPa, yield 276 MPa); the analysis stops just past first yield.",
  "Elastic buckling governs; checked: Euler stress at most half the yield stress (Johnson range otherwise).",
  "Moderate deflection at first yield; checked: below 5 % of the length.",
]
limitations = [
  "No residual stresses, end eccentricity or load misalignment beyond the bow.",
  "Capacity defined as first yield, not collapse (the plastic reserve beyond first yield is not used).",
  "References are model form (beam-column theory) except the Southwell plot, which uses the FE response itself.",
  "No physical test data.",
]

[parameters]
length_mm = 500.0
width_mm = 25.0
thickness_mm = 16.0
youngs_modulus_MPa = 68900.0
poisson_ratio = 0.33
yield_strength_MPa = 276.0
element_size_mm = 3.0
imperfection_over_length = 0.001

[sweep]
parameter = "length_mm"
values = [400.0, 500.0, 600.0, 700.0]

[numerics]
solver = "CalculiX 2.22: *BUCKLE, then *STATIC NLGEOM (C3D8I)"
increments = 20
load_over_first_yield = 1.03     # nonlinear run to 3 % past Perry-Robertson first yield ...
max_load_over_critical = 0.98    # ... but never past 98 % of the FE critical load

[verification]
buckling_rel_tol = 0.01          # vs Euler-Engesser (model form: 3D solid, line supports)
mac_min = 0.999                  # first mode is the half sine in the weak direction
southwell_rel_tol = 0.01         # Southwell P_cr vs eigenvalue: two independent FE routes
imperfection_rel_tol = 0.03      # bow recovered by the Southwell intercept (an intercept: less precise)
amplification_rel_tol = 0.02     # vs e0 / (1 - P/P_cr) for P <= 0.8 P_cr (model form: small-deflection theory)
first_yield_rel_tol = 0.02       # vs Perry-Robertson (model form: beam stresses)
equilibrium_rel_tol = 1e-6
deflection_over_length_max = 0.05
thickness_over_length_max = 0.1
gci_max = 0.01

[[requirements]]
id = "REQ-K1"
text = "The strut, with an L/1000 initial bow, shall reach 16 kN (twice the 8 kN service load) before first yield."
metric = "first_yield_load_N"
operator = ">="
limit = 16000.0
units = "N"
