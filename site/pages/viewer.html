    <div class="vp" id="vp" role="region" aria-label="Result viewer">
      <div class="legend">
        <div class="legend-title" id="lg-title"></div>
        <div class="legend-body"><div class="swatches" id="lg-sw"></div><div class="ticks" id="lg-ticks"></div></div>
      </div>
      <div class="stage"><div class="vp-parts" id="vp-parts" role="group" aria-label="Results on this page" hidden></div><button class="vp-3d" id="vp-3d" type="button" aria-pressed="false" hidden>Rotate in 3D</button>
      <p class="vp-hint" id="vp-hint" hidden><span class="long">Same surface and colour bands as the render · </span>Drag to turn · <span class="long">scroll or </span>pinch to zoom<span class="long"> · double-click to reset</span></p>
      <img id="vp-img" src="{{VP_FIRST_IMG}}" alt="{{VP_FIRST_ALT}}">
      <svg class="triad" viewBox="0 0 54 54" aria-hidden="true">
        <g stroke-width="1.6" fill="none" stroke-linecap="round">
          <line x1="14" y1="40" x2="44" y2="46" stroke="#ff8f6b"/><line x1="14" y1="40" x2="34" y2="28" stroke="#8fe3a8"/><line x1="14" y1="40" x2="14" y2="8" stroke="#8fb4ff"/>
        </g>
        <g font-family="JetBrains Mono, monospace" font-size="8" fill="#edf1f8"><text x="46" y="50">X</text><text x="36" y="27">Y</text><text x="11" y="6">Z</text></g>
      </svg>
      </div>
      <div class="vp-scrub" id="vp-scrub" hidden>
        <button type="button" class="vp-play" id="vp-play" aria-label="Play the analysis step by step">▶</button>
        <input type="range" id="vp-range" min="0" max="0" step="1" value="0" aria-label="Load step">
        <output id="vp-step" for="vp-range"></output>
      </div>
      <div class="status" id="vp-status" aria-live="polite"></div>
    </div>
